# One Worker for every app's staging host. The page names the app from the
# hostname, so nothing here is per-app except the route list: Cloudflare route
# patterns reject infix wildcards, so `staging-*.maklab.net` is not expressible
# and each host is listed instead. Adding a staging app means one line here.
name = "staging-splash"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["global_fetch_strictly_public"]

routes = [
  { pattern = "staging-openkite.maklab.net/*", zone_name = "maklab.net" },
  { pattern = "staging-trade.maklab.net/*", zone_name = "maklab.net" },
]
