<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="gke_GitOps">
  <title>gke_GitOps — declarative delivery for our Kubernetes clusters</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169E1"/>
      <stop offset="50%" stop-color="#5D4ED3"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="800" height="200" rx="10" fill="url(#bg)"/>
  <rect width="800" height="200" rx="10" fill="url(#dots)"/>
  <circle cx="60" cy="46" r="44" fill="#FFFFFF" opacity="0.07"/>
  <circle cx="742" cy="156" r="58" fill="#FFFFFF" opacity="0.07"/>
  <text x="400" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="bold" fill="#FFFFFF" filter="url(#shadow)">gke_GitOps</text>
  <text x="400" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FFFFFF" opacity="0.85">Declarative delivery for our Kubernetes clusters</text>
</svg>
