<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">gke_GitOps</title>
  <desc id="desc">Add an entry to values.yaml, merge, and ArgoCD does the rest — one Application per registry entry, applied in waves with prune and self-heal.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169E1"/>
      <stop offset="50%" stop-color="#5D4ED3"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="26" fill="url(#dots)"/>
  <circle cx="80" cy="288" r="190" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="1152" cy="14" r="150" fill="#FFFFFF" opacity="0.05"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="72" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="6" fill="#CDD4FF">KUBERNETES GITOPS</text>
    <text x="68" y="158" font-size="78" font-weight="700" fill="#FFFFFF" filter="url(#shadow)">gke_GitOps</text>
    <text x="72" y="204" font-size="26" font-weight="600" fill="#FFFFFF">Every service and app lives in one registry</text>
    <text x="72" y="236" font-size="20" fill="#FFFFFF" opacity="0.88">Edit values.yaml, merge — ArgoCD does the rest</text>
    <text x="72" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#FFFFFF" opacity="0.5">registry entry → Application → waves · prune + self-heal</text>
  </g>

  <g id="reconcile-loop" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <rect x="748" y="52" width="190" height="74" rx="12" fill="#FFFFFF" opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.24"/>
    <text x="760" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#CDD4FF">registry</text>
    <text x="760" y="102" font-size="21" font-weight="700" fill="#FFFFFF">values.yaml</text>

    <line x1="942" y1="89" x2="968" y2="89" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/>
    <polygon points="972,89 958,81 958,97" fill="#FFFFFF" fill-opacity="0.85"/>

    <rect x="976" y="52" width="176" height="74" rx="12" fill="#FFFFFF" opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.24"/>
    <text x="988" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#CDD4FF">appset chart</text>
    <text x="988" y="102" font-size="20" font-weight="700" fill="#FFFFFF">ApplicationSet</text>

    <line x1="1064" y1="126" x2="1064" y2="160" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="1068,164 1060,164 1064,158" fill="#FFFFFF" fill-opacity="0.4"/>
    <circle cx="1064" cy="143" r="7" fill="none" stroke="#CDD4FF" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="1064" cy="145" r="2" fill="#FFFFFF" fill-opacity="0.8"/>

    <rect x="748" y="164" width="404" height="68" rx="12" fill="#FFFFFF" opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.24"/>
    <text x="760" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#CDD4FF">cluster</text>
    <text x="760" y="210" font-size="21" font-weight="700" fill="#FFFFFF">ArgoCD sync</text>
    <text x="760" y="224" font-size="16" fill="#FFFFFF" opacity="0.72">applies in waves · prune · self-heal</text>
  </g>
</svg>
