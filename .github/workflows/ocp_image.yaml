name: ocp_image

# Builds the OCP (open-claude-proxy) gateway image the claude-proxy chart runs.
# The image vendors a pinned OCP release tag + a pinned Claude Code CLI, because
# upstream publishes neither an npm package nor a container image. Bumping
# either version is a chart change (charts/claude-proxy/values.yaml) AND a rebuild
# — the two must be moved together, or the deployed tag will not exist.
#
# arm64 only: the cluster is k3d on OrbStack/Apple Silicon, and `ubuntu-24.04-arm`
# is a natively arm64 runner, so no QEMU emulation is involved.

on:
  workflow_dispatch:
    inputs:
      OCP_VERSION:
        description: "OCP release tag to vendor"
        required: true
        default: "v3.36.0"
      CLAUDE_CODE_VERSION:
        description: "@anthropic-ai/claude-code version to install"
        required: true
        default: "2.1.272"
  push:
    branches:
      - main
    paths:
      - images/ocp/**
      - .github/workflows/ocp_image.yaml

concurrency:
  group: ocp_image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ocp
  OCP_VERSION_DEFAULT: v3.36.0
  CLAUDE_CODE_VERSION_DEFAULT: 2.1.272
  BUILD_PLATFORMS: linux/arm64

jobs:
  build_and_push:
    name: Build and push OCP image
    # Newest STABLE arm64 runner label. ubuntu-26.04(-arm) is still preview —
    # never use it. Verified live against actions/runner-images' README.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve build inputs
        id: build_inputs
        env:
          OCP_VERSION_INPUT: ${{ inputs.OCP_VERSION }}
          CLAUDE_CODE_VERSION_INPUT: ${{ inputs.CLAUDE_CODE_VERSION }}
        run: |
          set -euo pipefail
          OCP_VERSION="${OCP_VERSION_INPUT:-$OCP_VERSION_DEFAULT}"
          CLAUDE_CODE_VERSION="${CLAUDE_CODE_VERSION_INPUT:-$CLAUDE_CODE_VERSION_DEFAULT}"
          echo "OCP_VERSION=${OCP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Resolved OCP_VERSION=${OCP_VERSION} CLAUDE_CODE_VERSION=${CLAUDE_CODE_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OCP image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: images/ocp
          file: images/ocp/Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          build-args: |
            OCP_VERSION=${{ steps.build_inputs.outputs.OCP_VERSION }}
            CLAUDE_CODE_VERSION=${{ steps.build_inputs.outputs.CLAUDE_CODE_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.build_inputs.outputs.OCP_VERSION }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.build_inputs.outputs.SHORT_SHA }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize pushed image
        env:
          IMAGE_TAG: ${{ steps.build_inputs.outputs.OCP_VERSION }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### OCP image pushed"
            echo ""
            echo "- \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- digest \`${IMAGE_DIGEST}\`"
            echo "- platform \`${BUILD_PLATFORMS}\`"
            echo ""
            echo "Reference it from \`charts/claude-proxy/values.yaml\` (image.tag) so the"
            echo "chart and the image version stay in lockstep."
          } >> "$GITHUB_STEP_SUMMARY"
