name: Helm - Lint/Test

on:
  workflow_dispatch:
    # Manual run options. Useful for re-running a PR's lint after fixing
    # CI infra, debugging a specific chart, or running on a non-PR trigger.
    inputs:
      chart:
        description: 'Specific chart path to lint (e.g. services/helm/openagent). Leave empty to lint all charts in the repo.'
        required: false
        default: ''
        type: string
      kube_version:
        description: 'Kubernetes version for kubeconform (default: 1.35.1)'
        required: false
        default: '1.35.1'
        type: string
      run_kubeconform:
        description: 'Run kubeconform validation step'
        required: false
        default: true
        type: boolean
      run_helm_unittest:
        description: 'Run helm-unittest step'
        required: false
        default: true
        type: boolean
      run_selector_check:
        description: 'Run selector-check step'
        required: false
        default: true
        type: boolean
      run_mcp_manifest_validation:
        description: 'Run MCP manifest validation step'
        required: false
        default: true
        type: boolean
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          check-latest: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Chart-Testing
        uses: helm/chart-testing-action@v2

      - name: Setup chart validation tools (kubeconform, yq, helm-unittest)
        run: |
          # kubeconform: validate rendered manifests against K8s OpenAPI schemas
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          # yq: required for selector-check script
          curl -sLo /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          # helm-unittest plugin: per-chart semantic assertions.
          # Upstream (helm-unittest/helm-unittest) — documentSelector support
          # and active maintenance. Pinned; install failure must fail the job
          # (no `|| true` — a missing plugin silently skipped all suites).
          # helm v4 verifies plugin signatures by default and the upstream
          # release ships none (--verify=false needed); helm v3 has no
          # --verify flag at all, so keep it conditional on the major version.
          if helm version --short 2>/dev/null | grep -qE '^v4'; then
            helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2 --verify=false
          else
            helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v1.1.2
          fi

      - name: Setup Doppler CLI
        uses: dopplerhq/cli-action@master

      - name: Fetch Doppler Secrets
        id: doppler
        uses: dopplerhq/secrets-fetch-action@main
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}
          doppler-project: devops
          doppler-config: ci
          inject-env-vars: true

      # Tailnet k8s access: join tailnet (tag:k8s) + client-side kubeconfig
      - name: Connect to Tailscale
        uses: tailscale/github-action@main
        with:
          authkey: ${{ env.TAILSCALE_AUTH_KEY }}

      - name: Configure kubectl
        env:
          # Token for the Doppler read below. Same GitHub secret the
          # secret-fetch step above uses to pull devops/ci.
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          # Client kubeconfig for the operator's API server proxy. Its shape is
          # pinned in Doppler (devops/ci -> TAILSCALE_KUBECONFIG) rather than
          # generated here by `tailscale configure kubeconfig`, so CI gets a
          # byte-identical file on every run. CI reads its OWN copy: the
          # interactive human copy lives in devops/svc_tailscale ->
          # TAILSCALE_KUBECONFIG, so cluster access for CI and for people can be
          # reviewed and rotated separately.
          #
          # The kubeconfig holds no credentials, and identity cannot be set in
          # it either: the proxy decides identity from the source Tailscale
          # identity and overwrites client impersonation. The runner joins the
          # tailnet with TAILSCALE_AUTH_KEY (also in devops/ci), which makes it a
          # tagged device, impersonated as its node FQDN with groups
          # [tag:k8s system:authenticated] -- the subject ci-rbac.yaml binds to
          # cluster-admin.
          mkdir -p ~/.kube
          doppler secrets get TAILSCALE_KUBECONFIG \
            --project devops --config ci --plain > ~/.kube/config
          chmod 600 ~/.kube/config

          # `kubectl config current-context` only reads the file back and makes NO
          # API call -- it stays green even when the tailnet route is dead, so it
          # certified nothing. `auth whoami` round-trips to kube-apiserver through
          # the proxy, so it fails loudly if the kubeconfig or the tailnet route
          # breaks. Note it reports IDENTITY ONLY: SelfSubjectReview is granted to
          # every authenticated user via system:basic-user, so it stays green even
          # if the tag:k8s binding below disappears.
          kubectl auth whoami

          # The permission-gated check, which is what actually asserts that
          # ci-rbac.yaml still grants the CI identity cluster-admin. Exits non-zero
          # when denied, so RBAC drift fails CI instead of degrading silently.
          kubectl auth can-i list namespaces

      - name: Grab File changes (PRs only)
        id: changed-files
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@main

      - name: Discover all charts
        id: discover
        if: github.event_name == 'workflow_dispatch' && inputs.chart == ''
        run: |
          # Manual dispatch with no `chart` input — lint all charts.
          files=$(find services/helm -maxdepth 2 -name Chart.yaml -printf '%h ')
          echo "value=${files}" >> "$GITHUB_OUTPUT"

      - name: Run Lint
        env:
          chart_input: ${{ inputs.chart }}
        run: |
          # If user specified a chart, lint that one. Otherwise use
          # changed-files (PR) or all charts (manual dispatch).
          if [ -n "$chart_input" ]; then
            ./ct_check.sh --dir "$chart_input" lint
          else
            ./ct_check.sh "${{ steps.changed-files.outputs.all_changed_files || steps.discover.outputs.value }}" lint
          fi

      - name: Validate LiteLLM ConfigMap
        if: contains(steps.changed-files.outputs.all_changed_files, 'services/helm/openagent/values.yaml') || inputs.chart == 'services/helm/openagent'
        run: |
          .useful-scripts/validate_litellm_config.sh

      - name: Validate MCP manifest (pins/timeouts/lifecycle/tool surface)
        # Runs on every PR; on a manual dispatch it can be switched off. NB: the
        # other validation steps in this workflow use `if: inputs.X != false`
        # alone, and `inputs` is empty on pull_request events - GitHub then
        # evaluates the condition as false and the step is SKIPPED while the
        # workflow still reports success. Guard on the event explicitly.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_mcp_manifest_validation != false }}
        run: |
          # Static lint of the rendered MCP manifest ConfigMap: every stdio
          # package pinned (no @latest), every server bounded by
          # connect_timeout, every stdio server carrying a recycle lifecycle,
          # parked servers kept as enabled:false, and every enabled server
          # declaring tools.include + resources/prompts — the surface the
          # preflight Job and drift CronJob certify at runtime. Same binary
          # (gitopsctl mcp verify --mode validate) runs as a pre-commit
          # hook. Static policy lives in the binary, not in a Python script.
          .useful-scripts/validate_mcp_manifest.sh

      - name: kubeconform (validate rendered manifests against K8s OpenAPI)
        # Guard on the event explicitly: `inputs.*` is EMPTY on pull_request
        # events — only workflow_dispatch populates it. A bare
        # `inputs.kube_version` therefore handed kubeconform
        # `-kubernetes-version ""`, which it rejected by printing its usage
        # and exiting 1; that failed the step and (because a failure skips
        # every later step) took helm-unittest and selector-check down with
        # it. The fallback mirrors the workflow_dispatch default declared at
        # the top of this file, and the event guard replaces the off-message
        # `inputs.X != false` pattern that silently skips on PRs.
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_kubeconform != false }}
        env:
          chart_input: ${{ inputs.chart }}
          kube_version: ${{ inputs.kube_version || '1.35.1' }}
        run: |
          # kubeconform catches malformed resources, missing required fields,
          # wrong field types — bugs that helm lint + helm template can't see.
          helm_dirs=()
          if [ -n "$chart_input" ]; then
            helm_dirs=("$chart_input")
          else
            for f in ${{ steps.changed-files.outputs.all_changed_files || steps.discover.outputs.value }}; do
              if [[ "$f" == *"/argocd-appset/"* || "$f" == *"/helm/"* ]]; then
                d=$(dirname "$f" | sed 's#^\(.*\)\(argocd-appset\|helm/[^/]*\).*#\1\2#')
                [[ ! " ${helm_dirs[@]} " =~ " ${d} " ]] && helm_dirs+=("$d")
              fi
            done
          fi
          if [ ${#helm_dirs[@]} -eq 0 ]; then echo "No charts; skipping."; exit 0; fi
          for d in "${helm_dirs[@]}"; do
            [ -f "$d/Chart.yaml" ] || continue
            helm dependency update "$d" > /dev/null 2>&1
            .useful-scripts/patch_hermes_schema.sh "$d" > /dev/null
            helm template "$d" --skip-schema-validation --validate=false > /tmp/rendered.yaml
            # -ignore-missing-schemas: skip CRDs (ExternalSecret, SGCluster,
            # VirtualService, etc.) — their schemas aren't in kubeconform's
            # built-in K8s set. Without this flag, every chart with CRDs
            # would fail the build on the first CRD it can't find a schema
            # for, even if the rest of the rendering is correct.
            kubeconform -strict -ignore-missing-schemas -summary -kubernetes-version "${kube_version}" /tmp/rendered.yaml
          done

      - name: helm-unittest (semantic assertions on rendered output)
        # See kubeconform step: guard on event, not on inputs (PRs otherwise
        # silently skip this step).
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_helm_unittest != false }}
        env:
          chart_input: ${{ inputs.chart }}
        run: |
          # helm-unittest runs per-chart unit tests (tests/<chart>/*_test.yaml)
          # that assert specific properties of the rendered output, e.g.
          # "ExternalSecret maps Doppler TUNNEL_TOKEN to K8s key 'token'".
          # Catches bugs that helm lint + kubeconform can't catch.
          helm_dirs=()
          if [ -n "$chart_input" ]; then
            helm_dirs=("$chart_input")
          else
            for f in ${{ steps.changed-files.outputs.all_changed_files || steps.discover.outputs.value }}; do
              if [[ "$f" == *"/argocd-appset/"* || "$f" == *"/helm/"* ]]; then
                d=$(dirname "$f" | sed 's#^\(.*\)\(argocd-appset\|helm/[^/]*\).*#\1\2#')
                [[ ! " ${helm_dirs[@]} " =~ " ${d} " ]] && helm_dirs+=("$d")
              fi
            done
          fi
          if [ ${#helm_dirs[@]} -eq 0 ]; then echo "No charts; skipping."; exit 0; fi
          for d in "${helm_dirs[@]}"; do
            [ -d "$d/tests" ] || continue
            .useful-scripts/helm_unittest_openagent.sh "$d"
          done

      - name: selector-check (selector.matchLabels == template.metadata.labels)
        # See kubeconform step: guard on event, not on inputs (PRs otherwise
        # silently skip this step).
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_selector_check != false }}
        env:
          chart_input: ${{ inputs.chart }}
        run: |
          # Org-wide guard: every Deployment, StatefulSet, DaemonSet, ReplicaSet
          # must have its selector.matchLabels keys be a subset of (or equal to)
          # spec.template.metadata.labels. Catches ArgoCD-stuck-OutOfSync class of
          # bug where the chart bumped a label and the live resource's
          # immutable selector no longer matches.
          helm_dirs=()
          if [ -n "$chart_input" ]; then
            helm_dirs=("$chart_input")
          else
            for f in ${{ steps.changed-files.outputs.all_changed_files || steps.discover.outputs.value }}; do
              if [[ "$f" == *"/argocd-appset/"* || "$f" == *"/helm/"* ]]; then
                d=$(dirname "$f" | sed 's#^\(.*\)\(argocd-appset\|helm/[^/]*\).*#\1\2#')
                [[ ! " ${helm_dirs[@]} " =~ " ${d} " ]] && helm_dirs+=("$d")
              fi
            done
          fi
          if [ ${#helm_dirs[@]} -eq 0 ]; then echo "No charts; skipping."; exit 0; fi
          for d in "${helm_dirs[@]}"; do
            [ -f "$d/Chart.yaml" ] || continue
            helm dependency update "$d" > /dev/null 2>&1
            .useful-scripts/patch_hermes_schema.sh "$d" > /dev/null
            helm template "$d" --skip-schema-validation --validate=false > /tmp/rendered.yaml
            .useful-scripts/check_selectors.sh /tmp/rendered.yaml
          done

      - name: Run Render (helm lint + helm template)
        if: always()  # Always run last as final sanity check
        env:
          chart_input: ${{ inputs.chart }}
        run: |
          # NOTE: This is render-only, NOT a real cluster install. The
          # selector-check, kubeconform, and helm-unittest steps above run
          # before this and catch the bugs that pure `helm template` cannot.
          if [ -n "$chart_input" ]; then
            ./ct_check.sh --dir "$chart_input" lint
          else
            ./ct_check.sh "${{ steps.changed-files.outputs.all_changed_files || steps.discover.outputs.value }}" lint
          fi
