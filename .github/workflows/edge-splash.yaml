name: Serve the staging splash from the edge

# Every staging host falls back to this page when no environment is up. Deployed
# on change only: the Worker runs at the edge, not in the cluster.
on:
  push:
    branches: [main]
    paths:
      - edge/splash/**
      - apps/helm/values.yaml
      - .github/workflows/edge-splash.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-splash
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Splash
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the worker parses
        run: node --check edge/splash/worker.js

      - name: Install the Doppler cli
        uses: dopplerhq/cli-action@v3

      - name: Fetch the Cloudflare credentials
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          token="$(doppler secrets get TF_VAR_CLOUDFLARE_API_TOKEN --project devops --config ci --plain)"
          account="$(doppler secrets get TF_VAR_CLOUDFLARE_ACCOUNT_ID --project devops --config ci --plain)"
          if [ -z "$token" ] || [ -z "$account" ]; then
            echo "Cloudflare credentials are missing from Doppler devops/ci" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          {
            echo "CLOUDFLARE_API_TOKEN=$token"
            echo "CLOUDFLARE_ACCOUNT_ID=$account"
          } >> "$GITHUB_ENV"

      - name: Install yq
        run: |
          set -euo pipefail
          sudo curl -sSLo /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # A staging host exists exactly where an app spec declares one, so the app
      # specs are the route list: adding an app needs no change to this workflow.
      - name: Resolve the staging hosts
        run: |
          set -euo pipefail
          domain="$(yq -r '.clusterDomain' apps/helm/values.yaml)"
          yq -r 'to_entries[]
                 | select(.value | type == "!!map")
                 | select((.value.enable_staging | tostring) != "false")
                 | (.value.environments.staging.subdomain // "")
                 | select(. != "")' apps/helm/values.yaml \
            | sed "s|$|.$domain|" > staging-hosts.txt
          if [ ! -s staging-hosts.txt ]; then
            echo "No app declares a staging host" >&2
            exit 1
          fi
          cat staging-hosts.txt

      - name: Deploy Splash
        run: |
          set -euo pipefail
          zone="$(yq -r '.clusterDomain' apps/helm/values.yaml)"
          work="$(mktemp -d)"
          cp edge/splash/worker.js "$work/"
          {
            cat edge/splash/wrangler.toml
            echo "routes = ["
            while read -r host; do
              printf '  { pattern = "%s/*", zone_name = "%s" },\n' "$host" "$zone"
            done < staging-hosts.txt
            echo "]"
          } > "$work/wrangler.toml"
          npx --yes wrangler@4 deploy --config "$work/wrangler.toml"
