<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 4" width="100%" height="4" preserveAspectRatio="none" role="img" aria-labelledby="title desc">
  <title id="title">Section divider</title>
  <desc id="desc">Gradient hairline separating the README hero from the body.</desc>
  <defs>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4169E1"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="4" fill="url(#rule)"/>
</svg>
