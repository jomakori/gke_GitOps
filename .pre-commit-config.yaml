# .pre-commit-config.yaml
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: end-of-file-fixer
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: [-c=.yamllint]
  - repo: https://github.com/norwoodj/helm-docs
    rev: "v1.14.2"
    hooks:
      - id: helm-docs
        args:
          # Make the tool search for charts only under the `helm` directory
          - --chart-search-root=apps/helm
          - --chart-search-root=services/helm
  - repo: local
    hooks:
      - id: validate-litellm-config
        name: Validate LiteLLM ConfigMap
        entry: .useful-scripts/validate_litellm_config.sh
        language: system
        files: ^services/helm/openagent/values\.yaml$
        pass_filenames: false
      - id: helm-template-and-kubeconform
        name: helm template + kubeconform (render-then-validate)
        description: |
          Render the touched helm chart with `helm template` and run the
          rendered manifest through `kubeconform -strict` (ignoring CRDs
          without built-in schemas). This is the same shape CI's
          `helm_lint-test.yaml` runs on every PR — the local equivalent
          catches malformed resources, missing required fields, and
          wrong field types before push.

          Why this is a smarter linter than `yamllint` on the template
          file: Helm Go-template syntax (`{{ .Release.Namespace }}`,
          `{{ .Values.x }}`, `{{- if ... -}}`) breaks every plain YAML
          parser. Rendering first means the linter sees the actual
          YAML the cluster will see, not the Go template that
          produced it.
        entry: .useful-scripts/helm_render_and_kubeconform.sh
        language: system
        files: ^services/helm/.*/templates/.*\.(yaml|yml)$
        pass_filenames: true
      - id: helm-unittest
        name: helm-unittest (semantic chart assertions)
        description: |
          Run helm-unittest suites for the openagent umbrella chart — the
          local equivalent of CI's helm-unittest step. The wrapper applies
          the hermes-agent schema patch (idempotent) and cleans the stale
          OCI subchart extract that otherwise breaks the next run. Skips
          silently when the plugin is missing (CI/devbox install it).
        entry: .useful-scripts/helm_unittest_openagent.sh
        language: system
        files: ^services/helm/openagent/
        pass_filenames: false
      - id: chart-values-reachability
        name: chart values reachability (no dead subchart config)
        description: |
          Fail when a chart declares a top-level values.yaml key that can
          never reach anything: not a dependency `name`/`alias` from
          Chart.yaml, and no template reading `.Values.<key>`.

          This is the only gate that catches the "looks wired, never
          arrived" failure class. Values nested under the wrong spelling
          (e.g. `stackgresOperator:` for a dependency named
          `stackgres-operator`) are valid YAML, render fine, and pass helm
          lint / helm template / kubeconform / ArgoCD sync — the config is
          simply never delivered. The postgres-operator chart carried ~65
          such lines (authentication.createAdminSecret, extensions.cache.*,
          grafana.autoEmbed); the only observable symptom was the live
          SGConfig disagreeing with git.

          CONVENTION THIS ENFORCES: a values key belongs either under a
          dependency's name/alias (to be routed to that subchart) or in a
          template's `.Values.<key>` (to be consumed by this chart). Never
          under a spelling that is neither.
        entry: .useful-scripts/check_values_reachability.py
        language: system
        files: ^services/helm/.*/(values\.yaml|Chart\.yaml)$
        pass_filenames: false
      - id: mcp-manifest-validate
        name: MCP manifest static policy (gitopsctl validate)
        description: |
          Render the MCP manifest ConfigMap from values.yaml and run the
          gitopsctl `mcp verify --mode validate` static policy (pins,
          timeouts, lifecycle, parked duplicates, tool surface, each npx
          server's own package cache, a uvx server's toolchain env, auth-probe
          declarations). Same binary as the CI step. Skips when the Go
          toolchain is absent.
        entry: .useful-scripts/validate_mcp_manifest.sh
        language: system
        files: ^services/helm/openagent/(values\.yaml|templates/hooks\.yaml)$
        pass_filenames: false
