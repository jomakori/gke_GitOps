# Cloudflare edge resources adopted into GitOps. devops_Terraform forgot them
# from its state (destroy = false), so every object below already exists and is
# matched by its id through crossplane.io/external-name — nothing is recreated.
#
# None of the Cloudflare ids live here; they arrive as Helm parameters from
# services/argocd-appset crossplaneAccess and the templates `required` them.
accountId: ""
clusterDomain: "maklab.net"

tunnel:
  name: maklab-cluster
  # Injected from crossplaneAccess.tunnelId.
  id: ""
  ingress:
    - hostname: "*.maklab.net"
      service: https://istio-ingressgateway.istio-system.svc:443
      originRequest:
        noTlsVerify: true
        matchSnItoHost: true
    - service: "http_status:404"

identityProvider:
  # Injected from crossplaneAccess.identityProviderId; adopted, so the id must not change.
  id: ""
  name: Google OAuth
  type: google
  # Injected from crossplaneAccess.identityProviderClientId; secret stays in Doppler.
  clientId: ""
  # ClusterSecretStore doppler-<config> must exist for this config.
  dopplerConfig: ci
  secretName: cloudflare-google-oauth
