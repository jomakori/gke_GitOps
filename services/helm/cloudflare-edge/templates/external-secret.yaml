# Google OAuth credentials for the account-level Access IdP. Same client the
# IdP already uses; only the secret is sensitive, so it never lands in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.identityProvider.secretName }}
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-{{ .Values.identityProvider.dopplerConfig | replace "_" "-" }}
  target:
    name: {{ .Values.identityProvider.secretName }}
  data:
    - secretKey: clientId
      remoteRef:
        key: GOOGLE_OAUTH_CLIENT_ID
    - secretKey: clientSecret
      remoteRef:
        key: GOOGLE_OAUTH_CLIENT_SECRET
