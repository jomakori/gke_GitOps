apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opendesign.fullname" . }}
  labels: {{- include "opendesign.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.config.apiToken }}
  OD_API_TOKEN: {{ .Values.config.apiToken | b64enc | quote }}
  {{- end }}
  {{- if and .Values.provider.endpoint (not .Values.agents.codex.OPENAI_API_KEY) }}
  CODEX_API_KEY: {{ .Values.config.apiToken | default "litellm-proxy-key" | b64enc | quote }}
  {{- end }}
