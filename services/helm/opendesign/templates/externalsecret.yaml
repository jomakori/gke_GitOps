apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opendesign-secrets
  namespace: opendesign
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-svc-openagent
  target:
    name: opendesign-secrets
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: LITELLM_MASTER_KEY
    # Claude Code's native OAuth token (devops/svc_openagent). Lets Claude Code
    # auth directly against api.anthropic.com, bypassing LiteLLM/responses-proxy/
    # claude-proxy entirely. Same Doppler config already backs claude-proxy's
    # CLAUDE_CODE_OAUTH_TOKEN via doppler-svc-openagent -- just surfacing the
    # existing key here too.
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: CLAUDE_CODE_OAUTH_TOKEN
