# Single source of truth for the domain
domain: design.maklab.net

# AI provider backend (LiteLLM via responses-proxy: filters Codex custom tools,
# translates Responses API, forwards to LiteLLM -> claude-proxy -> Claude)
provider:
  endpoint: "http://responses-proxy.openagent.svc.cluster.local:4524/v1"
  model: "claude-sonnet-5"
  apiKeyRef: "opendesign-secrets"
  apiKeyKey: "LITELLM_MASTER_KEY"
  # stdio MCP server exposed to the Codex agent (create_artifact etc.)
  # mcpArgs is a pre-quoted TOML array string (Helm toJson strips quoting)
  mcpCommand: "/usr/local/bin/node"
  mcpArgs: '["/app/apps/daemon/dist/cli.js", "mcp", "--daemon-url", "http://127.0.0.1:7456"]'

# App runtime config — domain is resolved from top-level
config:
  disableApiAuth: 1
  bindHost: "0.0.0.0"
  allowedOrigins: ""
  publicBaseUrl: ""
  apiToken: ""

# Code agent harnesses — empty = template fills from provider
agents:
  codex:
    OPENAI_BASE_URL: ""
    OPENAI_API_KEY: ""
  claude:
    ANTHROPIC_BASE_URL: ""
    ANTHROPIC_API_KEY: ""

# Auth proxy sidecar (disabled = CF Access handles auth)
enable_auth_proxy: false

# Storage
replicaCount: 1
storage:
  size: 10Gi
  class: local-path

resources:
  limits:
    cpu: 2
    # Observed peak working set is ~1007MiB (re-verified 7d max: 1007MiB /
    # 1,055,911,936 B); at a 1Gi limit the container was OOMKilled (exit 137) on
    # agent runs. 2Gi is 1.95x the verified max and leaves room for a cold
    # Codex/MCP start, so the limit stays.
    memory: 2Gi
  requests:
    cpu: 500m
    # 768Mi, down from 1Gi. A request is a scheduling reservation, not a ceiling:
    # the verified p50 is 460Mi and the max 1007Mi, so 1Gi reserved for the peak
    # of a bursty agent. 768Mi still sits 1.7x above the median and only the
    # cold-start spike exceeds it — which the 2Gi limit absorbs.
    memory: 768Mi

# Service
service:
  type: ClusterIP
  port: 80

# Image
image:
  repository: ghcr.io/nexu-io/od
  tag: latest
  pullPolicy: IfNotPresent
