# Docs: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd
#
# ArgoCD manages itself from this chart. Ported from the Terraform values
# (devops_Terraform/k8s-maklab-cluster/helm/argocd-values.yaml) with two deliberate
# changes: server.insecure is now false and global.domain is set. The Application is named `argo-cd` on purpose:
# the release name drives every Service name (argo-cd-argocd-server, ...) and the
# Istio VirtualService, webhook and Terraform root apps pin them. Do not rename.
#
# Overrides live under the upstream chart's key.
argo-cd:
  # External endpoint. global.domain feeds the chart's default configs.cm.url
  # (https://<domain>), which ArgoCD uses for SSO/Dex callbacks, notification links
  # and CLI/UI redirects. Without it the live release carries the chart's
  # placeholder https://argocd.example.com.
  global:
    domain: argocd.maklab.net
    podAntiAffinity: hard

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ Application Controller                                                   │
  # └──────────────────────────────────────────────────────────────────────────┘
  controller:
    replicas: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        memory: "3Gi"
    pdb:
      enabled: true
      minAvailable: 1

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ ConfigMap                                                                │
  # └──────────────────────────────────────────────────────────────────────────┘
  configs:
    params:
      # Secure mode: argocd-server terminates TLS itself (self-signed cert unless a
      # argocd-server-tls Secret exists) and 307-redirects plain HTTP to HTTPS. The
      # Istio VirtualService must therefore target port 443 and originate TLS — see
      # docs/argocd-self-manage.md. Was `true` in the Terraform install.
      server.insecure: false
    cm:
      create: true
      exec.enabled: true
      helm.timeout: 300
      # Health check for ExternalSecret: apps use a wave −1 ExternalSecret as a
      # pre-sync hook (e.g. tailscale operator-oauth, excalidash-secrets).
      # Without this, ArgoCD cannot assess the hook's health and the sync hangs
      # forever on "waiting for healthy state of external-secrets.io/ExternalSecret".
      resource.customizations.health.external-secrets.io_ExternalSecret: |
        hs = {}
        if obj.status ~= nil then
          for _, condition in ipairs(obj.status.conditions or {}) do
            if condition.type == "Ready" then
              if condition.status == "True" then
                hs.status = "Healthy"
                hs.message = condition.message
              else
                hs.status = "Degraded"
                hs.message = condition.message
              end
            end
          end
        end
        if hs.status == nil then
          hs.status = "Progressing"
          hs.message = "Waiting for ExternalSecret to sync"
        end
        return hs
      # Health check for CronJob: the openagent chart ships CronJob/openagent-mcp-drift,
      # which runs every 15 min and intentionally exits non-zero when MCP drift is
      # detected. ArgoCD's built-in CronJob health check marks that "Degraded"
      # ("CronJob has not completed its last execution successfully") whenever
      # lastSuccessfulTime < lastScheduleTime, which blocks auto-sync retries
      # ("Skipping auto-sync: will not retry for revision") and needs a manual patch.
      # This custom check keeps the drift signal visible in Job logs while reporting
      # the CronJob Healthy, so a real drift finding does not take the whole
      # Application's sync/health hostage.
      resource.customizations.health.batch_CronJob: |
        hs = {}
        -- Suspended CronJobs do not run; surface them as Suspended.
        if obj.spec ~= nil and obj.spec.suspend == true then
          hs.status = "Suspended"
          hs.message = "CronJob is suspended"
          return hs
        end
        -- No status yet: the CronJob has not been scheduled.
        if obj.status == nil or obj.status.lastScheduleTime == nil then
          hs.status = "Healthy"
          hs.message = "CronJob has not been scheduled yet"
          return hs
        end
        -- The CronJob has been scheduled. If the last run did not succeed, report
        -- Healthy (not Degraded, not Progressing) so ArgoCD keeps the app in sync
        -- and keeps retrying; the drift signal stays visible in the Job's logs.
        if obj.status.lastSuccessfulTime == nil or obj.status.lastSuccessfulTime < obj.status.lastScheduleTime then
          hs.status = "Healthy"
          hs.message = "Last scheduled run did not succeed — check Job logs (drift?)"
          return hs
        end
        hs.status = "Healthy"
        hs.message = "CronJob completed its last scheduled run successfully"
        return hs

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ API Server                                                               │
  # └──────────────────────────────────────────────────────────────────────────┘
  server:
    replicas: 2
    resources:
      requests:
        cpu: "250m"
        memory: "256Mi"
      limits:
        memory: "384Mi"
    pdb:
      enabled: true
      minAvailable: 1
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 70
    ingressGrpc:
      enabled: false
    ingress:
      enabled: false
    service:
      labels:
        app: argocd-server
      type: NodePort

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ Repo Server                                                              │
  # └──────────────────────────────────────────────────────────────────────────┘
  repoServer:
    replicas: 2
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        memory: "768Mi"
    pdb:
      enabled: true
      minAvailable: 1
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 70

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ ApplicationSet Controller                                                │
  # └──────────────────────────────────────────────────────────────────────────┘
  applicationSet:
    replicas: 2
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: "250m"
        memory: "192Mi"
      limits:
        memory: "256Mi"

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ Redis                                                                    │
  # └──────────────────────────────────────────────────────────────────────────┘
  # Redis runs the timeseries/ReJSON/search modules and had OOMKilled 21 times at
  # the 512Mi limit (historical cgroup count; the Sept 2026 node-OOM reset its
  # containers too). 1Gi limit to match controller/repoServer's availability bump.
  redis:
    resources:
      requests:
        cpu: "250m"
        memory: "64Mi"
      limits:
        memory: "256Mi"
    pdb:
      enabled: true
      minAvailable: 1

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ Dex Server                                                               │
  # └──────────────────────────────────────────────────────────────────────────┘
  dex:
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "256Mi"

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ Notifications Controller                                                 │
  # └──────────────────────────────────────────────────────────────────────────┘
  notifications:
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        memory: "192Mi"
