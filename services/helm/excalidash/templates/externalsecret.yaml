apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: excalidash-secrets
  namespace: excalidash
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    # Derived from the appset-injected `dopplerConfig` (see the ClusterSecretStore
    # generator in services/helm/external-secrets). Hardcoding the store name here
    # made `dopplerConfig` decorative: changing it silently did nothing. Renders
    # `doppler-svc-excalidash` for the default `svc_excalidash`.
    name: doppler-{{ .Values.dopplerConfig | default "svc_excalidash" | replace "_" "-" }}
  target:
    # Chart renders envFrom secretRef as "<fullname>-<key>" -> key `secrets`
    # gives the clean, directly-fetchable name `excalidash-secrets`.
    # Merge policy writes Doppler values into the chart-managed secret.
    name: excalidash-secrets
    creationPolicy: Merge
  # Always dynamic: fetch ALL keys from the Doppler config, so new secrets
  # added in Doppler flow in without a chart change.
  dataFrom:
    - find:
        name:
          regexp: ".*"
