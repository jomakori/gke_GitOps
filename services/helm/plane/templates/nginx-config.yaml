apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-nginx-config
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
data:
  default.conf: |
    server {
        listen 3000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 100m;

        # Plane API (same-origin proxy — the frontend image ships a stock nginx
        # with NO /api proxy, so the SPA loads but every API call 404s)
        location /api/ {
            proxy_pass http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /uploads/ {
            proxy_pass http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
