apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-nginx-config
  labels:
    {{- include "plane.commonLabels" $ | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 4;

    events {
      worker_connections 1024;
    }

    http {
      include mime.types;

      default_type  application/octet-stream;

      set_real_ip_from        0.0.0.0/0;
      real_ip_recursive       on;
      real_ip_header          X-Forwarded-For;
      limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

      access_log /dev/stdout;
      error_log /dev/stderr;

      server {
        listen 3000;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 100m;

        # Plane API (same-origin proxy — the frontend image ships a stock nginx
        # with NO /api proxy, so the SPA loads but every API call 404s)
        location /api/ {
          proxy_pass http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:8000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 300s;
        }

        location /uploads/ {
          proxy_pass http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:8000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout 300s;
        }

        location / {
          root   /usr/share/nginx/html;
          index  index.html index.htm;
          try_files $uri $uri/ /index.html;
        }
      }
    }
