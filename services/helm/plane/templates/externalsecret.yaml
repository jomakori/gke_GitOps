# Env secrets for Plane from the shared Doppler postgres config (svc_postgres_operator).
# Keeps DB URL / secret keys out of git; syncs with the pg-main secret store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-app-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-svc-postgres-operator
  target:
    name: plane-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: PLANE_SECRET_KEY
    - secretKey: LIVE_SERVER_SECRET_KEY
      remoteRef:
        key: PLANE_LIVE_SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: PLANE_DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: PLANE_REDIS_URL
    - secretKey: AMQP_URL
      remoteRef:
        key: PLANE_AMQP_URL
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-live-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-svc-postgres-operator
  target:
    name: plane-live-secrets
    creationPolicy: Owner
  data:
    - secretKey: LIVE_SERVER_SECRET_KEY
      remoteRef:
        key: PLANE_LIVE_SECRET_KEY
    - secretKey: REDIS_URL
      remoteRef:
        key: PLANE_REDIS_URL
