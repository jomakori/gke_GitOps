# Crossplane core. The upstream chart installs the controller, CRDs and the
# crossplane-system namespace.
crossplane:
  enabled: true
  replicas: 1
  # Gates WatchOperation/CronOperation/Operation (ops.crossplane.io/v1alpha1).
  # The upstream deployment template appends .Values.args AFTER "core start"
  # (charts/crossplane/templates/deployment.yaml) — this list must contain
  # ONLY the extra flag, never "core"/"start" themselves.
  args:
    - --enable-operations

provider:
  # Upstream publishes linux/amd64 only. v0.4.2-jomakori.4 is the fork build of
  # the same release: native amd64 + arm64 legs, index carries both platforms
  # and the package extensions.
  package: ghcr.io/jomakori/provider-cloudflare-zero:v0.4.2-jomakori.4
  packagePullPolicy: IfNotPresent
  # Bumped by hand when the provider package changes; Argo prunes old revisions.
  revisionActivationPolicy: Automatic

functions:
  patchAndTransform:
    package: ghcr.io/crossplane-contrib/function-patch-and-transform:v0.11.1
  autoReady:
    package: ghcr.io/crossplane-contrib/function-auto-ready:v0.7.1
  # Operation-mode function (capabilities: composition, operation). Runs the
  # audience-sync pipeline in templates/audience-sync.yaml.
  python:
    package: ghcr.io/crossplane-contrib/function-python:v0.6.0

# Force-applies the istio RequestAuthentication/cf-access-jwt audience list
# from every CloudflareAccessApp XR's `.status.aud` (WatchOperation +
# CronOperation, templates/audience-sync.yaml + templates/rbac.yaml). Only
# `audiences` is dynamic here; issuer/jwks/selector/headers are reproduced
# verbatim by the Python pipeline step and never come from argocd-appset.
audienceSync:
  # Injected by argocd-appset from the single `accessTeamDomain` SSOT
  # (services/argocd-appset/values.yaml) — do not add a second copy.
  teamDomain: ""
  namespace: istio-system
  name: cf-access-jwt
  schedule: "*/10 * * * *"

cloudflare:
  # API token comes from Doppler (CF_API_TOKEN) through the cluster's
  # ClusterSecretStore; the provider expects it as {"api_token": "..."}.
  dopplerConfig: svc_cloudflare
  secretName: cloudflare-api
  secretStoreName: doppler-svc-cloudflare
  secretStoreKind: ClusterSecretStore
  secretRefreshInterval: 24h

# Default policy for every CloudflareAccessApp: allow anyone who cleared the
# account's identity provider (Google today), which is what the Terraform
# managed apps did with `include { everyone {} }`.
access:
  defaultSessionDuration: 24h
