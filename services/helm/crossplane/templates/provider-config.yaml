apiVersion: upjet-cloudflare.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    # The CRD ships inside the provider package, so it exists only once the
    # provider revision is healthy — Argo has to retry past the first miss.
    argocd.argoproj.io/sync-wave: "2"
spec:
  credentials:
    source: Secret
    secretRef:
      name: {{ .Values.cloudflare.secretName }}
      namespace: crossplane-system
      key: credentials
