apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: cloudflareaccessapps.platform.maklab.net
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  compositeTypeRef:
    apiVersion: platform.maklab.net/v1alpha1
    kind: CloudflareAccessApp
  mode: Pipeline
  pipeline:
    - step: access-application
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: access-application
            base:
              apiVersion: zero.upjet-cloudflare.upbound.io/v1alpha1
              kind: TrustAccessApplication
              spec:
                # Git owns the Access apps: the provider creates an app when the
                # XR carries no appId, adopts an existing one by id, and
                # reconciles policy and session changes from here on.
                managementPolicies:
                  - "*"
                forProvider:
                  type: self_hosted
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.accountId
                toFieldPath: spec.forProvider.accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.host
                toFieldPath: spec.forProvider.domain
              - type: FromCompositeFieldPath
                fromFieldPath: spec.sessionDuration
                toFieldPath: spec.forProvider.sessionDuration
              - type: FromCompositeFieldPath
                fromFieldPath: spec.policies
                toFieldPath: spec.forProvider.policies
              # Adopt an existing app by id; with no appId the patch is skipped
              # and the provider creates the app itself. Combine drops the patch
              # when a variable is missing, which is the default Optional policy.
              # The provider imports by "<accounts>/<account_id>/<app_id>", a
              # bare app id fails with "expected urlencoded segments".
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.accountId
                    - fromFieldPath: spec.appId
                  strategy: string
                  string:
                    fmt: "accounts/%s/%s"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              # Surface the issued audience on the XR so the istio app's
              # virtualServices.<name>.aud can be filled without reading the MR.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.aud
                toFieldPath: status.aud
    - step: ready
      functionRef:
        name: function-auto-ready
