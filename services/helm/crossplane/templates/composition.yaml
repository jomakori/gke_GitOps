apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: cloudflareaccessapps.platform.maklab.net
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  compositeTypeRef:
    apiVersion: platform.maklab.net/v1alpha1
    kind: CloudflareAccessApp
  mode: Pipeline
  pipeline:
    - step: access-application
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: access-application
            base:
              apiVersion: zero.upjet-cloudflare.upbound.io/v1alpha1
              kind: TrustAccessApplication
              spec:
                # The Access apps predate this chart and are still edited in
                # Cloudflare, so the managed resource observes them: it reads
                # status (the issued aud) back and never writes. Flip to ["*"]
                # once policy/session changes are meant to flow from Git.
                managementPolicies:
                  - Observe
                forProvider:
                  type: self_hosted
                providerConfigRef:
                  name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.accountId
                toFieldPath: spec.forProvider.accountId
              - type: FromCompositeFieldPath
                fromFieldPath: spec.host
                toFieldPath: spec.forProvider.domain
              - type: FromCompositeFieldPath
                fromFieldPath: spec.sessionDuration
                toFieldPath: spec.forProvider.sessionDuration
              - type: FromCompositeFieldPath
                fromFieldPath: spec.policies
                toFieldPath: spec.forProvider.policies
              # Adopt the existing app by id instead of creating a duplicate.
              # The provider imports by "<accounts>/<account_id>/<app_id>", a
              # bare app id fails with "expected urlencoded segments".
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.accountId
                    - fromFieldPath: spec.appId
                  toFieldPath: metadata.annotations[crossplane.io/external-name]
                  strategy: string
                  string:
                    fmt: "accounts/%s/%s"
              # Surface the issued audience on the XR so the istio app's
              # virtualServices.<name>.aud can be filled without reading the MR.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.aud
                toFieldPath: status.aud
    - step: ready
      functionRef:
        name: function-auto-ready
