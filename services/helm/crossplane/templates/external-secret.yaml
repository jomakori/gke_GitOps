apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api
  namespace: crossplane-system
  annotations:
    # After the core chart has created crossplane-system.
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    kind: {{ .Values.cloudflare.secretStoreKind }}
    name: {{ .Values.cloudflare.secretStoreName }}
  refreshInterval: {{ .Values.cloudflare.secretRefreshInterval }}
  target:
    name: {{ .Values.cloudflare.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The upjet provider reads a JSON credentials blob, not a raw token.
        credentials: '{"api_token":"{{ "{{" }} .CF_API_TOKEN {{ "}}" }}"}'
  data:
    - secretKey: CF_API_TOKEN
      remoteRef:
        key: CF_API_TOKEN
