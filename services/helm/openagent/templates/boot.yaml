{{- if .Values.hermes.enabled }}
# Gateway boot entrypoint (the stdlib-only Go CLI gitopsctl, built in CI from
# .useful-scripts/gitopsctl and shipped as its own image):
#   - openagent-boot-script: the shim below, mounted at /opt/boot/boot.sh. It
#     hands over to the gitopsctl binary that the gitopsctl-install init
#     container copied onto the PVC, falling back to a plain gateway start if it
#     is missing. Nothing is compiled in-pod, so there is no Go source tree to
#     mount — and Helm could not read one outside the chart directory anyway.
# The pod command stays a single line — `exec sh /opt/boot/boot.sh` (values
# hermes-agent.command) so the toolchain can change without a pod-spec diff.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openagent-boot-script
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: boot-script
  annotations:
    # Rendered with (just before) the workload so the pod can mount it.
    argocd.argoproj.io/sync-wave: "-1"
data:
  boot.sh: |
    #!/bin/sh
    # gitopsctl shim — gateway pod entrypoint (values hermes-agent.command).
    # The binary is placed on the PVC by the gitopsctl-install init container, so
    # nothing is compiled here: this is a handover, not a bootstrap. It falls back to
    # a plain gateway start if the binary is absent, so a bad image can never leave
    # the pod unable to start (the MCP preflight Job is what certifies the binary).
    set -u
    if [ ! -x /opt/data/bin/gitopsctl ]; then
      echo "WARN: gitopsctl missing on the PVC — starting the gateway without the boot toolchain" >&2
      exec /init hermes gateway run
    fi
    exec /opt/data/bin/gitopsctl boot "$@"
{{- end }}
