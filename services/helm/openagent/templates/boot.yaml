{{- if .Values.hermes.enabled }}
# Gateway boot toolchain (replaces the old python boot.sh flow with the
# stdlib-only Go CLI in extras/, module hermes-tools):
#   - openagent-boot-script: 5-line shim → installs mise, builds hermes-tools
#     once onto the PVC from the mounted Go sources, then execs `hermes-tools
#     boot` (falls back to `exec /init hermes gateway run` if the build fails).
#   - openagent-tools-src: the Go sources (extras/ tree) mounted at /opt/src.
# The pod command stays a single line — `exec sh /opt/boot/boot.sh` (values
# hermes-agent.command) so the toolchain can change without a pod-spec diff.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openagent-boot-script
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: boot-script
  annotations:
    # Rendered with (just before) the workload so the pod can mount it.
    argocd.argoproj.io/sync-wave: "-1"
data:
  boot.sh: |
{{ .Files.Get "extras/shims/boot.sh" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openagent-tools-src
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: tools-src
  annotations:
    # Rendered with (just before) the workload so the pod can mount it.
    argocd.argoproj.io/sync-wave: "-1"
# Keys mirror the extras/ tree (mount = /opt/src in values → build dir).
# Kubelet projects slash keys as nested paths; helm-unittest does not need
# these keys (they are build inputs, not assertions).
data:
  go.mod: |
{{ .Files.Get "extras/go.mod" | indent 4 }}
{{- range $p, $_ := .Files.Glob "extras/cmd/**" }}
  {{ $p | trimPrefix "extras/" }}: |
{{ $.Files.Get $p | indent 4 }}
{{- end }}
{{- range $p, $_ := .Files.Glob "extras/internal/**" }}
  {{ $p | trimPrefix "extras/" }}: |
{{ $.Files.Get $p | indent 4 }}
{{- end }}
{{- end }}
