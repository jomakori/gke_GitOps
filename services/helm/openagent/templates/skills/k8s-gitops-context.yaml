    - **Terraform**: `/Users/maklab/devops_Terraform/k8s-maklab-cluster/`
    - **GitOps**: `/Users/maklab/gke_GitOps/`
    - **Doppler**: project `devops`, config `ci` (TF_VAR_) / `svc_*` (per-service)
    - **GHCR**: `ghcr.io/jomakori/k3s-iscsi`
    - **TF Cloud**: `tf_jmakori/k8s-maklab-cluster`
    {{- else }}
    ## Repo Locations

    - **Doppler**: project `devops`, config `ci` (TF_VAR_) / `svc_*` (per-service)
    - **GHCR**: `ghcr.io/jomakori/k3s-iscsi`
