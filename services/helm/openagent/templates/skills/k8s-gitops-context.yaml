apiVersion: v1
kind: ConfigMap
metadata:
  name: openagent-k8s-gitops-context
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: openagent
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  k8s-gitops-context.md: |
    # K8s GitOps Context

    {{- if eq .Values.runtimeMode "local" }}

    ## Repo Pair — LOCAL PATHS (subagents: read from these)

    | Repo | Absolute Path | Purpose |
    |------|--------------|---------|
    | Terraform | `/Users/maklab/devops_Terraform` | ArgoCD + CF Tunnel + CF Access + Tailscale. Cluster (k3d/OrbStack) is OUT-OF-BAND, not Terraform-managed. |
    | GitOps | `/Users/maklab/gke_GitOps` | ArgoCD App-of-Apps deploys all services/apps (synced on merge). |

    **Subagents MUST read these absolute paths — never assume relative paths.**
    {{- else }}

    ## Repo Pair

    | Repo | GitHub MCP | Workspace Path |
    |------|------------|----------------|
    | Terraform | `github_get_file_contents`, `github_search_repositories` | `/workspace/repos/devops_Terraform` |
    | GitOps | `github_get_file_contents`, `github_search_repositories` | `/workspace/repos/gke_GitOps` |

    **Access via GitHub MCP (preferred) or k8s workspace paths.**
    {{- end }}

    ## System Graph

    ```
    ┌──────────────────────────────────────────────────────────────────┐
    │ Terraform (devops_Terraform/k8s-maklab-cluster)                  │
    │   TF Cloud ws: tf_jmakori/k8s-maklab-cluster                     │
    │                                                                  │
    │   1-k8s.tf         CoreDNS (cluster is OUT-OF-BAND)              │
    │   2-eso.tf         doppler-machine-token Secret                  │
    │   3-managed_services.tf  helm_release.argocd                     │
    │   4-gitops.tf      services App + github webhook                 │
    │   5-cloudflare-tunnel.tf  tunnel + wildcard DNS + token          │
    │   6-cloudflare-access.tf  3 standalone CF Access apps + AUDs     │
    │   7-tailscale.tf   oauth client + doppler svc_tailscale          │
    │   moves/imports/removed.tf  drift reconcile (idempotent)         │
    └───────────────┬──────────────────────────────────────────────────┘
                    │ kubectl (tailscale kubeconfig)
    ┌───────────────▼──────────────────────────────────────────────────┐
    │ k3d cluster (OrbStack) — provisioned OUT-OF-BAND                 │
    │   ArgoCD (NodePort, insecure)                                    │
    │   CoreDNS: forward . /etc/resolv.conf                            │
    └───────────────┬──────────────────────────────────────────────────┘
                    │ ArgoCD syncs gke_GitOps (App-of-Apps)
    ┌───────────────▼──────────────────────────────────────────────────┐
    │ gke_GitOps services/argocd-appset (sync waves 0-6)               │
    │   wave 0: cert-manager, metrics-server, vpa                      │
    │   wave 1: external-secrets (ClusterSecretStores)                 │
    │   wave 2: istio umbrella (CRDs + control plane + gateway)        │
    │   wave 3: cloudflare-tunnel                                     │
    │   wave 4: external-dns, postgres-operator                        │
    │   wave 5: kube-prometheus-stack                                 │
    │   wave 6+: apps (demoApi, notesUi)                              │
    └───────────────┬──────────────────────────────────────────────────┘
                    │ ExternalSecrets (dataFrom.find.regexp ".*")
    ┌───────────────▼──────────────────────────────────────────────────┐
    │ Doppler (devops project)                                         │
    │   ci config → TF_VAR_* secrets                                   │
    │   svc_* configs → per-service secrets                            │
    └──────────────────────────────────────────────────────────────────┘
    ```

    ## Cluster (k3s/k3d on OrbStack)

    - **OUT-OF-BAND**: Terraform does NOT create the cluster. Provisioned manually via k3d. The old `minikube_cluster` resource is commented out in `1-k8s.tf`; `removed.tf` has `removed { destroy = false }` blocks for `minikube_cluster` + `local_path_config` so they can never be re-created or destroy live infra.
    - **Kubeconfig**: not a Terraform output. Clients use `tailscale configure kubeconfig tailscale-operator.tail2354a3.ts.net` (Tailscale k8s operator `apiServerProxyConfig`).
    - **Custom image** `ghcr.io/jomakori/k3s-iscsi:v1.35.1-k3s1` — `open-iscsi` pre-installed, now a no-op (Longhorn removed). Storage = `local-path` only.
    - **CoreDNS**: `forward . /etc/resolv.conf`. The old minikube `hosts { host.minikube.internal }` block and dynamic `data.external.k3d_dns` override are gone.

    ## Terraform Drift Reconcile Files

    One-shot blocks aligning state with the live k3s cluster. **Idempotent** — no-op once consumed, safe to re-plan.

    | File | Purpose |
    |------|---------|
    | `moves.tf` | `moved` blocks renaming CF Access apps from legacy `private["..."]` map → standalone (`excalidash_private`, `grafana_private`, `openagent_private`). State-only rename. |
    | `imports.tf` | `import { to = doppler_config.svc_tailscale; id = "devops.svc.svc_tailscale" }` — resource in Doppler/API but never in state. |
    | `removed.tf` | `removed { destroy = false }` — drops legacy `doppler_secret.access_audience_tag` / `cf_access_auds` / `argocd_webhook_github_secret` / `terraform_data.k3d_ready` + defensive `minikube_cluster` / `local_path_config`. Live objects stay. |

    ## CF Access (Cloudflare Zero Trust)

    - **3 standalone per-host apps** (NOT for_each, no `var.private_services`): `grafana_private`, `openagent_private`, `excalidash_private`. Each at `<host>.${clusterDomain}`.
    - **AUD → Doppler**: each app's `.aud` pushed as its own secret: `CF_ACCESS_AUD_GRAFANA` / `CF_ACCESS_AUD_OPENAGENT` / `CF_ACCESS_AUD_EXCALIDASH`.
    - **Aggregated legacy secrets dropped**: `CF_ACCESS_AUDS` + `access_audience_tag` (removed.tf). `TF_VAR_ACCESS_AUDIENCE_TAG` (Doppler) still feeds `accessAudienceTag` in `4-gitops.tf` → ArgoCD → istio RequestAuthentication.
    - **Google OAuth IdP** (`google_oauth`) with `GOOGLE_OAUTH_CLIENT_ID` / `GOOGLE_OAUTH_CLIENT_SECRET` (Doppler).

    ## Secrets Chain

    ```
    Doppler → TF stores DOPPLER_TOKEN as K8s Secret "doppler-machine-token"
      → ClusterSecretStore (doppler-{config}) → ExternalSecret
        (sync-wave -1, dataFrom.find.regexp ".*", refreshInterval 24h, creationPolicy Owner)
          → K8s Secret (keys = Doppler exactly) → pod secretKeyRef
    ```

    **Doppler is source of truth** — shape keys to match what the app expects. No `data` mappings (postgres-operator legacy exception: `ADMIN_USER`→`k8sUsername`). Never hardcode secrets in values.yaml/charts.

    | Store | Project | Config |
    |-------|---------|--------|
    | `doppler-svc-grafana` | devops | svc_grafana |
    | `doppler-svc-cloudflare` | devops | svc_cloudflare |
    | `doppler-svc-postgres-operator` | devops | svc_postgres_operator |
    | `doppler-zurabase-{dev,stg,prd}` | zurabase | dev/stg/prd |

    ## ArgoCD Sync Waves

    | Wave | Purpose | Services |
    |------|---------|----------|
    | 0 | Init | metrics-server, cert-manager, vpa |
    | 1 | Secrets | external-secrets (retryLimit 5, Replace) |
    | 2 | Core networking | istio umbrella (ServerSideApply) |
    | 3 | Edge networking | cloudflare-tunnel |
    | 4 | Operators | external-dns, postgres-operator (skipCrds) |
    | 5 | General | kube-prometheus-stack (ServerSideApply) |
    | 6+ | Apps | demoApi, notesUi |

    Dependencies earlier, apps last. `enable_public`/`enable_private` mutually exclusive (template `fail`s if both set).

    ## Helm Chart Patterns (gke_GitOps)

    - **Thin wrapper** (upstream dep only): cert-manager, metrics-server, vpa
    - **Custom** (no upstream): cloudflare-tunnel
    - **Hybrid** (upstream + local templates): external-dns, external-secrets, istio, kube-prometheus-stack, postgres-operator
    - **Umbrella** (preferred for 2+ components): `openagent` — remote OCI deps + local `file://` subcharts, CRDs/shared only at umbrella `templates/`. **Gotcha**: root `.gitignore` `**charts/**` blocks local subcharts — add `!services/helm/<chart>/charts/<subchart>/**` exception.

    ## Istio + Networking

    - **Umbrella chart** `services/helm/istio/` — base + istiod + ingress-gateway deps + 7 local templates (Gateway, ClusterIssuer, Certificate, VirtualServices). **Ambient mode** (no sidecars).
    - **Gateway** `maklab-gateway` in `istio-system`, wildcard `*.${clusterDomain}`, TLS via cert-manager `wildcard-maklab-net-tls`.
    - **CF Access JWT**: `request-authentication.yaml` extracts JWT from `Cf-Access-Jwt-Assertion` header (NOT `Authorization: Bearer`); `authorization-policy-private.yaml` DENYs without valid JWT.
    - **ExternalDNS**: upsert-only, Cloudflare provider, filters on `clusterDomain`.

    ## Cloudflare Tunnel

    - **Provider v5** syntax (`cloudflare_zero_trust_tunnel_cloudflared*`, `cloudflare_dns_record` with `content`/`ttl`).
    - **SNI gotcha (most common)**: `origin_request.match_sni_to_host = true` (NOT `match_sn_ito_host` — missing `i` silently fails).
    - Tunnel token → Doppler `TUNNEL_TOKEN` (svc_cloudflare) → cloudflare-tunnel chart via ExternalSecret. Config resource can't be destroyed from TF.

    ## OpenAgent (Hermes Loop-Engineering System)

    Umbrella chart `services/helm/openagent/` — orchestrated AI execution (decompose → delegate → review → iterate). Remote OCI deps: litellm-helm, hermes-agent. Local subcharts: headroom, hermes-workspace, claude-proxy.

    **10 personas** (swarm workers): sisyphus/atlas/prometheus (claude/sonnet-5), metis/momus (deepseek-v4-pro), oracle (claude/opus-5), hephaestus (minimax/M3), sisyphus-junior (deepseek-v4-flash), librarian/explore (zai/glm-4.7-flash).

    **LLM routing**: all traffic → LiteLLM (port 4000) → provider APIs. Headroom provides CCR cache. 14 models configured; claude models route via claude-proxy (OAuth, not API key).

    **CLIs** (hermes-workspace init container, ARM64): terraform, helm, kubectl, gitleaks, doppler, jq, git, pre-commit.

    ## Critical Gotchas

    - **SNI** `match_sni_to_host` (has `i`) — typo silently fails Terraform.
    - **CF Access JWT header** — `fromHeaders: [{name: Cf-Access-Jwt-Assertion}]`, else `RBAC: access denied` after OAuth.
    - **ExternalSecrets** use `dataFrom.find.regexp: ".*"` + `creationPolicy: Owner` — ESO overwrites non-Doppler keys on sync.
    - **Storage = local-path only** — no volume expansion. Longhorn removed (OrbStack lacks iSCSI/hugepages).
    - **Helm dependency `alias`** breaks Service selectors (`app.kubernetes.io/name` labels change) → Endpoints `<none>`.
    - **GHCR credential ExternalSecret** blocks initial ArgoCD sync (CRD-not-found) — gate on `ghcrCredential.enable`.
    - **Claude proxy** — OAuth creds from `~/.claude/.credentials.json` (manual secret, not Doppler); `HOST=0.0.0.0` required; `MODEL_ALIASES` sed patch is fragile.
    - **Dashboard 0.0.0.0 bind** requires `HERMES_DASHBOARD_BASIC_AUTH_*` (Doppler `svc_openagent`).
    - **StackGres endpoint** — `{clusterName}.{namespace}.svc.cluster.local` (not double-nested).
    - **LiteLLM health probes** exhaust Claude subscription rate limits — tune `cooldown_time`/`allowed_fails`.

    {{- if eq .Values.runtimeMode "local" }}
