    | opencode/big-pickle | openai (OpenCode) | OPENCODE_API_KEY |
    | opencode/nemotron-3-ultra-free | openai (OpenCode) | OPENCODE_API_KEY |
    | opencode/laguna-s-2.1-free | openai (OpenCode) | OPENCODE_API_KEY |
    | opencode/mimo-v2.5-free | openai (OpenCode) | OPENCODE_API_KEY |
    | anthropic/claude-opus-4-7 | anthropic (native) | ANTHROPIC_API_KEY |
    | moonshotai/kimi-k2.6 | moonshot (native) | MOONSHOT_API_KEY |
    | deepseek-v4-flash | deepseek (native) | DEEPSEEK_API_KEY |
    | deepseek-v4-pro | deepseek (native) | DEEPSEEK_API_KEY |
