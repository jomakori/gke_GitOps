{{- if .Values.hermes.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openagent-hermes-hooks
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  HOOK.yaml: |
    name: discord-session-link
    description: >
      Posts a dashboard session link to the Discord channel when a new
      session starts. Fires on agent:start (which carries chat_id).
      Tracks seen session_ids in-process to post only once per session.
    events:
      - agent:start
  handler.py: |
    """Discord session-link hook.

    Fires on ``agent:start`` — the event that carries ``chat_id`` (the
    Discord channel ID).  On the first message of a new session the hook
    POSTs a dashboard link back to that channel via the Discord REST API.

    The hook is fire-and-forget: errors are logged but never raised,
    so a failure here can't block the agent pipeline.
    """

    from __future__ import annotations

    import os
    import aiohttp

    # ── Config ────────────────────────────────────────────────────────
    _DASHBOARD_BASE = os.environ.get(
        "DASHBOARD_BASE_URL", "https://openagent.maklab.net"
    )
    _DISCORD_API = "https://discord.com/api/v10"

    # ── In-process seen-set (caps at 500 to bound memory) ─────────────
    _seen: set[str] = set()
    _MAX_SEEN = 500

    async def handle(event_type: str, context: dict) -> None:
        """Entry point called by HookRegistry.emit()."""
        if event_type != "agent:start":
            return

        platform = context.get("platform", "")
        if platform != "discord":
            return

        session_id = context.get("session_id", "")
        chat_id = context.get("chat_id", "")
        if not session_id or not chat_id:
            return

        # Only post once per session
        if session_id in _seen:
            return
        _seen.add(session_id)
        if len(_seen) > _MAX_SEEN:
            _seen.clear()
            _seen.add(session_id)

        token = os.environ.get("DISCORD_BOT_TOKEN", "")
        if not token:
            print("[session-link-hook] DISCORD_BOT_TOKEN not set, skipping",
                  flush=True)
            return

        # The dashboard is nesquena/hermes-webui in gateway thin-client mode,
        # with the agent's state.db mounted read-only (agentState in the webui
        # subchart). The webui's session discoverability resolves agent session
        # ids from state.db, and its canonical permalink route is /session/<id>
        # (NOT /chat/<id> — see index.html base-href + sessions.js self-heal).
        # /session/{session_id} opens the exact agent conversation in the webui.
        url = f"{_DASHBOARD_BASE}/session/{session_id}"
        # For Discord threads, chat_id is already the thread channel ID.
        api_url = f"{_DISCORD_API}/channels/{chat_id}/messages"
        headers = {
            "Authorization": f"Bot {token}",
            "Content-Type": "application/json",
        }
        payload = {"content": f"📊 **Session dashboard**\n{url}"}

        try:
            timeout = aiohttp.ClientTimeout(total=10)
            async with aiohttp.ClientSession(timeout=timeout) as sess:
                async with sess.post(api_url, headers=headers,
                                     json=payload) as resp:
                    if resp.status in (200, 201):
                        print(
                            f"[session-link-hook] Posted dashboard link for "
                            f"session {session_id} to channel {chat_id}",
                            flush=True,
                        )
                    else:
                        body = await resp.text()
                        print(
                            f"[session-link-hook] Discord API {resp.status}: "
                            f"{body[:300]}",
                            flush=True,
                        )
        except Exception as exc:
            print(
                f"[session-link-hook] Failed to post dashboard link: {exc}",
                flush=True,
            )
{{- end }}

---
{{- if .Values.hermes.enabled }}
# The rendered MCP manifest. The gateway's boot pre-warm and the preflight /
# drift Jobs (stdlib Go CLI hermes-tools, built on the PVC by the boot shim)
# read the server definitions from here, so the manifest stays the single
# source of truth (no second copy of the pins to drift).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openagent-mcp-manifest
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-manifest
  annotations:
    # Rendered with (just before) the workload so the pod and the PostSync
    # preflight Job can both mount it.
    argocd.argoproj.io/sync-wave: "-1"
data:
  # Dot-free keys on purpose: helm-unittest's assertion path syntax treats '.'
  # and '[]' as separators, so keys containing a dot cannot be addressed from
  # tests/mcp_manifest_test.yaml. hermes-tools `mcp verify --mode validate` is
  # the exhaustive every-server check; these keys make the same invariants
  # assertable per server in helm-unittest.
  mcp-manifest: |
{{ (index .Values "hermes-agent" "config" "mcp_servers") | toJson | indent 4 }}
{{- range $name, $server := (index .Values "hermes-agent" "config" "mcp_servers") }}
  server-{{ $name }}: {{ $server | toJson | quote }}
{{- end }}
{{- end }}

---
{{- if and .Values.hermes.enabled .Values.mcpVerification.preflight.enabled }}
# Preflight certification of the MCP manifest. For every enabled server it does
# a real JSON-RPC initialize + tools/list and asserts the declared tool surface
# (tools.include) is present. A failure fails the sync AND prints the server's
# own stderr — the detail Hermes discards.
apiVersion: batch/v1
kind: Job
metadata:
  name: openagent-mcp-preflight
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-preflight
  annotations:
    # PostSync, not PreSync: the check needs the manifest ConfigMap, the PVC and
    # the boot-installed toolchain, all of which the main sync creates.
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "5"
spec:
  backoffLimit: {{ .Values.mcpVerification.preflight.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.mcpVerification.preflight.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "openagent.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-preflight
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
      initContainers:
        # PostSync can beat the gateway's first boot; wait (bounded) until the
        # boot shim has built hermes-tools and pre-warm exposed the mise
        # toolchain (npx/uvx) on the PVC.
        - name: wait-for-toolchain
          image: "{{ include "openagent.hermesImage" . }}"
          imagePullPolicy: {{ (index .Values "hermes-agent" "image").pullPolicy }}
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          command:
            - sh
            - -c
            - |
              for _ in $(seq 1 {{ div .Values.mcpVerification.preflight.toolchainWaitSeconds 5 }}); do
                [ -x /opt/data/bin/hermes-tools ] && [ -x /opt/data/bin/npx ] && [ -x /opt/data/bin/uvx ] && exit 0
                sleep 5
              done
              echo "MCP toolchain not ready after {{ .Values.mcpVerification.preflight.toolchainWaitSeconds }}s" >&2
              exit 1
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        - name: preflight
          image: "{{ include "openagent.hermesImage" . }}"
          imagePullPolicy: {{ (index .Values "hermes-agent" "image").pullPolicy }}
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          env:
            {{- include "openagent.mcpVerifyEnv" . | nindent 12 }}
          envFrom:
            # Same secret bundle the gateway gets, so ${MCP_*} / ${PLANE_*}
            # placeholders resolve exactly as they do at runtime.
            - secretRef:
                name: openagent-secrets
          command:
            - /opt/data/bin/hermes-tools
            - mcp
            - verify
            - --manifest
            - /mcp-verify/mcp-manifest
            - --mode
            - preflight
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: mcp-verify
              mountPath: /mcp-verify
              readOnly: true
      volumes:
        {{- include "openagent.mcpVerifyVolumes" . | nindent 8 }}
{{- end }}

---
{{- if and .Values.hermes.enabled .Values.mcpVerification.cronjob.enabled }}
# Continuous drift check. Runs the same handshake as the preflight Job on a
# schedule and compares the live tool surface with the declared tools.include.
# Quiet when everything matches; only drift prints and exits non-zero, so a
# watcher can alert on change rather than on every run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openagent-mcp-drift
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-drift
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: {{ .Values.mcpVerification.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.mcpVerification.cronjob.historyLimit }}
  failedJobsHistoryLimit: {{ .Values.mcpVerification.cronjob.historyLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.mcpVerification.cronjob.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.mcpVerification.cronjob.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "openagent.labels" . | nindent 12 }}
            app.kubernetes.io/component: mcp-drift
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          containers:
            - name: drift
              image: "{{ include "openagent.hermesImage" . }}"
              imagePullPolicy: {{ (index .Values "hermes-agent" "image").pullPolicy }}
              securityContext:
                runAsUser: 10000
                runAsGroup: 10000
              env:
                {{- include "openagent.mcpVerifyEnv" . | nindent 16 }}
              envFrom:
                - secretRef:
                    name: openagent-secrets
              command:
                - /opt/data/bin/hermes-tools
                - mcp
                - verify
                - --manifest
                - /mcp-verify/mcp-manifest
                - --mode
                - drift
              volumeMounts:
                - name: data
                  mountPath: /opt/data
                - name: mcp-verify
                  mountPath: /mcp-verify
                  readOnly: true
          volumes:
            {{- include "openagent.mcpVerifyVolumes" . | nindent 12 }}
{{- end }}
