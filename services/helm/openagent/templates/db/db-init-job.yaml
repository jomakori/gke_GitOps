{{- if .Values.postgres.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.postgres.clusterName | default "openagent-pg" }}-db-init
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:18-alpine
          env:
            - name: PGHOST
              value: {{ .Values.postgres.clusterName | default "openagent-pg" }}.{{ .Values.namespace }}.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.clusterName | default "openagent-pg" }}
                  key: superuser-username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.clusterName | default "openagent-pg" }}
                  key: superuser-password
            - name: OPENAGENT_USER
              valueFrom:
                secretKeyRef:
                  name: openagent-secrets
                  key: OPENAGENT_PG_USER
            - name: OPENAGENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openagent-secrets
                  key: OPENAGENT_PG_PASSWORD
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for database at $PGHOST:$PGPORT..."
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"; do
                echo "Database not ready, retrying..."
                sleep 3
              done
              echo "Database ready. Creating user and database..."
              if psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$OPENAGENT_USER'" | grep -q 1; then
                echo "User $OPENAGENT_USER exists, updating password..."
                psql -v ON_ERROR_STOP=1 -c "ALTER ROLE \"$OPENAGENT_USER\" WITH LOGIN SUPERUSER PASSWORD '$OPENAGENT_PASSWORD'"
              else
                echo "Creating user $OPENAGENT_USER..."
                psql -v ON_ERROR_STOP=1 -c "CREATE ROLE \"$OPENAGENT_USER\" WITH LOGIN SUPERUSER PASSWORD '$OPENAGENT_PASSWORD'"
              fi
              if psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'litellm'" | grep -q 1; then
                echo "Database litellm already exists."
              else
                echo "Creating database litellm..."
                psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE litellm OWNER \"$OPENAGENT_USER\""
              fi
              echo "User and database created successfully."
{{- end }}
