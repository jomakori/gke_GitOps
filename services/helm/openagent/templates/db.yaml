{{- if .Values.postgres.enabled }}
apiVersion: stackgres.io/v1
kind: SGScript
metadata:
  name: {{ .Values.postgres.clusterName | default "openagent-pg" }}-init
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  scripts:
    # SGCluster CRD (StackGres 1.18) has no spec.users — role must be created here.
    # Password comes from the ESO-templated openagent-pg-init secret (OPENAGENT_PG_PASSWORD).
    - id: 0
      name: create-openagent-role
      scriptFrom:
        secretKeyRef:
          name: openagent-pg-init
          key: OPENAGENT_PG_INIT_SQL
    - id: 1
      name: create-litellm-db
      script: |
        DO $$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'litellm') THEN
            CREATE DATABASE litellm OWNER {{ .Values.postgres.userName | default "openagent" }};
          END IF;
        END $$;
{{- end }}
