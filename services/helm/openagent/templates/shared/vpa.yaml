{{- /*
One VerticalPodAutoscaler per entry in `.Values.vpa.targets`, in `updateMode:
Auto` so sizing comes from observed usage instead of hand-tuned limits.

WHY THE POLICIES ARE STRUCTURED THIS WAY (these are the traps that make a VPA
look enabled while doing nothing, or doing the wrong thing):

  1. requests == limits for every managed container. VPA refuses to apply a
     recommendation to a container that sets a limit different from its
     request, and there is no error — it simply does nothing. The application
     containers pin the two together in the values files on purpose.
     (Note also: VPA is not compatible with workloads that define *pod-level*
     `resources`; the admission controller can refuse to create the pod when
     container-level values exceed the pod-level stanza. These two Deployments
     use container-level resources only.)

  2. Bounds are per container, and `"*"` is a DEFAULT, not a blanket. Per the
     API (`ContainerResourcePolicy.ContainerName`): "Name of the container or
     DefaultContainerResourcePolicy, in which case the policy is used by the
     containers that don't have their own policy specified." Setting the
     application's floor/ceiling as `"*"` therefore hands those numbers to
     every helper in the pod — observed directly: a `hermes-doctor` container
     came back with `lower == upper == target == 3Gi`, clamped to a floor meant
     for the main container.

  3. Containers that should not be autoscaled are named and switched off
     (`mode: Off`) rather than left to inherit. A helper keeps the values from
     its manifest; nothing is invented for a container this chart does not
     define.

  4. The floor is deliberately LOW and the ceiling is the guardrail. VPA's
     target tracks observed peaks with a decay, not the floor, so a low
     `minAllowed` does not squeeze a busy pod — it only stops a cold or idle
     history from capping the recommendation, and lets the autoscaler pull an
     over-provisioned pod back down. A high floor (as this file first shipped,
     3Gi/4Gi) defeats the entire point of `Auto`.
*/ -}}
{{- if .Values.vpa.enabled }}
{{- range .Values.vpa.targets }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .name }}
  updatePolicy:
    updateMode: {{ default "Auto" $.Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      {{- range .containers }}
      - containerName: {{ .name | quote }}
        minAllowed:
          cpu: {{ .minCpu | quote }}
          memory: {{ .minMemory | quote }}
        maxAllowed:
          cpu: {{ .maxCpu | quote }}
          memory: {{ .maxMemory | quote }}
      {{- end }}
      # Default policy for anything else in the pod (sidecars, helpers this
      # chart does not define): keep the manifest's values, do not autoscale.
      #
      # QUOTED ON PURPOSE. `mode: Off` unquoted is a YAML 1.1 *boolean* (`Off`,
      # `On`, `Yes`, `No` all are), so it reaches the API server as `false` and
      # the VPA webhook rejects the object outright:
      #   admission webhook "vpa.k8s.io" denied the request: json: cannot
      #   unmarshal bool into Go struct field
      #   ContainerResourcePolicy...mode of type v1.ContainerScalingMode
      # That failure is a *sync failure*, which means the whole object — bounds
      # included — silently never lands.
      - containerName: "*"
        mode: "Off"
{{- end }}
{{- end }}
