{{- /*
VerticalPodAutoscaler per entry in `.Values.vpa.targets`, in `updateMode: Auto`
so the sizing is set from observed usage instead of hand-tuned.

Why this file exists at all: the memory limit on the agent containers was raised
by hand twice (2Gi -> 3Gi on 2026-08-23, then 3Gi -> 6Gi/8Gi on 2026-09-12, both
after OOMKills). A VPA that actually targets the workload turns that into a
reading.

TWO THINGS `Auto` REQUIRES, both easy to get silently wrong:

  1. requests == limits for every managed container. VPA refuses to APPLY a
     recommendation to a container that sets a limit different from its request,
     and there is no error — the VPA just does nothing while looking enabled.
     The values files therefore pin requests and limits to the same memory
     figure, and the VPA owns the number from there.
  2. Evictions are real. `Auto`/`Recreate` restarts the pod when a
     recommendation drifts, so a restart can land on in-flight work. That is
     acceptable for these two targets specifically: the agent runtime lives in
     `opencode-server` (sessions are persisted in the opencode store, so a
     restart resumes rather than loses them), and the gateway now drives
     `opencode run --attach`, so a gateway restart no longer kills the run it
     dispatched. Before that separation, `Auto` here would have been actively
     harmful.

Read what it decided:
  kubectl describe vpa openagent-hermes-agent -n openagent
`minAllowed`/`maxAllowed` below are the guardrails — the burst floor and ceiling
the autoscaler may not cross.
*/ -}}
{{- if .Values.vpa.enabled }}
{{- range .Values.vpa.targets }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .name }}
  updatePolicy:
    updateMode: {{ default "Auto" $.Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: {{ default "100m" .minCpu }}
          memory: {{ default "256Mi" .minMemory }}
        maxAllowed:
          cpu: {{ default "4000m" .maxCpu }}
          memory: {{ default "8Gi" .maxMemory }}
{{- end }}
{{- end }}
