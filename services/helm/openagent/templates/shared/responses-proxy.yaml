{{- if index .Values "claude-proxy" "enabled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: responses-proxy
  namespace: {{ .Release.Namespace }}
data:
  proxy.ts: |
    const PORT = parseInt(process.env.PORT ?? "4524");
    const LITELLM = process.env.LITELLM ?? "http://openagent-litellm.{{ .Release.Namespace }}.svc.cluster.local:4000";
    const LITELLM_KEY = process.env.LITELLM_KEY ?? "sk-litellm-master-key-1234";

    Bun.serve({
      port: PORT,
      hostname: "0.0.0.0",
      idleTimeout: 255, // Bun max; Codex default is 300s but Bun caps at 255
      async fetch(req) {
        const u = new URL(req.url);

        // Health check
        if (u.pathname === "/health")
          return new Response('{"status":"ok"}', {
            headers: { "Content-Type": "application/json" },
          });

        // Reject WebSocket on /v1/responses to force Codex HTTP SSE fallback
        if (
          u.pathname === "/v1/responses" &&
          req.headers.get("upgrade")?.toLowerCase() === "websocket"
        )
          return new Response("Use HTTP POST for /v1/responses", { status: 426 });

        // ── Responses API passthrough with tool filtering ──
        // Codex 0.145 sends `web_search` and `namespace` tool types that break
        // OpenAI-schema upstreams (auth2api claude-proxy pydantic validation:
        // "tools.N.custom.name: Field required"). Keep only `function` tools so
        // the agent keeps its exec/file/plan capabilities. LiteLLM handles the
        // Responses <-> provider conversion (incl. tool_calls round-trips).
        if (u.pathname === "/v1/responses" && req.method === "POST") {
          try {
            const body = JSON.parse(await req.text());
            if (Array.isArray(body.tools)) {
              const before = body.tools.length;
              body.tools = body.tools.filter(
                (t) => t && typeof t === "object" && t.type === "function",
              );
              if (body.tools.length === 0) delete body.tools;
              else if (body.tools.length !== before)
                console.log(`[responses-proxy] filtered tools ${before} -> ${body.tools.length}`);
            }
            const litellmResp = await fetch(LITELLM + "/v1/responses", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + LITELLM_KEY,
              },
              body: JSON.stringify(body),
            });
            return new Response(litellmResp.body, {
              status: litellmResp.status,
              headers: {
                "Content-Type": litellmResp.headers.get("content-type") ?? "application/json",
              },
            });
          } catch (e) {
            return new Response(String(e), { status: 500 });
          }
        }

        // ── Chat completions passthrough with the same tool filtering ──
        // Belt-and-braces: if Codex ever falls back to the chat wire, custom
        // tool types would otherwise 400 at the upstream.
        if (u.pathname === "/chat/completions" && req.method === "POST") {
          try {
            const body = JSON.parse(await req.text());
            if (Array.isArray(body.tools)) {
              body.tools = body.tools.filter(
                (t) => t && typeof t === "object" && t.type === "function",
              );
              if (body.tools.length === 0) delete body.tools;
            }
            const litellmResp = await fetch(LITELLM + "/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + LITELLM_KEY,
              },
              body: JSON.stringify(body),
            });
            return new Response(litellmResp.body, {
              status: litellmResp.status,
              headers: {
                "Content-Type": litellmResp.headers.get("content-type") ?? "application/json",
              },
            });
          } catch (e) {
            return new Response(String(e), { status: 500 });
          }
        }

        // ── Passthrough everything else to LiteLLM ──
        return await fetch(LITELLM + u.pathname + u.search, {
          method: req.method,
          headers: req.headers,
          body: req.body,
        });
      },
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: responses-proxy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responses-proxy
  template:
    metadata:
      labels:
        app: responses-proxy
    spec:
      containers:
        - name: proxy
          image: oven/bun:1-alpine
          command: ["bun", "/proxy/proxy.ts"]
          env:
            - name: LITELLM_KEY
              value: "sk-litellm-master-key-1234"
          ports:
            - containerPort: 4524
          readinessProbe:
            tcpSocket:
              port: 4524
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4524
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: proxy-script
              mountPath: /proxy
      volumes:
        - name: proxy-script
          configMap:
            name: responses-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: responses-proxy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: responses-proxy
  ports:
    - port: 4524
      targetPort: 4524
{{- end }}
