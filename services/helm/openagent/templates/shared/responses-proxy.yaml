{{- if index .Values "claude-proxy" "enabled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: responses-proxy
  namespace: {{ .Release.Namespace }}
data:
  proxy.ts: |
    const PORT = parseInt(process.env.PORT ?? "4524");
    const LITELLM = process.env.LITELLM ?? "http://openagent-litellm.{{ .Release.Namespace }}.svc.cluster.local:4000";
    const LITELLM_KEY = process.env.LITELLM_KEY ?? "sk-litellm-master-key-1234";
    const enc = new TextEncoder();

    // ── Responses API -> chat completions translation ──
    // Codex 0.145 speaks the Responses API, but LiteLLM's Responses->provider
    // conversion mangles tool_result pairing ("tool_use ids without tool_result").
    // The auth2api claude-proxy is chat-completions native, so translate here:
    //   - tools: keep only `function` (drop `web_search`/`namespace`/`custom`
    //     types that 400 at the upstream's pydantic validation)
    //   - input items (incl. function_call_output) -> chat messages
    //   - chat tool_calls / tool results round-trip back to Responses items

    function toChatTools(tools) {
      if (!Array.isArray(tools)) return undefined;
      const out = tools
        .filter((t) => t && typeof t === "object" && t.type === "function")
        .map((t) => ({
          type: "function",
          function: { name: t.name, description: t.description, parameters: t.parameters },
        }));
      return out.length ? out : undefined;
    }

    function toChatToolChoice(tc) {
      if (!tc) return undefined;
      if (tc === "auto" || tc === "none" || tc === "required") return tc;
      if (typeof tc === "object" && tc.type === "function" && tc.function?.name)
        return { type: "function", function: { name: tc.function.name } };
      return undefined;
    }

    function itemToMessages(item) {
      if (typeof item === "string") return [{ role: "user", content: item }];
      if (!item || typeof item !== "object") return [];
      if (item.type === "function_call_output")
        return [{ role: "tool", tool_call_id: item.call_id, content: String(item.output ?? "") }];
      if ((item.type === "message" || (item.role && item.content)) && item.content) {
        const parts = Array.isArray(item.content) ? item.content : [item.content];
        const toolResults = parts.filter((c) => c && c.type === "function_call_output");
        if (toolResults.length)
          return toolResults.map((c) => ({ role: "tool", tool_call_id: c.call_id, content: String(c.output ?? "") }));
        const text = parts
          .map((c) => {
            if (typeof c === "string") return c;
            if (c && (c.type === "input_text" || c.type === "output_text")) return c.text ?? "";
            return "";
          })
          .join("");
        const fcs = parts.filter((c) => c && c.type === "function_call");
        if (fcs.length) {
          return [
            {
              role: "assistant",
              content: text || null,
              tool_calls: fcs.map((c) => ({
                id: c.call_id,
                type: "function",
                function: { name: c.name, arguments: c.arguments ?? "{}" },
              })),
            },
          ];
        }
        return [{ role: item.role === "assistant" ? "assistant" : "user", content: text }];
      }
      return []; // reasoning / other items: skip
    }

    function buildChatBody(body) {
      const messages = [];
      if (body.instructions) messages.push({ role: "system", content: body.instructions });
      const input = Array.isArray(body.input) ? body.input : [body.input];
      for (const it of input) messages.push(...itemToMessages(it));
      const chatReq = { model: body.model, messages, stream: body.stream ?? false };
      const tools = toChatTools(body.tools);
      if (tools) {
        chatReq.tools = tools;
        chatReq.tool_choice = toChatToolChoice(body.tool_choice) ?? "auto";
      }
      if (body.temperature != null) chatReq.temperature = body.temperature;
      if (body.max_output_tokens != null) chatReq.max_tokens = body.max_output_tokens;
      return chatReq;
    }

    function chatMessageToItems(msg) {
      const items = [];
      if (msg.content) {
        items.push({
          id: "msg_" + crypto.randomUUID().slice(0, 16),
          type: "message",
          role: "assistant",
          status: "completed",
          content: [{ type: "output_text", text: msg.content, annotations: [] }],
        });
      }
      for (const tc of msg.tool_calls ?? []) {
        items.push({
          id: "fc_" + tc.id,
          type: "function_call",
          status: "completed",
          call_id: tc.id,
          name: tc.function?.name,
          arguments: tc.function?.arguments ?? "{}",
        });
      }
      return items;
    }

    function usageFromChat(u) {
      return {
        input_tokens: u?.prompt_tokens ?? 0,
        output_tokens: u?.completion_tokens ?? 0,
        total_tokens: (u?.prompt_tokens ?? 0) + (u?.completion_tokens ?? 0),
      };
    }

    async function translateStream(litellmResp, respId, model, send, controller) {
      let fullText = "";
      let textItemId = null;
      let callItem = null; // {id, call_id, name, args}
      const items = []; // completed items, surfaced in response.completed.output
      let usage = null;
      const reader = litellmResp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      const closeCall = () => {
        if (!callItem) return;
        send({ type: "response.function_call_arguments.done", item_id: callItem.id, output_index: 0, arguments: callItem.args });
        const item = {
          id: callItem.id,
          type: "function_call",
          status: "completed",
          call_id: callItem.call_id,
          name: callItem.name,
          arguments: callItem.args,
        };
        send({ type: "response.output_item.done", output_index: 0, item });
        items.push(item);
        callItem = null;
      };
      const closeText = () => {
        if (!textItemId) return;
        send({ type: "response.output_text.done", item_id: textItemId, output_index: 0, content_index: 0, text: fullText });
        const item = {
          id: textItemId,
          type: "message",
          role: "assistant",
          status: "completed",
          content: [{ type: "output_text", text: fullText, annotations: [] }],
        };
        send({ type: "response.output_item.done", output_index: 0, item });
        items.push(item);
        textItemId = null;
      };
      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const data = line.slice(6).trim();
            if (data === "[DONE]") continue;
            let chunk;
            try { chunk = JSON.parse(data); } catch { continue; }
            const delta = chunk.choices?.[0]?.delta;
            if (chunk.usage) usage = chunk.usage;
            if (!delta) continue;
            if (delta.content) {
              if (!textItemId) {
                textItemId = "msg_" + crypto.randomUUID().slice(0, 16);
                send({
                  type: "response.output_item.added",
                  output_index: 0,
                  item: { id: textItemId, type: "message", role: "assistant", status: "in_progress", content: [] },
                });
              }
              fullText += delta.content;
              send({ type: "response.output_text.delta", item_id: textItemId, output_index: 0, content_index: 0, delta: delta.content });
            }
            for (const tc of delta.tool_calls ?? []) {
              if (tc.id && tc.function?.name && (!callItem || callItem.call_id !== tc.id)) {
                closeCall();
                callItem = { id: "fc_" + tc.id, call_id: tc.id, name: tc.function.name, args: "" };
                send({
                  type: "response.output_item.added",
                  output_index: 0,
                  item: { id: callItem.id, type: "function_call", status: "in_progress", call_id: callItem.call_id, name: callItem.name, arguments: "" },
                });
              }
              if (tc.function?.arguments && callItem) {
                callItem.args += tc.function.arguments;
                send({ type: "response.function_call_arguments.delta", item_id: callItem.id, output_index: 0, delta: tc.function.arguments });
              }
            }
          }
        }
      } catch (e) {
        controller.error(e);
        return;
      }
      closeCall();
      closeText();
      if (!items.length && fullText) {
        items.push({
          id: "msg_" + crypto.randomUUID().slice(0, 16),
          type: "message",
          role: "assistant",
          status: "completed",
          content: [{ type: "output_text", text: fullText, annotations: [] }],
        });
      }
      send({
        type: "response.completed",
        response: { id: respId, object: "response", status: "completed", model, output: items, usage: usageFromChat(usage) },
      });
      send({ type: "done" });
      controller.close();
    }

    Bun.serve({
      port: PORT,
      hostname: "0.0.0.0",
      idleTimeout: 255, // Bun max; Codex default is 300s but Bun caps at 255
      async fetch(req) {
        const u = new URL(req.url);

        // Health check
        if (u.pathname === "/health")
          return new Response('{"status":"ok"}', {
            headers: { "Content-Type": "application/json" },
          });

        // Reject WebSocket on /v1/responses to force Codex HTTP SSE fallback
        if (
          u.pathname === "/v1/responses" &&
          req.headers.get("upgrade")?.toLowerCase() === "websocket"
        )
          return new Response("Use HTTP POST for /v1/responses", { status: 426 });

        // ── Responses API -> chat completions (with tool round-trip) ──
        if (u.pathname === "/v1/responses" && req.method === "POST") {
          try {
            const body = JSON.parse(await req.text());
            console.log("[od-dbg] " + JSON.stringify({
              model: body.model,
              items: (body.input || []).map((i) => ({ t: i.type, r: i.role, id: (i.call_id || "").slice(0, 28), n: i.name })),
              tools: (body.tools || []).length,
            }));
            const model = body.model || "claude-sonnet-5";
            const chatReq = buildChatBody(body);
            const respId = "resp_" + crypto.randomUUID().slice(0, 24);
            const litellmResp = await fetch(LITELLM + "/v1/chat/completions", {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: "Bearer " + LITELLM_KEY },
              body: JSON.stringify(chatReq),
            });

            if (!litellmResp.ok) {
              const errText = await litellmResp.text();
              return new Response(errText, { status: litellmResp.status });
            }

            if (body.stream) {
              return new Response(
                new ReadableStream({
                  async start(controller) {
                    const send = (data) =>
                      controller.enqueue(enc.encode("data: " + JSON.stringify(data) + "\n\n"));
                    send({
                      type: "response.created",
                      response: { id: respId, object: "response", status: "in_progress", model, output: [] },
                    });
                    await translateStream(litellmResp, respId, model, send, controller);
                  },
                }),
                { headers: { "Content-Type": "text/event-stream", "Cache-Control": "no-cache", Connection: "keep-alive" } }
              );
            } else {
              const cd = await litellmResp.json();
              const msg = cd.choices?.[0]?.message ?? {};
              const output = chatMessageToItems(msg);
              return Response.json({
                id: respId,
                object: "response",
                created_at: Math.floor(Date.now() / 1000),
                status: "completed",
                model,
                output,
                usage: usageFromChat(cd.usage),
              });
            }
          } catch (e) {
            return new Response(String(e), { status: 500 });
          }
        }

        // ── Chat completions passthrough with the same tool filtering ──
        if (u.pathname === "/chat/completions" && req.method === "POST") {
          try {
            const body = JSON.parse(await req.text());
            if (Array.isArray(body.tools)) {
              body.tools = body.tools.filter((t) => t && typeof t === "object" && t.type === "function");
              if (body.tools.length === 0) delete body.tools;
            }
            const litellmResp = await fetch(LITELLM + "/chat/completions", {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: "Bearer " + LITELLM_KEY },
              body: JSON.stringify(body),
            });
            return new Response(litellmResp.body, {
              status: litellmResp.status,
              headers: { "Content-Type": litellmResp.headers.get("content-type") ?? "application/json" },
            });
          } catch (e) {
            return new Response(String(e), { status: 500 });
          }
        }

        // ── Passthrough everything else to LiteLLM ──
        return await fetch(LITELLM + u.pathname + u.search, {
          method: req.method,
          headers: req.headers,
          body: req.body,
        });
      },
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: responses-proxy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responses-proxy
  template:
    metadata:
      labels:
        app: responses-proxy
    spec:
      containers:
        - name: proxy
          image: oven/bun:1-alpine
          command: ["bun", "/proxy/proxy.ts"]
          env:
            - name: LITELLM_KEY
              value: "sk-litellm-master-key-1234"
          ports:
            - containerPort: 4524
          readinessProbe:
            tcpSocket:
              port: 4524
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4524
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: proxy-script
              mountPath: /proxy
      volumes:
        - name: proxy-script
          configMap:
            name: responses-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: responses-proxy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: responses-proxy
  ports:
    - port: 4524
      targetPort: 4524
{{- end }}
