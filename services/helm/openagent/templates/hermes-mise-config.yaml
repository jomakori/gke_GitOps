apiVersion: v1
kind: ConfigMap
metadata:
  name: openagent-hermes-mise-config
  namespace: {{ .Release.Namespace }}
data:
  mise.toml: |
    # Hermes-agent runtime toolchain — managed by mise (mirrors hermes-workspace
    # mise migration, PRs #89-94). Mounted at /mise in the hermes-agent pod;
    # boot script runs `mise install` and symlinks shims into /opt/data/bin
    # (first on the runtime PATH).
    # deno pinned 2.9.5: drawio-mcp-server ships deno.lock v5 (deno 2.x only).
    [tools]
    node = "latest"
    deno = "2.9.5"
    uv = "latest"
    go = "latest"
    # kubectl 1.35.x matches cluster k3s v1.35.1+k3s1. Raw binary
    # previously dropped in /opt/data/bin — now mise-managed like all
    # other CLIs; shim auto-created in /opt/data/bin by boot script.
    kubectl = "1.35.1"
    # Helm 3 — chart templating/lint. Prefer mise over the raw /opt/data/bin
    # binary so version is managed with the rest of the toolchain. Pin 3.x:
    # `latest` resolves Helm 4 (breaking; cluster + scripts use v3.16).
    helm = "3"
    # Pre-commit hook runner (openkite, gke_GitOps, devops_Terraform all
    # ship a .pre-commit-config.yaml). Org-wide baseline hooks
    # (gitleaks, yamllint, actionlint) run as part of every commit.
    pre-commit = "latest"
    # Org-wide secret scanner; matches gke_GitOps/.pre-commit-config.yaml.
    gitleaks = "latest"
    # Org-wide YAML lint for .github/workflows/*.yml + helm chart values.
    yamllint = "latest"
    # Lints GitHub Actions workflow files (actionlint).
    actionlint = "latest"
    # Renders helm templates + validates against the K8s OpenAPI
    # schema. Same binary + flags as .github/workflows/helm_lint-test.yaml
    # in this repo. Installed so pre-commit's
    # helm-template-and-kubeconform hook can run locally.
    kubeconform = "latest"
    # Renders README.md from Helm chart values (pre-commit helm-docs hook).
    # Pin 1.14.2 to match .pre-commit-config.yaml rev v1.14.2.
    helm-docs = "1.14.2"
    # Optional: helm-unittest runs per-chart semantic assertions. The
    # vbehar fork (NOT helmpyp — that's a typo and silently fails).
    # installed via `helm plugin install` from CI; not a binary.

    # OCR-first vision (user pref): PP-OCR models via rapidocr-onnxruntime.
    # Task self-bootstraps the py3.12 venv on first use (persists on the PVC).
    # Native paddlepaddle crashes on this aarch64 container (PIR strides /
    # zlib SIGABRT / paddle2onnx invalid protobuf) — rapidocr runs the same
    # PP-OCR models. Shim: /opt/data/bin/paddle-ocr → `mise run paddle-ocr`.
    [tasks.paddle-ocr]
    description = "OCR an image (PP-OCR models via rapidocr-onnxruntime)"
    run = '''
    set -e
    VENV=/opt/data/paddleocr-venv
    if [ ! -d "$VENV" ]; then
      uv python install 3.12
      uv venv "$VENV" --python 3.12
      uv pip install --python "$VENV/bin/python" rapidocr-onnxruntime
    fi
    exec "$VENV/bin/python" /mise/paddle_ocr.py "$@"
    '''

    # ── OpenKite shift-left lint tasks ─────────────────────────────
    # The openkite desktop app (Dioxus 0.7) cannot run
    # `cargo clippy --workspace` locally: the `openkite` binary
    # pulls `dioxus-desktop 0.7.10` which requires system
    # `libwebkit2gtk-4.1-dev`, `libgtk-3-dev`, `libglib2.0-dev` —
    # not on the dev host. CI installs them via `apt-get` in the
    # `lint-test` workflow. The shift-left gate (this file) only
    # runs against the local-lintable target: the `openkite-plugin-sdk`
    # workspace member, which depends on `dioxus` (no desktop
    # feature) + `kube` + `serde`. Every other workspace member
    # falls back to the full CI run.
    [tasks."openkite.lint-fast"]
    description = "OpenKite shift-left pre-commit subset (no system deps)."
    run = [
      "cd /opt/data/repos/openkite",
      "cargo fmt --all -- --check",
      "cargo check -p openkite-plugin-sdk --all-targets",
      "cargo clippy -p openkite-plugin-sdk --all-targets -- -D warnings",
    ]

    [tasks."openkite.lint"]
    description = "OpenKite full pre-push gate (matches CI; needs glib/webkit)."
    run = [
      "cd /opt/data/repos/openkite",
      "cargo fmt --all -- --check",
      "cargo clippy --workspace --all-targets -- -D warnings",
      "cargo test --workspace",
      "cargo build --workspace",
    ]

    [tasks."openkite.fmt"]
    description = "Auto-format every openkite workspace member."
    run = [
      "cd /opt/data/repos/openkite",
      "cargo fmt --all",
    ]

    [tasks."openkite.install-hooks"]
    description = "One-time `pre-commit install` for the openkite repo."
    run = [
      "cd /opt/data/repos/openkite",
      "pre-commit install",
    ]
  paddle_ocr.py: |
    import sys
    from rapidocr_onnxruntime import RapidOCR
    ocr = RapidOCR()
    for path in sys.argv[1:]:
        print(f"=== {path} ===")
        res, _ = ocr(path)
        lines = [t for _, t, _ in (res or []) if t]
        for ln in lines or ["(no text detected)"]:
            print(ln)
