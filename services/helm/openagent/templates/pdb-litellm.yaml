{{- if .Values.litellm.podDisruptionBudget.enabled }}
# LiteLLM is HPA-scaled (min 2, max 4) and was observed at 4/4 replicas with no PDB, on
# a node that OOM-kills under pressure. maxUnavailable 1 keeps the gateway answering
# during a drain instead of losing every replica at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: openagent-litellm
  namespace: {{ .Values.namespace }}
spec:
  maxUnavailable: {{ .Values.litellm.podDisruptionBudget.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: litellm
{{- end }}
