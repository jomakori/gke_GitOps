{{- if .Values.hermes.enabled }}
# Gateway boot script. The full pod bootstrap used to live inline in
# values.yaml (hermes-agent.command[2]) — a 150-line bash blob inline in a
# values table. It now lives in files/boot/boot.sh (chart-owned, reviewable,
# lintable like files/mcp/*.py) and is mounted read-only from this ConfigMap.
# The pod command is a single line — `exec sh /opt/boot/boot.sh` (see
# values.yaml → hermes-agent.command) so the script can change without a
# pod-spec-shaped diff.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openagent-boot-script
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: boot-script
  annotations:
    # Rendered with (just before) the workload so the pod can mount it.
    argocd.argoproj.io/sync-wave: "-1"
data:
  boot.sh: |
{{ .Files.Get "files/boot/boot.sh" | indent 4 }}
{{- end }}
