{{- if .Values.dopplerConfig }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openagent-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-{{ .Values.dopplerConfig | replace "_" "-" }}
  refreshInterval: 24h
  target:
    name: openagent-secrets
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: ".*"
{{- end }}

---
{{- if and .Values.ghcrPullSecret .Values.dopplerConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.ghcrPullSecret | quote }}
{{- end }}

---
{{- if .Values.litellm.enabled }}
{{- if .Values.litellm.masterkeySecretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.litellm.masterkeySecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-{{ .Values.dopplerConfig | replace "_" "-" }}
  refreshInterval: 24h
  target:
    name: {{ .Values.litellm.masterkeySecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.litellm.masterkeySecretKey | default "masterkey" }}
      remoteRef:
        key: LITELLM_MASTER_KEY
{{- end }}
{{- end }}

---
{{- if .Values.postgres.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openagent-pg-init
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-{{ .Values.dopplerConfig | replace "_" "-" }}
  refreshInterval: 24h
  # dataFrom feeds the ESO template context; the target secret carries only the
  # rendered SQL below (SGScript create-openagent-role consumes it).
  dataFrom:
    - find:
        name:
          regexp: ".*"
  target:
    name: openagent-pg-init
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # ESO expression is Helm-escaped so Helm emits it verbatim and ESO
        # resolves OPENAGENT_PG_PASSWORD from doppler at reconcile time.
        OPENAGENT_PG_INIT_SQL: |
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'openagent') THEN
              CREATE ROLE openagent LOGIN SUPERUSER PASSWORD '{{ "{{ .OPENAGENT_PG_PASSWORD }}" }}';
            ELSE
              ALTER ROLE openagent WITH LOGIN SUPERUSER PASSWORD '{{ "{{ .OPENAGENT_PG_PASSWORD }}" }}';
            END IF;
          END $$;
{{- end }}
