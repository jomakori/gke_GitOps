{{- if .Values.dopplerConfig }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openagent-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-{{ .Values.dopplerConfig | replace "_" "-" }}
  refreshInterval: 24h
  target:
    name: openagent-secrets
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: ".*"
  # The Doppler CLI reads DOPPLER_TOKEN; the stored key keeps its MCP-era name.
  # Mapping it here means `doppler` works in the pod without duplicating the value.
  data:
    - secretKey: DOPPLER_TOKEN
      remoteRef:
        key: MCP_DOPPLER_TOKEN
{{- end }}

---
{{- if and .Values.ghcrPullSecret .Values.dopplerConfig }}
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.ghcrPullSecret | quote }}
{{- end }}

---
{{- if .Values.litellm.enabled }}
{{- if .Values.litellm.masterkeySecretName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.litellm.masterkeySecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-{{ .Values.dopplerConfig | replace "_" "-" }}
  refreshInterval: 24h
  target:
    name: {{ .Values.litellm.masterkeySecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.litellm.masterkeySecretKey | default "masterkey" }}
      remoteRef:
        key: LITELLM_MASTER_KEY
{{- end }}
{{- end }}
