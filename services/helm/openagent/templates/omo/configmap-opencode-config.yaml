apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openagent.fullname" . }}-opencode-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: opencode-config
data:
  # OpenCode global config (mounted at ~/.config/opencode/opencode.json in the
  # hermes-agent pod; HOME=/opt/data at runtime). Two responsibilities:
  #   1. custom provider `litellm` → in-cluster LiteLLM gateway (model access
  #      ONLY — retries/cooldowns live in OMO, not here).
  #   2. register the oh-my-openagent ("OMO") plugin, which opencode
  #      auto-installs from npm (arborist, no bun needed) on first run and
  #      which supplies the agent fleet + BOTH fallback layers:
  #        - per-agent model fallback chains (fallback_models in omo.jsonc)
  #        - runtime fallback on 429/5xx (runtime_fallback hook in omo.jsonc)
  #   Model ids are LiteLLM aliases (values.yaml → litellm.model_list),
  #   slash-free because opencode parses provider/model on the slash. Agent
  #   definitions, categories and fallback chains live in the omo.jsonc key
  #   (copied to ~/.omo/omo.jsonc at boot — OMO normalizes that file, so it
  #   must be writable; opencode.json here stays read-only).
  #
  #   `mcp` (added for OKT-91/OKT-96 tooling — delegated agents need Plane +
  #   GitHub; previously every such write routed back through Hermes):
  #     - Only plane + github, deliberately. opencode's docs warn that MCP
  #       tools land in the context of EVERY turn — "be careful which MCP
  #       servers you use". This is not the whole Hermes fleet.
  #     - Mirrored, not proxied. An MCP aggregator would front these from one
  #       endpoint, but the stdio servers need THIS container's toolchain
  #       (mise npx/uvx), /opt/data/bin binaries and PVC state; a separate pod
  #       would mean replicating all of that plus every credential. This file
  #       already hand-mirrors litellm.model_list from values.yaml, so
  #       mirroring two server entries is the established convention here.
  #     - SOURCE OF TRUTH for the Hermes side: values.yaml → hermes.mcp_servers
  #       (~line 565). Keep command/environment in sync with it.
  #     - `{env:VAR}` is opencode's expansion syntax (same as the provider
  #       apiKey above); the pod already carries both tokens.
  #     - NOTE: opencode.json is plain JSON — no comments inside it.
  #     - GATING (why the mcp block is not enough on its own): opencode loads
  #       an MCP server at STARTUP — there is no lazy/on-demand/context-triggered
  #       start, so `enabled: true` alone puts both servers' tool schemas in the
  #       context of EVERY agent. The supported fix is opencode's documented
  #       "Per agent" pattern: disable the tools globally, re-enable per agent.
  #         tools: { "plane*": false, "github*": false }   ← global off
  #         agent.<name>.tools: { "plane*": true, ... }    ← opt-in per agent
  #       Opted IN: sisyphus (orchestrator, files tickets), hephaestus
  #       (implementation, opens PRs), prometheus (planning), atlas (execution).
  #       Opted OUT: oracle, explore, librarian, multimodal-looker,
  #       sisyphus-junior — read-only/search/cheap tiers that never file
  #       tickets or PRs, so they shouldn't pay the context cost.
  #       Add an agent name here when a new agent needs ticket/PR access.
  #       NOTE: the globs are `plane*`/`github*` (server-name prefix), not
  #       `plane_*` — `*` matches zero or more chars, so the prefix form is
  #       robust to the separator opencode uses.
  opencode.json: |
    {
      "$schema": "https://opencode.ai/config.json",
      "provider": {
        "litellm": {
          "npm": "@ai-sdk/openai-compatible",
          "name": "LiteLLM Gateway",
          "options": {
            "baseURL": "http://openagent-litellm.openagent.svc.cluster.local:4000/v1",
            "apiKey": "{env:LITELLM_MASTER_KEY}"
          },
          "models": {
            "deepseek-v4-flash-direct": { "name": "DeepSeek V4 Flash (direct)" },
            "deepseek-v4-flash": { "name": "DeepSeek V4 Flash (kilo)" },
            "deepseek-v4-pro": { "name": "DeepSeek V4 Pro" },
            "minimax-m3": { "name": "MiniMax M3" },
            "glm-5.3": { "name": "GLM 5.3" },
            "claude-opus-5": { "name": "Claude Opus 5" },
            "claude-sonnet-5": { "name": "Claude Sonnet 5" },
            "claude-haiku-4-5": { "name": "Claude Haiku 4.5" },
            "gemini-3.6-flash": { "name": "Gemini 3.6 Flash" },
            "qwen3-6-plus": { "name": "Qwen3 6 Plus" },
            "bytedance-seed-code": { "name": "ByteDance Seed Code" },
            "bytedance-glm-5.2": { "name": "ByteDance GLM 5.2" },
            "bytedance-dola-seed-2.0-code": { "name": "ByteDance Dola 2.0 Code" },
            "bytedance-dola-seed-2.0-pro": { "name": "ByteDance Dola 2.0 Pro" },
            "bytedance-deepseek-v4-flash": { "name": "ByteDance DeepSeek V4 Flash" }
          }
        }
      },
      "model": "litellm/deepseek-v4-flash-direct",
      "default_agent": "sisyphus",
      "plugin": ["oh-my-openagent@5.0.0-beta.48"],
      "mcp": {
        "plane": {
          "type": "local",
          "command": ["uvx", "plane-mcp-server", "stdio"],
          "enabled": true,
          "environment": {
            "PLANE_API_KEY": "{env:PLANE_API_KEY}",
            "PLANE_WORKSPACE_SLUG": "{env:PLANE_WORKSPACE_SLUG}",
            "PLANE_INTERNAL_BASE_URL": "{env:PLANE_INTERNAL_BASE_URL}",
            "PLANE_BASE_URL": "{env:PLANE_BASE_URL}"
          }
        },
        "github": {
          "type": "local",
          "command": ["npx", "-y", "@modelcontextprotocol/server-github"],
          "enabled": true,
          "environment": {
            "GITHUB_PERSONAL_ACCESS_TOKEN": "{env:MCP_GITHUB_TOKEN}"
          }
        }
      },
      "tools": {
        "plane*": false,
        "github*": false
      },
      "agent": {
        "sisyphus": { "tools": { "plane*": true, "github*": true } },
        "hephaestus": { "tools": { "plane*": true, "github*": true } },
        "prometheus": { "tools": { "plane*": true, "github*": true } },
        "atlas": { "tools": { "plane*": true, "github*": true } }
      }
    }
  # OMO runtime config (boot-copied to ~/.omo/omo.jsonc; OMO rewrites it —
  # normalizes models, records _migrations — hence writable target, template
  # source stays here). Mirrors the retired 12-agent fleet: Sisyphus brain on
  # deepseek-v4-flash-direct (user mandate), fleet on minimax-m3 default tier
  # with Claude/ByteDance escalation chains. Scribe has no OMO counterpart —
  # writing work routes via the `writing` category / sisyphus.
  # Model refs use provider/model where provider = `litellm` (opencode.json).
  omo.jsonc: |
    {
      "$schema": "https://raw.githubusercontent.com/code-yeongyu/oh-my-openagent/dev/assets/omo.schema.json",
      "[opencode]": {
        "categories": {
          "quick":      { "model": "litellm/deepseek-v4-flash", "fallback_models": ["litellm/minimax-m3", "litellm/claude-haiku-4-5"] },
          "default":    { "model": "litellm/minimax-m3", "fallback_models": ["litellm/glm-5.3", "litellm/claude-sonnet-5", "litellm/bytedance-glm-5.2"] },
          "deep":       { "model": "litellm/minimax-m3", "fallback_models": ["litellm/glm-5.3", "litellm/claude-sonnet-5", "litellm/bytedance-dola-seed-2.0-pro"] },
          "ultrabrain": { "model": "litellm/claude-opus-5", "fallback_models": ["litellm/glm-5.3", "litellm/bytedance-seed-code"] },
          "visual":     { "model": "litellm/gemini-3.6-flash", "fallback_models": ["litellm/qwen3-6-plus", "litellm/claude-sonnet-5"] },
          "writing":    { "model": "litellm/minimax-m3", "fallback_models": ["litellm/claude-sonnet-5"] }
        },
        "agents": {
          "sisyphus": {
            "model": "litellm/deepseek-v4-flash-direct",
            "fallback_models": ["litellm/claude-sonnet-5", "litellm/bytedance-glm-5.2"]
          },
          "hephaestus": {
            "model": "litellm/minimax-m3",
            "fallback_models": ["litellm/glm-5.3", "litellm/claude-sonnet-5", "litellm/bytedance-dola-seed-2.0-code"]
          },
          "oracle": {
            "model": "litellm/claude-opus-5",
            "fallback_models": ["litellm/glm-5.3", "litellm/bytedance-seed-code"]
          },
          "prometheus": {
            "model": "litellm/minimax-m3",
            "fallback_models": ["litellm/deepseek-v4-pro", "litellm/claude-sonnet-5", "litellm/bytedance-glm-5.2"]
          },
          "metis": {
            "model": "litellm/minimax-m3",
            "fallback_models": ["litellm/deepseek-v4-pro", "litellm/claude-sonnet-5", "litellm/bytedance-glm-5.2"]
          },
          "momus": {
            "model": "litellm/minimax-m3",
            "fallback_models": ["litellm/glm-5.3", "litellm/claude-sonnet-5", "litellm/bytedance-dola-seed-2.0-pro"]
          },
          "atlas": {
            "model": "litellm/minimax-m3",
            "fallback_models": ["litellm/deepseek-v4-pro", "litellm/claude-sonnet-5", "litellm/bytedance-dola-seed-2.0-pro"]
          },
          "explore": {
            "model": "litellm/deepseek-v4-flash",
            "fallback_models": ["litellm/minimax-m3", "litellm/claude-haiku-4-5", "litellm/bytedance-deepseek-v4-flash"]
          },
          "librarian": {
            "model": "litellm/deepseek-v4-flash",
            "fallback_models": ["litellm/minimax-m3", "litellm/claude-haiku-4-5", "litellm/bytedance-deepseek-v4-flash"]
          },
          "multimodal-looker": {
            "model": "litellm/gemini-3.6-flash",
            "fallback_models": ["litellm/qwen3-6-plus", "litellm/claude-sonnet-5", "litellm/bytedance-seed-code"]
          },
          "sisyphus-junior": {
            "model": "litellm/deepseek-v4-flash",
            "fallback_models": ["litellm/minimax-m3", "litellm/claude-haiku-4-5", "litellm/bytedance-deepseek-v4-flash"]
          }
        },
        "background_task": {
          "defaultConcurrency": 8
        },
        "runtime_fallback": {
          "enabled": true,
          "retry_on_errors": [400, 401, 403, 404, 429, 500, 502, 503, 504],
          "max_fallback_attempts": 3,
          "cooldown_seconds": 30,
          "timeout_seconds": 30,
          "notify_on_fallback": false,
          "restore_primary_after_cooldown": true
        }
      }
    }
