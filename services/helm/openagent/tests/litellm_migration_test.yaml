suite: test openagent umbrella chart
templates:
  - charts/litellm-helm/templates/migrations-job.yaml
  - charts/litellm-helm/templates/deployment.yaml
release:
  name: openagent
  namespace: openagent
tests:
  - it: should NOT render the prisma-migration PreSync hook Job (upstream leak)
    # Regression: litellm/proxy/prisma_migration.py has an upstream memory
    # leak — pod OOMs with exit 137 after migrations complete, regardless
    # of memory cap (verified at 256Mi/1Gi/2Gi/4Gi, all OOMKilled).
    # We disable the migration Job entirely; schema updates require manual
    # `kubectl exec` or an upstream fix.
    asserts:
      - notExists:
          path: metadata.name
        documentSelector:
          path: metadata.name
          value: openagent-litellm-migrations
          skipEmptyTemplates: true

---
suite: litellm subchart still renders (control for the assertion above)
# Companion control: "the migration template renders nothing" is only meaningful
# if the aliased subchart renders at all. Without this, the suite above would
# keep passing if litellm were disabled, renamed, or the alias dropped — a
# green test proving nothing. Subchart templates can't be targeted via
# `templates:` (helm-unittest only resolves chart-local paths), so assert
# via documentSelector on full render.
release:
  name: openagent
  namespace: openagent
tests:
  - it: still renders the litellm ConfigMap
    asserts:
      - exists:
          path: data
        documentSelector:
          path: metadata.name
          value: openagent-litellm-config
