suite: openagent local model lane
release:
  name: openagent
  namespace: openagent
tests:
  - it: registers the LFM local model, seeds it as default, and carries no local deep lane
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)model: openai/lfm2.5:24b-a2b-q4_K_M.*?model_name: lfm2.5-24b-local"
        documentSelector:
          path: metadata.name
          value: openagent-litellm-config
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "qwen3.8-27b-local"
        documentSelector:
          path: metadata.name
          value: openagent-litellm-config
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)model:\n  default: claude-haiku-5-5\n  provider: litellm"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent-config
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)categories:.*?deep:\n          - litellm/claude-sonnet-5"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent-config
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "qwen3.8-27b-local"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent-config
