suite: openagent local Qwen3.6 default
release:
  name: openagent
  namespace: openagent
tests:
  - it: registers the Qwen3.6 local alias and seeds it as the Hermes default
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)model: openai/qwen3.6:35b-a3b-q4_K_M.*?model_name: qwen3.6-35b-local"
        documentSelector:
          path: metadata.name
          value: openagent-litellm-config
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)model:\n  default: qwen3.6-35b-local\n  provider: litellm"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent-config
