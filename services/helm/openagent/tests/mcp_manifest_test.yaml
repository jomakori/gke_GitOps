suite: openagent MCP manifest + verification hooks (structure)
templates:
  - hooks.yaml
release:
  name: openagent
  namespace: openagent
# Static MCP policy (pins, timeouts, lifecycles, tool surface) is owned by the
# hermes-tools binary (`mcp verify --mode validate`) — this suite asserts only
# template structure: what renders, when, and under which values.
tests:
  - it: renders the MCP manifest ConfigMap with manifest + per-server keys
    asserts:
      - exists:
          path: data.mcp-manifest
        documentSelector:
          path: metadata.name
          value: openagent-mcp-manifest
      - exists:
          path: data.server-argocd
        documentSelector:
          path: metadata.name
          value: openagent-mcp-manifest
      - exists:
          path: data.server-google-workspace
        documentSelector:
          path: metadata.name
          value: openagent-mcp-manifest
      - exists:
          path: data.server-obscura
        documentSelector:
          path: metadata.name
          value: openagent-mcp-manifest

  - it: renders the preflight Job when its toggle is on
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true
        documentSelector:
          path: metadata.name
          value: openagent-mcp-preflight
      - isKind:
          of: Job
        documentSelector:
          path: metadata.name
          value: openagent-mcp-preflight
      - equal:
          path: metadata.name
          value: openagent-mcp-preflight
        documentSelector:
          path: metadata.name
          value: openagent-mcp-preflight

  - it: drops the preflight Job when its toggle is off
    set:
      mcpVerification.preflight.enabled: false
    asserts:
      - notExists:
          path: metadata.name
        documentSelector:
          path: metadata.name
          value: openagent-mcp-preflight
          skipEmptyTemplates: true

  - it: renders the drift CronJob with the configured schedule
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true
        documentSelector:
          path: metadata.name
          value: openagent-mcp-drift
      - isKind:
          of: CronJob
        documentSelector:
          path: metadata.name
          value: openagent-mcp-drift
      - equal:
          path: spec.schedule
          value: "*/15 * * * *"
        documentSelector:
          path: metadata.name
          value: openagent-mcp-drift
