suite: openagent memory bounding — hermes-agent resources
templates:
  - charts/hermes-agent/templates/deployment.yaml
  - charts/hermes-agent/templates/configmap.yaml
  - charts/hermes-agent/templates/secret.yaml
release:
  name: openagent
  namespace: openagent
tests:
  - it: hermes-agent requests.memory is 4Gi and limits.memory is 12Gi
    asserts:
      - isKind:
          of: Deployment
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 4Gi
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 12Gi
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent

  - it: hermes-agent CPU request 2 with a 3 ceiling for boot bursts
    asserts:
      - isKind:
          of: Deployment
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "2"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "3"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
