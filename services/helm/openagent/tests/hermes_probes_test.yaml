suite: hermes-agent gateway probes (8642 gateway API)
templates:
  - charts/hermes-agent/templates/deployment.yaml
  - charts/hermes-agent/templates/configmap.yaml
  - charts/hermes-agent/templates/secret.yaml
release:
  name: openagent
  namespace: openagent
tests:
  - it: renders startup, readiness, and liveness probes on the gateway container
    asserts:
      - isKind:
          of: Deployment
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].name
          value: hermes-agent
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - exists:
          path: spec.template.spec.containers[0].startupProbe
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - exists:
          path: spec.template.spec.containers[0].readinessProbe
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 8642
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 10
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      # ~20 min budget (120 × 10s) > measured ~10 min boot.
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 120
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].startupProbe.timeoutSeconds
          value: 3
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8642
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 10
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 3
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 8642
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 10
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 6
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 3
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent
