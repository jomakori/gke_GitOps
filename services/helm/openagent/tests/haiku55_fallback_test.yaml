suite: openagent DeepSeek → Haiku 5.5 fallback
release:
  name: openagent
  namespace: openagent
tests:
  - it: registers Haiku 5.5 on the Claude proxy
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)model: openai/claude-haiku-5-5.*?max_input_tokens: 1000000.*?max_output_tokens: 128000.*?model_name: claude-haiku-5-5"
        documentSelector:
          path: metadata.name
          value: openagent-litellm-config
  - it: routes Hermes fallbacks straight to the DeepSeek floor (Copilot lane retired)
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)fallback_providers:\n- model: deepseek-v4-flash-direct\n  provider: litellm"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent-config
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "(?s)fallback_providers:\n- model: copilot-luna"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent-config
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)fallback_providers:\n  - model: claude-haiku-5-5\n    provider: litellm"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent-config
  - it: routes the OMO Sisyphus chain Haiku 5.5 then DeepSeek
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?s)chains:.*?          sisyphus:\n          - litellm/claude-haiku-5-5\n          - litellm/deepseek-v4-flash-direct"
        documentSelector:
          path: metadata.name
          value: openagent-hermes-agent-config
