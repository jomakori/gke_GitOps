# Global config (injected by Terraform → ArgoCD)
clusterDomain: "maklab.net"
storageClass: "local-path"
dopplerConfig: "svc_openagent"
namespace: "openagent"

# Skill rendering runtime. "cluster" (default) renders the k8s-gitops-context
# skill body for the in-cluster ConfigMap (GitHub MCP + /workspace/repos paths,
# no local absolute paths). "local" renders for the opencode workstation
# (~/.config/opencode/skills) with /Users/maklab paths + Repo Locations block.
# The local SKILL.md is a GENERATED COPY via .useful-scripts/render_local_skill.sh.
runtimeMode: "cluster"

# Shared GHCR pull secret
ghcrPullSecret: ""

# ── LiteLLM upstream chart values ──────────────────────────────────
litellm:
  enabled: true
  fullnameOverride: "openagent-litellm"
  image:
    repository: ghcr.io/berriai/litellm
    tag: "main-stable"
    pullPolicy: IfNotPresent
  service:
    port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 4Gi
  db:
    deployStandalone: false
    useExisting: true
    endpoint: "openagent-pg.openagent.svc.cluster.local"
    database: "litellm"
    secret:
      name: "openagent-litellm-secrets"
      usernameKey: "OPENAGENT_PG_USER"
      passwordKey: "OPENAGENT_PG_PASSWORD"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    # Memory HPA (same pattern as argocd-repo-server in-cluster). Litellm is
    # memory-bound (Python + prisma + uvicorn), CPU is mostly idle even under
    # load. Trigger at 70% of 4Gi limit = ~2.8Gi per pod; live max 1.7Gi →
    # ~1.1Gi headroom before scaling, not too tight.
    targetMemoryUtilizationPercentage: 70
  migrationJob:
    enabled: false # disabled: litellm/proxy/prisma_migration.py leaks memory
    # after migrations complete, OOMKilling the pod with exit 137. With
    # 256Mi/1Gi/2Gi/4Gi all OOMing (wall time 7s/11s/47s/52s respectively),
    # the only way to keep the Job=Successful and sync green is to disable it.
    # Litellm image tag is `main-stable` (pinned upstream tag) and the
    # 130-migration set is already applied to the DB — log confirmed
    # "No pending migrations to apply" on every attempt. New migrations
    # will require manual `kubectl exec` runs of the migration script, or
    # an upstream fix to prisma_migration.py.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 4Gi
  masterkeySecretName: "openagent-litellm-masterkey"
  masterkeySecretKey: "masterkey"
  environmentSecrets:
    - "openagent-secrets"
  proxy_config:
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # Raw pass-through to claude-pipe (claude-proxy). Requests to
      # /claude-pipe/<path> are forwarded byte-for-byte to the upstream, so
      # Anthropic /v1/messages and OpenAI /v1/chat/completions both work
      # without LiteLLM format conversion. NOTE: OSS pass-through routes skip
      # LiteLLM key auth (Enterprise-only) — protect via Cloudflare Access.
      pass_through_endpoints:
        - path: "/claude-pipe"
          target: "http://claude-proxy.openagent.svc.cluster.local:4523"
          include_subpath: true
          forward_headers: true
          timeout: 300
    litellm_settings:
      drop_params: true
    router_settings:
      # disable_cooldowns:true short-circuits fallbacks (429s never spill to
      # backup models). allowed_fails/cooldown_time keep probes off throttled
      # upstreams; 8 fails / 30s cooldown keeps a single upstream blip from
      # nuking a whole run with a 429 storm (crash-looped claude-proxy 08-24).
      disable_cooldowns: false
      allowed_fails: 8
      cooldown_time: 30
      num_retries: 2
      routing_strategy: least-busy
      request_timeout: 180
    model_list:
      - model_name: opencode/big-pickle
        litellm_params:
          model: openai/big-pickle
          api_key: os.environ/OPENCODE_API_KEY
          api_base: os.environ/OPENCODE_API_BASE
          merge_reasoning_content_in_choices: true
          order: 1
      # nemotron-3-ultra-free: most capable free opencode model (verified
      # 08-24: correct code output, clean content). Replaces the unavailable
      # deepseek-v4-flash-free.
      - model_name: opencode/nemotron-3-ultra-free
        litellm_params:
          model: openai/nemotron-3-ultra-free
          api_key: os.environ/OPENCODE_API_KEY
          api_base: os.environ/OPENCODE_API_BASE
          order: 1
          use_chat_completions_api: true
          merge_reasoning_content_in_choices: true
      # laguna-s-2.1-free: clean fast free model (verified 08-24: content
      # direct, no reasoning wrapper). Replaces the dead north-mini-code-free.
      - model_name: opencode/laguna-s-2.1-free
        litellm_params:
          model: openai/laguna-s-2.1-free
          api_key: os.environ/OPENCODE_API_KEY
          api_base: os.environ/OPENCODE_API_BASE
          order: 1
          use_chat_completions_api: true
          merge_reasoning_content_in_choices: true
      - model_name: opencode/mimo-v2.5-free
        litellm_params:
          model: openai/mimo-v2.5-free
          api_key: os.environ/OPENCODE_API_KEY
          api_base: os.environ/OPENCODE_API_BASE
          order: 1
          use_chat_completions_api: true
          merge_reasoning_content_in_choices: true
      - model_name: anthropic/claude-opus-4-7
        litellm_params:
          model: anthropic/claude-opus-4-7
          api_key: os.environ/ANTHROPIC_API_KEY
          order: 1
      - model_name: kimi-k3
        litellm_params:
          model: openai/moonshotai/kimi-k3
          api_base: https://api.kilo.ai/api/gateway/v1
          api_key: os.environ/KILO_API_KEY
          merge_reasoning_content_in_choices: true
          order: 1
        model_info:
          input_cost_per_token: 0.000003
          output_cost_per_token: 0.000015
          cache_read_input_token_cost: 0.0000003
      # DeepSeek via Kilo Gateway (primary route for the fleet).
