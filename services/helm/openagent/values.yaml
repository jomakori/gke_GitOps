# Global config (injected by Terraform → ArgoCD)
clusterDomain: "maklab.net"
storageClass: "local-path"
dopplerConfig: "svc_openagent"
namespace: "openagent"

# Skill rendering runtime. "cluster" (default) renders the k8s-gitops-context
# skill body for the in-cluster ConfigMap (GitHub MCP + /workspace/repos paths,
# no local absolute paths). "local" renders for the opencode workstation
# (~/.config/opencode/skills) with /Users/maklab paths + Repo Locations block.
# The local SKILL.md is a GENERATED COPY via .useful-scripts/render_local_skill.sh.
runtimeMode: "cluster"

# Shared GHCR pull secret
ghcrPullSecret: ""

# ── Tools image (prebuilt gitopsctl binary) ────────────────────────
tools:
  # The prebuilt gitopsctl tools image ships the MCP-verify binary. The
  # preflight Job and drift CronJob run it from /opt/tools/gitopsctl — the
  # install-gitopsctl initContainer copies it out of the image into an
  # emptyDir (the image is FROM scratch: binary only). The hermes image and
  # the openagent-hermes-agent PVC stay, because the MCP toolchain
  # (npx/uvx/deno/obscura/bw and the npm/uv caches) lives under /opt/data and
  # is required for a faithful handshake.
  image:
    repository: ghcr.io/jomakori/gitopsctl
    # Published commit sha of the gitopsctl image (bare sha, no `sha-`
    # prefix). `latest` must never be used with IfNotPresent.
    tag: dab8bebe51b7f03127f2cc7d145faa35c5bcea4f
    pullPolicy: IfNotPresent

# ── LiteLLM upstream chart values ──────────────────────────────────
litellm:
  enabled: true
  fullnameOverride: "openagent-litellm"
  image:
    repository: ghcr.io/berriai/litellm
    # Immutable: upstream republishes `main-stable`, and IfNotPresent keeps one cached build per node.
    tag: "1.98.0@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4"
    pullPolicy: IfNotPresent
  service:
    port: 4000
  resources:
    requests:
      cpu: 100m
      # 1.5Gi, not 512Mi. HPA memory utilisation is a percentage of the
      # container's REQUEST, so `targetMemoryUtilizationPercentage: 70` against
      # a 512Mi request means a 358Mi target — unreachable when the pod actually
      # uses ~1Gi. The HPA therefore reported ~197% and sat at maxReplicas
      # indefinitely, parking ~4Gi of the node's memory on a rule it could never
      # satisfy. 70% of 1.5Gi (~1.05Gi) is a target the fleet can meet, so it can
      # scale back toward minReplicas and release that memory.
      memory: 1.5Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  db:
    deployStandalone: false
    useExisting: true
    # Centralized cluster. `pg-main-primary` is an ExternalName to the read-write
    # service `pg-main`, which since StackGres connection pooling was enabled
    # resolves to pgbouncer (pg-main-0:6432) rather than straight to Postgres.
    # Same endpoint shape Plane uses.
    endpoint: "pg-main-primary.data.svc.cluster.local"
    database: "litellm"
    # `?pgbouncer=true` is required by the pooling above, not cosmetic: the pooler
    # runs in `transaction` mode, so Prisma must stop using server-side prepared
    # statements — a statement prepared in one pooled session is not valid in the
    # next one, which fails as `prepared statement "s0" already exists` or
    # `does not exist` under load. Prisma's documented flag for this is
    # `pgbouncer=true`. Costs nothing on a direct connection, correct on a pooled one.
    url: "postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)?pgbouncer=true"
    secret:
      name: "openagent-litellm-secrets"
      usernameKey: "OPENAGENT_PG_USER"
      passwordKey: "OPENAGENT_PG_PASSWORD"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    # Memory HPA (same pattern as argocd-repo-server in-cluster). Litellm is
    # memory-bound (Python + prisma + uvicorn), CPU is mostly idle even under
    # load.
    #
    # HPA memory utilisation is measured against the container's REQUEST, never
    # its limit. This comment previously said "70% of 4Gi limit = ~2.8Gi per
    # pod", which made the trigger look comfortable when it was really 70% of a
    # 512Mi request (358Mi) against ~1Gi of real usage — hence a permanent 197%
    # and maxReplicas forever. The request above is the number that matters.
    targetMemoryUtilizationPercentage: 70
  # Chart-native PDB (upstream `pdb` key). This is the stack's only LLM
  # gateway and it is HPA-scaled; with no PDB a single node drain can evict
  # every replica at once. The subchart renders the selector itself.
  pdb:
    enabled: true
    maxUnavailable: 1
  migrationJob:
    enabled: false # disabled: litellm/proxy/prisma_migration.py leaks memory
    # after migrations complete, OOMKilling the pod with exit 137. With
    # 256Mi/1Gi/2Gi/4Gi all OOMing (wall time 7s/11s/47s/52s respectively),
    # the only way to keep the Job=Successful and sync green is to disable it.
    # Litellm image tag is `main-stable` (pinned upstream tag) and the
    # 130-migration set is already applied to the DB — log confirmed
    # "No pending migrations to apply" on every attempt. New migrations
    # will require manual `kubectl exec` runs of the migration script, or
    # an upstream fix to prisma_migration.py.
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 4Gi
  masterkeySecretName: "openagent-litellm-masterkey"
  masterkeySecretKey: "masterkey"
  environmentSecrets:
    - "openagent-secrets"
  proxy_config:
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # Raw pass-through to the claude-proxy gateway (OCP). Requests to
      # /claude-pipe/<path> are forwarded byte-for-byte to the upstream without
      # LiteLLM format conversion — OpenAI /v1/chat/completions works, including
      # tool calling. NOTE: OCP serves chat completions only; Anthropic
      # /v1/messages is NOT available on this upstream (the previous
      # claude-pipe image served it). NOTE: OSS pass-through routes skip
      # LiteLLM key auth (Enterprise-only) — protect via Cloudflare Access.
      pass_through_endpoints:
        - path: "/claude-pipe"
          target: "http://claude-proxy.openagent.svc.cluster.local:4523"
          include_subpath: true
          forward_headers: true
          timeout: 300
    litellm_settings:
      drop_params: true
    router_settings:
      # Plain model access ONLY — OMO owns both fallback layers (per-agent
      # fallback_models chains + runtime_fallback on 429/5xx inside OMO
      # orchestration). Cooldowns/retries here would fight OMO's runtime fallback
      # (double-retry delays, cooldown storms). Hermes-side requests ride the
      # Hermes fallback_providers chain instead. User-mandated 09-07.
      disable_cooldowns: true
      num_retries: 0
      routing_strategy: least-busy
      request_timeout: 180
    model_list:
      - model_name: anthropic/claude-opus-4-7
        litellm_params:
          model: anthropic/claude-opus-4-7
          api_key: os.environ/ANTHROPIC_API_KEY
          order: 1
      - model_name: kimi-k3
        litellm_params:
          model: openai/moonshotai/kimi-k3
          api_base: https://api.kilo.ai/api/gateway/v1
          api_key: os.environ/KILO_API_KEY
          merge_reasoning_content_in_choices: true
          order: 1
        model_info:
          input_cost_per_token: 0.000003
          output_cost_per_token: 0.000015
          cache_read_input_token_cost: 0.0000003
      # DeepSeek via Kilo Gateway (primary route for the fleet).
      - model_name: deepseek-v4-flash
        litellm_params:
          model: openai/deepseek/deepseek-v4-flash
          api_base: https://api.kilo.ai/api/gateway/v1
          api_key: os.environ/KILO_API_KEY
