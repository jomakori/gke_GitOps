# ── Hermes Agent ────────────────────────────────────────────────────
hermes:
  enabled: true
hermes-agent:
  # Image for the gateway pod AND the MCP verification Jobs: both run the same
  # toolchain, and the mise node/uv on the PVC is ABI-coupled to this image.
  # Pinned explicitly so a Job never resolves an empty tag; keep in lockstep
  # with the hermes-agent chart dependency's appVersion (1.15.0 -> v2026.9.11).
  image:
    repository: nousresearch/hermes-agent
    tag: "v2026.9.11"
    pullPolicy: IfNotPresent
  config:
    # Config schema version emitted by the pinned gateway image: v2026.9.11
    # carries schema 42 (hermes_cli/config_defaults.py). Keep in lockstep with
    # image.tag above. Required because bootstrap.overwrite=true re-seeds
    # config.yaml from this chart on every pod start, so the version the
    # image's config migration stamps onto the PVC is always overwritten;
    # with no version key the image's docker_config_migrate reads 0, warns
    # "predates version 12", and skips stamping on every boot.
    _config_version: 42
    model:
      # DeepSeek V4 Flash (direct API) — orchestration brain. User-mandated
      # default (09-07); cheapest tier that holds orchestration. Claude
      # escalation-only, ByteDance BYOK as credit-proof catch-all.
      default: deepseek-v4-flash-direct
      provider: litellm
    # Sisyphus fallback chain (bootstrap skips sisyphus — it IS the default
    # profile). Kilo fallback first, Claude flat-fee catch-all, ByteDance BYOK
    # last (bills Volcengine starter account — survives zero Kilo balance AND
    # a broken Claude proxy).
    fallback_providers:
      - provider: litellm
        model: deepseek-v4-pro
      - provider: litellm
        model: claude/sonnet-5
      - provider: litellm
        model: bytedance-glm-5.2
    providers:
      litellm:
        base_url: http://openagent-litellm.openagent.svc.cluster.local:4000/v1
        key_env: LITELLM_MASTER_KEY
        discover_models: true
    agent:
      # Chart v0.9.1 seeded max_turns: 90; v1.15.0 removed the seed (unlimited
      # default). Explicit pin preserves the capped behavior when bootstrap
      # re-seeds config.yaml from chart values on every pod start.
      max_turns: 90
      # One attempt per model, then the next fallback layer — the host default
      # of 3 replays a 429/5xx against the model that just refused it.
      api_max_retries: 1
      # Hermes = the sole user-facing persona (HERMES_HOME=/opt/data) — the
      # communicator that fields ALL prompts, classifies, dispatches via the
      # native `omo` tool, and synthesizes worker results. The OMO roster and
      # chains live under hermes-agent.config.plugins.entries.omo.settings
      # (the path Hermes' ctx.get_config reads); personas live in the
      # hermes-omo-plugin.
      system_prompt: |
        You are Hermes — the communicator. You field ALL prompts and are the
        SOLE user-facing persona. You never act as a worker yourself, and a
        worker (Sisyphus, Hephaestus, Oracle, …) never addresses the user
        directly — you synthesize its results and speak for it. Classify every
        request BEFORE acting.

        ## Classification

        - TRIVIAL (typo, single config, known pattern): Answer directly. No delegation.
        - STANDARD (new feature, refactor, multi-file): Route through planning pipeline.
        - COMPLEX (architecture, cross-system, security): Full pipeline with review gates.

        ## Delegation

        1. Assess context: is the request clear and unambiguous?
           → NO: Ask ONE clarifying question first.
           → YES: Proceed.

        2. Standard: Build a plan → present for USER APPROVAL → wait for "go" / "approved".
           Complex: Analyze (Metis) → Architect (Oracle) → Plan (Prometheus) → Review (Momus)
           → present for USER APPROVAL.

        3. NEVER execute Standard/Complex work without explicit user sign-off.

        4. On approval: spin up Plane kanban tickets via the plane-ticket-sync
           skill (project per board, [Spec] parent ticket + child tickets per
           work item, Risks/gotchas as comments) unless the user declines.

        ## Tool routing

        - Quick work (< 3 tool calls): do it yourself (read_file, terminal, web).
        - Simple focused subtask / non-coding: `delegate_task`.
        - Real engineering (multi-file, refactor, bugfix, tests): `omo`
          (action="dispatch"). The OMO orchestrator runs the agent fleet
          internally (Sisyphus, Hephaestus, Oracle, … — see the OMO roster).
          Inject project conventions + memory context into the prompt.
        - After every omo dispatch: check returned `status` (completed /
          error / timeout), read the result summary, verify changes against
          the request, update memory/todos, then synthesize and report to the
          user as Hermes.
        - Max concurrency: 8 for omo dispatches. Do not fire parallel omo
          dispatches against the same directory/repo — serialize those.

        ## Identity

        - You are always Hermes to the user. Never present a worker persona as
          the assistant or let raw worker output reach the user — synthesize it
          first, then speak.

        ## Approval Gates (BLOCK these without asking)

        - merge / commit
        - publish / deploy / push
        - destructive (delete, teardown, drop)
        - external-send (email, API, webhook)

        ## Style

        - Terse. Caveman mode. Drop articles and filler.
        - ALWAYS verbalize your classification: "Classified as [tier]."
        - Show your work. Tell user what you're doing.
        - When delegating: "Delegating to [agent] for [task]."
    # environment_hint (skills) was previously carried by the removed
    # hermes-workspace deployment via configmap-hermes-config.yaml. Re-wired
    # here so the hermes-agent keeps these skills after the workspace is gone.
      environment_hint: |
        # Skills: Ponytail + Caveman + k8s-gitops-context

        ## K8s GitOps Context

        THIS IS THE CLUSTER SOURCE OF TRUTH. Read @/opt/data/memories/k8s-gitops-context.md
        before ANY cluster-related task. Contains:
        - Repo paths, secrets chain (Doppler → ESO → pods)
        - Sync wave order, helm chart patterns, service registration
        - Istio networking, Cloudflare tunnel, Terraform execution order
        - OpenAgent architecture (umbrella chart, native OMO orchestration, Claude proxy)
        - Critical gotchas (SNI, ExternalSecret patterns, storage limitations)

        NEVER operate on cluster resources without reading the context first.

        ## Ponytail — YAGNI Ladder (before writing code)

        Before writing code, stop at the first rung that holds:
        1. Does this need to exist? → no: skip it (YAGNI)
        2. Already in this codebase? → reuse it, don't rewrite
        3. Stdlib does it? → use it
        4. Native platform feature? → use it
        5. Installed dependency? → use it
        6. One line? → one line
        7. Only then: the minimum that works

        The ladder runs after understanding the problem, not instead of it.
        Lazy about the solution, never about reading.

        Lazy, not negligent: trust-boundary validation, data-loss handling,
        security, and accessibility are never on the chopping block.

        Source: github.com/DietrichGebert/ponytail

        ## Caveman — Terse Communication

        Respond terse like smart caveman. All technical substance stay.
        Only fluff die.

        Rules:
        - Drop: articles (a/an/the), filler (just/really/basically),
          pleasantries (sure/certainly/of course), hedging
        - Fragments OK. Short synonyms. Technical terms exact.
        - Code blocks unchanged. Errors quoted exact.
        - Pattern: [thing] [action] [reason]. [next step].

        Not: "Sure! I'd be happy to help you with that."
        Yes: "Bug in auth middleware. Token expiry check use `<` not `<=`. Fix:"

        Auto-Clarity: Drop caveman for security warnings, irreversible
        actions, multi-step sequences where fragments risk misread.
        Resume after clear part.

        Source: github.com/JuliusBrussee/caveman

        ## Pre-commit — Validate Before Commit

        BEFORE EVERY COMMIT: run pre-commit hooks.

        ```bash
        pre-commit run --files $(git diff --cached --name-only)
        ```

        Hooks in this repo:
        - yamllint: YAML syntax, indentation
        - check-merge-conflict: unresolved merge markers
        - trailing-whitespace: trailing spaces
        - gitleaks: API keys, tokens
        - helm-docs: Helm chart docs sync

        Failure flow:
        1. pre-commit fails → read error
        2. Fix issue (usually indentation)
        3. git add fixed file
        4. Re-run pre-commit
        5. Green → commit
    # tool_search: defer tool schemas; model searches by name, only matched
    # schemas load. "on" = always (14 MCP servers → max unconditional cut).
    tools:
      tool_search:
        enabled: "on"
        threshold_pct: 10
        search_default_limit: 5
        max_search_limit: 20
    # Compact sooner — 530K-token requests came from late compaction.
    compression:
      enabled: true
      threshold: 0.35
      target_ratio: 0.20
    delegation:
      # Subagent tier = minimax-m3 (live pod value; NOT flash — flash is for
      # Sisyphus/Hermes brains only, per user 09-07).
      model: minimax-m3
      provider: litellm
      base_url: http://openagent-litellm.openagent.svc.cluster.local:4000/v1
      api_key: ${LITELLM_MASTER_KEY}
      max_iterations: 30
      reasoning_effort: medium
      # Concurrent delegated children. The router prompt tells Hermes to cap OMO
      # fan-out at 8, and the plugin's own graph default (max_parallel: 4) stays
      # under it; unset, the host default of 10 applies and the real ceiling is
      # only implied.
      max_concurrent_children: 8
      # One backup, not a second ladder: the OMO engine's per-agent chains own
      # the escalation for delegated work, but a plain delegate_task child still
      # needs a live route when the delegation primary is down (Kilo 402). This
      # is the same credit-independent last resort every per-agent chain ends on.
      fallback_providers:
        - provider: litellm
          model: deepseek-v4-flash-direct
      # Workers run unattended: subagent threads carry no interactive approval
      # channel (the delegate path installs a non-interactive callback), so
      # without this Hermes auto-DENIES every dangerous command a subagent runs.
      # Enabled deliberately: the fleet may now run destructive commands without
      # asking. Read-only agents stay constrained by the plugin's pre_tool_call
      # guard — this flag only decides the dangerous-command gate.
      subagent_auto_approve: true
      # OMO nesting needs depth 3: Hermes(0) -> Sisyphus(1) -> Prometheus(2) ->
      # Metis(3). Hermes derives a child's role from depth vs this cap and
      # IGNORES any role the caller passes, so at the default (1) every child is
      # a leaf and Sisyphus cannot delegate at all.
      max_spawn_depth: 3

    auxiliary:
      vision:
        # Vision stays Claude — GLM 5.3 / Kimi K3 are text-only.
        provider: litellm
        model: claude/sonnet-5
    plugins:
      enabled:
        - discord-platform
        - omo
      entries:
        omo:
          settings:
            # Fallback-model layer, mirroring the old `opencode.runtimeFallback`
            # block. Per-agent and per-category chains live under `chains:` /
            # `categories:` below; this governs how a chain is walked when a
            # model call fails. `enabled: false` fails fast instead of falling
            # back; `retry_on_errors` is the status set that triggers a walk.
            # ORDERING RULE (2026-09-25): Claude is the LAST PREMIUM layer of a
            # ladder — below it must sit a route that cannot run out of credits
            # (the DeepSeek direct API, or a bytedance subsidy route). Free
            # routes therefore belong above Claude, not directly below it.
            # Deliberate exception: chains that LEAD with deepseek-v4-flash-direct
            # (sisyphus, librarian, explore, sisyphus-junior, quick) keep their
            # primary untouched — there the credit-independent route is already
            # the entry point, so Claude is not the last premium layer.
            runtime_fallback:
              enabled: true
              retry_on_errors: [400, 401, 402, 403, 404, 429, 500, 502, 503, 504, 529]
              max_fallback_attempts: 6
              cooldown_seconds: 30
              restore_primary_after_cooldown: true
            chains:
              sisyphus:
                - litellm/deepseek-v4-flash-direct
                - litellm/claude-sonnet-5
                - litellm/bytedance-glm-5.2
              hephaestus:
                - litellm/minimax-m3
                - litellm/glm-5.3
                - litellm/bytedance-dola-seed-2.0-code
                - litellm/claude-sonnet-5
                - litellm/deepseek-v4-flash-direct
              prometheus:
                - litellm/minimax-m3
                - litellm/deepseek-v4-pro
                - litellm/bytedance-glm-5.2
                - litellm/claude-sonnet-5
                - litellm/deepseek-v4-flash-direct
              atlas:
                - litellm/minimax-m3
                - litellm/deepseek-v4-pro
                - litellm/bytedance-dola-seed-2.0-pro
                - litellm/claude-sonnet-5
                - litellm/deepseek-v4-flash-direct
              metis:
                - litellm/minimax-m3
                - litellm/deepseek-v4-pro
                - litellm/bytedance-glm-5.2
                - litellm/claude-sonnet-5
                - litellm/deepseek-v4-flash-direct
              momus:
                - litellm/minimax-m3
                - litellm/glm-5.3
                - litellm/bytedance-dola-seed-2.0-pro
                - litellm/claude-sonnet-5
                - litellm/deepseek-v4-flash-direct
              oracle:
                - litellm/glm-5.3
                - litellm/bytedance-seed-code
                - litellm/claude-opus-5
                - litellm/deepseek-v4-flash-direct
              librarian:
                - litellm/deepseek-v4-flash-direct
                - litellm/deepseek-v4-flash
                - litellm/minimax-m3
                - litellm/claude-haiku-4-5
                - litellm/bytedance-deepseek-v4-flash
              explore:
                - litellm/deepseek-v4-flash-direct
                - litellm/deepseek-v4-flash
                - litellm/minimax-m3
                - litellm/claude-haiku-4-5
                - litellm/bytedance-deepseek-v4-flash
              multimodal-looker:
                - litellm/gemini-3.6-flash
                - litellm/qwen3-6-plus
                - litellm/bytedance-seed-code
                - litellm/claude-sonnet-5
                - litellm/deepseek-v4-flash-direct
              sisyphus-junior:
                - litellm/deepseek-v4-flash-direct
                - litellm/deepseek-v4-flash
                - litellm/minimax-m3
                - litellm/claude-haiku-4-5
                - litellm/bytedance-deepseek-v4-flash
            categories:
              quick:
                - litellm/deepseek-v4-flash-direct
                - litellm/deepseek-v4-flash
                - litellm/minimax-m3
                - litellm/claude-haiku-4-5
              deep:
                - litellm/minimax-m3
                - litellm/glm-5.3
                - litellm/bytedance-dola-seed-2.0-pro
                - litellm/claude-sonnet-5
                - litellm/deepseek-v4-flash-direct
              ultrabrain:
                - litellm/claude-opus-5
                - litellm/glm-5.3
                - litellm/bytedance-seed-code
                - litellm/deepseek-v4-flash-direct
              visual-engineering:
                - litellm/gemini-3.6-flash
                - litellm/qwen3-6-plus
                - litellm/claude-sonnet-5
                - litellm/deepseek-v4-flash-direct
              writing:
                - litellm/minimax-m3
                - litellm/claude-sonnet-5
                - litellm/deepseek-v4-flash-direct
    mcp_servers:
      # ── Manifest = single source of truth ──────────────────────────────
      # Hermes reads these entries from config.yaml; the bootstrap init
      # container re-seeds that file from this chart on every pod start
      # (overwrite: true), so live edits are reverted. Change the manifest
      # here. These invariants are enforced by
      # gitopsctl `mcp verify --mode validate` (CI + pre-commit) and proven in
      # cluster by the preflight hook Job + drift CronJob (templates/hooks.yaml):
      #
      #   * PINS — every npx/uvx package is pinned to an exact published
      #     version. `@latest` and bare names let a registry-side publish
      #     silently change what runs.
      #   * connect_timeout — no server rides the 60s default. Package-
      #     launched servers get 180s (a cold npx/uvx resolve + reify races
      #     60s); locally-installed binaries and HTTP endpoints keep 60s.
      #   * lazy — every server registers its tools from the on-disk schema
      #     cache and connects on the first call, so a slow handshake never
      #     sits in the gateway's startup path.
      #   * lifecycle (stdio only) — idle_timeout_seconds and
      #     max_lifetime_seconds recycle a wedged server instead of leaving it
      #     dead until the pod restarts. Deliberately conservative: a recycle
      #     drops that server's tools until it reconnects, so 30 min idle is
      #     longer than any normal interactive gap and the 6 h cap only bounds
      #     a genuinely unbounded leak.
      #   * package cache (npx only) — the entry declares its OWN
      #     env.npm_config_cache at /opt/data/.npm-mcp/<server-name>, literally.
      #     The client spawns children with a filtered env (PATH/HOME + only
      #     what the entry declares, never the gateway's NPM_CONFIG_CACHE), so
      #     npm falls back to a HOME-derived cache: the gateway's HOME is
      #     /opt/data, i.e. the shared PVC dir every process installs into.
      #     A server without its own cache lands there and one interrupted
      #     reify leaves a node_modules that every later start SKIPS
      #     ("Could not read package.json ... ENOENT") — bitwarden ran that way
      #     for weeks, invisible, because tools/list still answered.
      #   * uv toolchain layout (uvx only) — HOME, PATH, UV_CACHE_DIR,
      #     UV_TOOL_DIR and UV_TOOL_BIN_DIR are declared explicitly. uv derives
      #     the tool dir from HOME, and the gateway's HOME (/opt/data) differs
      #     from the verifier Jobs' (/opt/data/home), so an undeclared server is
      #     certified against a directory the gateway never reads. Declaring
      #     them makes both contexts identical by construction.
      #
      # Servers marked `enabled: false` are PARKED, not deleted: the pinned
      # package, env mapping and tool surface stay so re-enabling is a
      # one-line change, and the lint fails if a parked server disappears.
      #
      # An entry may declare an `auth_probe` (tool + args): one read-only call
      # the drift CronJob makes after a green handshake. A handshake certifies
      # the PROTOCOL, never the credential — servers authenticate lazily per
      # tool call, so a revoked token or a partial OAuth grant lists every tool
      # and answers none. google-workspace's stored grant covered Drive only:
      # 122 tools discovered, 33 of the 35 declared ones reporting "ACTION
      # REQUIRED", and every gate green. Probes run in drift mode ONLY, so a
      # dead third-party credential alerts within one interval instead of
      # failing an unrelated deploy's sync.
      #
      # npx-launched servers get their private cache as described above; the
      # shared PVC cache (/opt/data/.npm) is what the rule exists to keep clear
      # of. Concurrent installs corrupt each other, and the fallout is
      # invisible at the pod level: `npm error ENOTEMPTY ... rename`,
      # `Cannot find module .../fastmcp/dist/FastMCP.js` (partial install), or
      # `sh: 1: mcp-grafana: Permission denied` (a root-owned bin), all
      # surfacing only as `Failed to connect to MCP server '<name>'`.
      # The boot pre-warm (gitopsctl mcp prewarm, invoked from the hermes-agent
      # command) materialises the private caches without starting a server.
      codegraph:
        lazy: true
        # Local code graph; the server only reads a .codegraph/ index, which
        # the boot step builds or catches up. One tool, project path per call.
        command: "npx"
        args: ["-y", "@colbymchenry/codegraph@1.6.0", "serve", "--mcp"]
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          # Silences the usage-stats notice (stdout is the JSON-RPC channel).
          CODEGRAPH_TELEMETRY: "0"
          npm_config_cache: "/opt/data/.npm-mcp/codegraph"
          npm_config_loglevel: "error"
        tools:
          include: [codegraph_explore]
          resources: false
          prompts: false

      github:
        lazy: true
        # Parked: repo access is covered by the OMO fleet's MCP tooling.
        # Kept pinned so re-enabling is a one-line change.
        enabled: false
        command: "npx"
        args: ["-y", "@modelcontextprotocol/server-github@2025.4.8"]
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: "${MCP_GITHUB_TOKEN}"
          npm_config_loglevel: "error"
          npm_config_cache: "/opt/data/.npm-mcp/github"
        tools:
          include: [list_issues, create_issue, update_issue, search_code, search_repositories, get_file_contents]
          resources: false
          prompts: false

      gistpad:
        lazy: true
        # Parked: overlaps the github server's surface.
        enabled: false
        command: "npx"
        args: ["-y", "gistpad-mcp@0.5.0"]
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          GITHUB_TOKEN: "${MCP_GITHUB_TOKEN}"
          npm_config_cache: "/opt/data/.npm-mcp/gistpad"
        tools:
          resources: false
          prompts: false

      argocd:
        lazy: true
        # Re-enabled: this is the server that ran @latest and broke on registry
        # drift, which the pin below now makes impossible by construction. The
        # preflight Job certifies the handshake on every deploy.
        command: "npx"
        args: ["-y", "argocd-mcp@0.9.0", "stdio"]
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          ARGOCD_API_TOKEN: "${MCP_ARGOCD_TOKEN}"
          ARGOCD_BASE_URL: "${MCP_ARGOCD_URL}"
          npm_config_cache: "/opt/data/.npm-mcp/argocd"
        auth_probe: {tool: list_applications, args: {limit: 1}}
        tools:
          resources: false
          prompts: false
          include: [list_applications, get_application, get_application_managed_resources, get_application_resource_tree, get_application_events, sync_application, get_appproject, get_resources]

      grafana:
        lazy: true
        # Parked: @leval/mcp-grafana@1.1.7 writes THREE non-protocol lines to
        # STDOUT (dist/cli.js startup banner, a tool-category summary, and
        # pino's JSON log line). stdout IS the JSON-RPC channel, so the
        # client's stdout_reader raises "Invalid JSON ... Failed to parse
        # JSONRPC message from server". MCP servers are initialised in an
        # asyncio TaskGroup, so that single exception cancels every sibling
        # mid-handshake — which is why unrelated and perfectly healthy servers
        # (plane, google-workspace, argocd, gistpad) surfaced as CancelledError
        # collateral. The `grep --line-buffered jsonrpc` wrapper filters stdout
        # to real protocol frames (matching "jsonrpc", not "^{", because
        # pino's line is valid JSON). Re-enabled with the wrapper below in
        # place; the preflight Job now certifies the filtered handshake, so a
        # regression fails the deploy instead of silently cancelling unrelated
        # servers mid-handshake.
        command: "sh"
        args:
          - "-c"
          - "exec npx -y @leval/mcp-grafana@1.1.7 | grep --line-buffered jsonrpc"
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          GRAFANA_URL: "${MCP_GRAFANA_URL}"
          GRAFANA_SERVICE_ACCOUNT_TOKEN: "${MCP_GRAFANA_TOKEN}"
          npm_config_cache: "/opt/data/.npm-mcp/grafana"
        auth_probe: {tool: search_dashboards, args: {query: ""}}
        tools:
          resources: false
          prompts: false
          include: [search_dashboards, get_dashboard_by_uid, get_dashboard_summary, get_dashboard_panel_queries, list_datasources, get_datasource_by_uid, get_datasource_by_name, query_prometheus, list_prometheus_metric_names, list_prometheus_label_names, list_prometheus_label_values, list_loki_label_names]

      doppler:
        lazy: true
        command: "npx"
        args: ["-y", "@dopplerhq/mcp-server@1.0.5"]
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          DOPPLER_TOKEN: "${MCP_DOPPLER_TOKEN}"
          npm_config_cache: "/opt/data/.npm-mcp/doppler"
        auth_probe: {tool: workplace_get}
        tools:
          resources: false
          prompts: false
          include: [secrets_get, secrets_list, secrets_names, secrets_update, secrets_delete, secrets_download, configs_list, configs_get, projects_list, projects_get, activity_logs_list, workplace_get]

      arctic-shift:
        lazy: true
        # Read-only Reddit search against the Arctic Shift archive API. No
        # auth and no tokens: Reddit's own JSON endpoints answer this
        # cluster's egress IP with a 403 datacenter block page, and its RSS
        # endpoints with 429 — so every credential-free alternative that
        # queries reddit.com live fails here, which is what parked the
        # key-based Reddit servers before this one. Verified against the
        # archive API from this pod before wiring: /api/posts/search returned
        # 200 with posts <1 day old, and /api/comments/search?link_id=<id>
        # returned real comment bodies.
        #
        # The surface is read-only by construction: upstream ships exactly
        # three tools and holds no credentials, so there is nothing to write
        # with. tools.include stays an explicit list because the verifier
        # compares declared names literally against the tools/list result.
        #
        # Two limits worth knowing before debugging a "missing" result: the
        # archive lags Reddit by roughly 24-48h, and the API rejects a bare
        # full-text query — `query` must be paired with `subreddit` or
        # `author`, so search is within a community, not across all of
        # Reddit.
        command: "npx"
        args: ["-y", "arctic-shift-mcp@1.0.2"]
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          npm_config_cache: "/opt/data/.npm-mcp/arctic-shift"
        tools:
          include: [search_submissions, search_comments, get_post_comments]
          resources: false
          prompts: false

      obscura:
        lazy: true
        command: "/opt/data/bin/obscura"
        args: ["mcp", "--stealth"]
        timeout: 120
        # Local binary, not a registry package: no resolve to race, so the
        # 60s default is ample.
        connect_timeout: 60
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        tools:
          resources: false
          prompts: false
          include: [browser_navigate, browser_snapshot, browser_markdown, browser_click, browser_type, browser_fill, browser_fill_form, browser_extract, browser_interactive_elements, browser_links, browser_screenshot, browser_scroll, browser_search, browser_evaluate, browser_wait_for_text]

      drawio:
        lazy: true
        # Re-enabled: runs a local deno checkout cloned at boot (see the boot
        # script). No registry package, so no version pin applies.
        command: "sh"
        args:
          - "-c"
          - "cd /opt/data/drawio-mcp-server && exec /opt/data/bin/deno run --config /opt/data/drawio-mcp-server/deno.json -P --allow-read --allow-env --allow-net src/index.ts --transport stdio"
        timeout: 120
        # Deno may compile/cache lockfile deps on first run — between the
        # no-resolve 60s and the package-resolve 180s.
        connect_timeout: 120
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        tools:
          # Exact names, not a glob: the verifier compares declared tools
          # literally against the live tools/list result, so "*" (legal for
          # Hermes per the MCP config reference) is reported as missing. Surface
          # taken from the upstream README, certified live by the preflight Job.
          include: [search-shapes, get-shape-categories, get-shapes-in-category, get-style-presets, add-cells, edit-cells, edit-edges, set-cell-shape, delete-cell-by-id, list-paged-model, get-diagram-stats, export-diagram, import-diagram, clear-diagram]
          resources: false
          prompts: false

      google-workspace:
        lazy: true
        command: "uvx"
        args: ["workspace-mcp==1.26.1", "--tool-tier", "complete"]
        # uvx resolves a large dependency tree (google-api-python-client et
        # al) on a cold tool cache; give it room past the 60s default.
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          # The gateway pod's environment and the boot pre-warm disagree. The
          # boot script installs the uv toolchain under HOME=/opt/data/home,
          # while the gateway runs with HOME=/root and a PATH that has neither
          # /opt/data/bin nor the mise shims. So uvx looked for the tool in
          # UV_TOOL_DIR=/opt/data/.local/share/uv/tools — which holds only
          # .gitignore and .lock — while the pre-warmed
          # plane-mcp-server/workspace-mcp live in
          # /opt/data/home/.local/share/uv/tools. Every connect re-resolved the
          # package in an empty tool dir and the child died inside the window.
          #
          # These values are the ones the in-cluster preflight Job supplies
          # (openagent.mcpVerifyEnv) when it starts this server successfully, so
          # declaring them makes the gateway child identical to the certified
          # environment instead of merely similar to it.
          #
          # Superseded note: an earlier version of this block claimed uvx
          # degraded 0.12.5 gnu -> 0.11.6 musl under the filtered env. That was
          # wrong — both uv binaries on this host report 0.11.6
          # (aarch64-unknown-linux-musl), and the cache dirs hold the same
          # entry count. The divergence is the directory layout above, not the
          # uv version.
          HOME: /opt/data/home
          PATH: /opt/data/bin:/opt/data/mise/shims:/opt/data/home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          MISE_CONFIG_FILE: /mise/mise.toml
          MISE_DATA_DIR: /opt/data/mise
          MISE_CACHE_DIR: /opt/data/mise-cache
          # The tool's default file sandbox is $HOME/.workspace-mcp/attachments,
          # and this child runs as root while the agent runs as `hermes` — so the
          # directory is root-owned and every file the agent writes is refused:
          # import_to_google_doc and the file-based Drive uploads answer "path is
          # outside permitted directories" for anything the agent can actually
          # produce. Point the sandbox at a PVC directory both users can write.
          # Its URL fetcher also refuses localhost and private ranges, so a file
          # path is the only way in.
          ALLOWED_FILE_DIRS: /opt/data/tmp
          UV_CACHE_DIR: /opt/data/home/.cache/uv
          UV_TOOL_DIR: /opt/data/home/.local/share/uv/tools
          UV_TOOL_BIN_DIR: /opt/data/home/.local/bin
          NPM_CONFIG_CACHE: /opt/data/home/.npm
          GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
          GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
        auth_probe: {tool: list_calendars, args: {user_google_email: joe3rdwash@gmail.com}}
        tools:
          include: [create_doc, get_doc_content, get_doc_as_markdown, inspect_doc_structure, batch_update_doc, modify_doc_text, find_and_replace_doc, create_table_with_data, debug_table_structure, update_paragraph_style, update_doc_headers_footers, export_doc_to_pdf, list_docs_in_folder, create_drive_file, create_drive_folder, list_drive_items, search_drive_files, get_drive_file_permissions, get_drive_shareable_link, manage_drive_access, import_to_google_doc, update_drive_file, copy_drive_file, get_drive_file_content, create_spreadsheet, read_sheet_values, modify_sheet_values, get_spreadsheet_info, search_gmail_messages, get_gmail_message_content, send_gmail_message, draft_gmail_message, get_events, manage_event, list_calendars]
          resources: false
          prompts: false

      plane:
        lazy: true
        command: "uvx"
        args: ["plane-mcp-server==0.3.2", "stdio"]
        timeout: 120
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          # See the google-workspace block: the gateway's HOME=/root and its
          # PATH (no /opt/data/bin, no mise shims) sent uvx to the empty
          # /opt/data/.local/share/uv/tools instead of the pre-warmed
          # /opt/data/home/.local/share/uv/tools that actually contains
          # plane-mcp-server. These are the values the in-cluster preflight Job
          # passes (openagent.mcpVerifyEnv) when it starts this server
          # successfully — declaring them makes the gateway child match the
          # certified environment. The earlier 0.12.5-gnu-vs-0.11.6-musl claim
          # in this comment was wrong and has been removed.
          HOME: /opt/data/home
          PATH: /opt/data/bin:/opt/data/mise/shims:/opt/data/home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          MISE_CONFIG_FILE: /mise/mise.toml
          MISE_DATA_DIR: /opt/data/mise
          MISE_CACHE_DIR: /opt/data/mise-cache
          UV_CACHE_DIR: /opt/data/home/.cache/uv
          UV_TOOL_DIR: /opt/data/home/.local/share/uv/tools
          UV_TOOL_BIN_DIR: /opt/data/home/.local/bin
          NPM_CONFIG_CACHE: /opt/data/home/.npm
          PLANE_API_KEY: "${PLANE_API_KEY}"
          PLANE_WORKSPACE_SLUG: "${PLANE_WORKSPACE_SLUG}"
          PLANE_INTERNAL_BASE_URL: "http://plane-api.plane.svc.cluster.local:8000"
          PLANE_BASE_URL: "https://plane.maklab.net"
        auth_probe: {tool: project, args: {action: list}}
        tools:
          resources: false
          prompts: false
          include: [project, workitem, member, state, label, workitem_comment, workitem_attachment, workitem_relation, page]

      skiplagged:
        lazy: true
        # Public remote Streamable-HTTP server. tools.include is the live
        # surface captured when it was pinned into the manifest; the drift
        # CronJob alerts if upstream changes it.
        url: "https://mcp.skiplagged.com/mcp"
        timeout: 60
        connect_timeout: 60
        tools:
          include: [sk_flights_search, sk_destinations_anywhere, sk_flex_departure_calendar, sk_flex_return_calendar, sk_hotels_search, sk_cars_search, sk_hotel_details, sk_faq_search, sk_resolve_location, sk_resolve_iata]
          resources: false
          prompts: false

      kiwi:
        lazy: true
        # Public remote Streamable-HTTP server (see skiplagged).
        url: "https://mcp.kiwi.com"
        timeout: 60
        connect_timeout: 60
        tools:
          include: [search-flight, feedback-to-devs]
          resources: false
          prompts: false

      ferryhopper:
        lazy: true
        # Public remote Streamable-HTTP server (see skiplagged).
        url: "https://mcp.ferryhopper.com/mcp"
        timeout: 60
        connect_timeout: 60
        tools:
          include: [get_ports, get_disruptions, get_direct_connections_for_ports, search_trips, search_trips_v2, trip_details]
          resources: false
          prompts: false

      bitwarden:
        lazy: true
        # Re-enabled: pinned, and the inline block below performs `bw login` /
        # `bw unlock` at spawn. The preflight Job certifies that the unlock
        # yields a usable session — the failure mode that kept this parked.
        command: "sh"
        args:
          - "-c"
          - |-
            BW_CLIENTID=$BW_CLIENTID BW_CLIENTSECRET=$BW_CLIENTSECRET bw login --apikey 2>/dev/null
            export BW_SESSION=$(BW_PASSWORD=$BW_PASSWORD bw unlock --passwordenv BW_PASSWORD 2>/dev/null | grep "BW_SESSION=" | sed "s/.*BW_SESSION=\"//;s/\".*//")
            exec npx -y @bitwarden/mcp-server@2026.7.0
        connect_timeout: 180
        idle_timeout_seconds: 1800
        max_lifetime_seconds: 21600
        env:
          BW_CLIENTID: "${BW_CLIENTID}"
          BW_CLIENTSECRET: "${BW_CLIENTSECRET}"
          BW_PASSWORD: "${BW_PASSWORD}"
          npm_config_cache: "/opt/data/.npm-mcp/bitwarden"
        auth_probe: {tool: status}
        tools:
          resources: false
          prompts: false
          include: [status, sync, list, get, create_item, edit_item, delete, restore, move, generate, create_folder, edit_folder, create_attachment, create_text_send]
  env: {}
  extraEnv:
    - name: DISCORD_BOT_TOKEN
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: DISCORD_BOT_TOKEN
    - name: DISCORD_BOT_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: DISCORD_BOT_CLIENT_ID
    # Off on purpose. The dashboard is a second full Hermes process, and each
    # Hermes process loads every configured MCP server — so enabling it doubled
    # the MCP fleet (13 extra stdio children; the pod measured 1596MiB / 107
    # processes with it on, 604MiB / 61 off) on a node already short of memory.
    #
    # Nothing user-facing depends on it: the WebUI reaches the agent through the
    # API server on 8642 (`HERMES_WEBUI_GATEWAY_BASE_URL`), and the external
    # `dashboard:` route serves the WebUI on 3000 — so :9119 was only ever an
    # in-cluster admin UI. The HERMES_DASHBOARD_HOST/_PORT/_BASIC_AUTH_* vars,
    # DASHBOARD_BASE_URL, the dashboard-auth patch and the agent Service that
    # exposed :9119 are removed with it; re-enabling means restoring those too.
    - name: HERMES_DASHBOARD
      value: "0"
    - name: DISCORD_ALLOW_ALL_USERS
      value: "true"
    - name: API_SERVER_ENABLED
      value: "true"
    - name: API_SERVER_KEY
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: API_SERVER_KEY
    - name: API_SERVER_HOST
      value: "0.0.0.0"
    - name: API_SERVER_PORT
      value: "8642"
    - name: API_SERVER_CORS_ORIGINS
      value: "https://openagent.maklab.net"
    - name: CLAUDE_PROXY_API_KEY
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: CLAUDE_PROXY_API_KEY
    # Read by the Discord session-link hook (templates/hooks.yaml) to build the
    # link it posts. Named for what it points at — the WebUI, not the removed
    # Hermes dashboard it used to be called after.
    - name: WEBUI_BASE_URL
      value: "https://openagent.maklab.net"
  extraVolumes:
    - name: hermes-hooks
      configMap:
        name: openagent-hermes-hooks
    - name: k8s-gitops-context
      configMap:
        name: openagent-k8s-gitops-context
    - name: hermes-mise-config
      configMap:
        name: openagent-hermes-mise-config
    # gitopsctl binary installed by the install-gitopsctl initContainer
    # (prebuilt tools image — no in-cluster Go build).
    - name: tools
      emptyDir: {}
    # The MCP manifest, rendered from this file's mcp_servers by
    # templates/hooks.yaml. Mounting it (rather than duplicating the package
    # list in the boot flow) keeps the manifest the single source of truth.
    - name: mcp-verify
      configMap:
        name: openagent-mcp-manifest
  extraVolumeMounts:
    - name: hermes-hooks
      mountPath: /opt/data/hooks/discord-session-link
      readOnly: true
    - name: k8s-gitops-context
      mountPath: /opt/data/memories/k8s-gitops-context.md
      subPath: k8s-gitops-context.md
      readOnly: true
    - name: hermes-mise-config
      mountPath: /mise
      readOnly: true
    - name: tools
      mountPath: /opt/tools
      readOnly: true
    - name: mcp-verify
      mountPath: /opt/data/mcp-verify
      readOnly: true
  extraInitContainers:
    # Installs the gitopsctl binary from the prebuilt tools image into the
    # shared tools emptyDir (no command: the image ENTRYPOINT is gitopsctl).
    # Subchart values cannot be templated, so this image is a literal copy of
    # tools.image above — bump both together.
    - name: install-gitopsctl
      image: ghcr.io/jomakori/gitopsctl:dab8bebe51b7f03127f2cc7d145faa35c5bcea4f
      imagePullPolicy: IfNotPresent
      args: ["install", "/opt/tools/gitopsctl"]
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
      volumeMounts:
        - name: tools
          mountPath: /opt/tools
    # Provisions the hermes-omo-plugin onto the shared PVC. The env below is the
    # ONLY switch — subchart values are not templated, so this block cannot read
    # the omo: values. Flip OMO_PROVISION_ENABLED to "true" (and confirm
    # OMO_PROVISION_REPOSITORY exists) to provision; until then it no-ops.
    - name: provision-omo-plugin
      image: alpine/git:2.45.2
      imagePullPolicy: IfNotPresent
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
      env:
        - name: OMO_PROVISION_ENABLED
          value: "true"
        - name: OMO_PROVISION_REPOSITORY
          value: "https://github.com/jomakori/hermes-omo-plugin.git"
        - name: OMO_PROVISION_REF
          value: "main"
      command:
        - sh
        - -c
        - |
          set -eu
          if [ "${OMO_PROVISION_ENABLED}" = "true" ]; then
            mkdir -p /opt/data/plugins
            rm -rf /opt/data/plugins/omo
            git clone --depth 1 --branch "${OMO_PROVISION_REF}" "${OMO_PROVISION_REPOSITORY}" /opt/data/plugins/omo
            chown -R 10000:10000 /opt/data/plugins/omo
          fi
      volumeMounts:
        - name: data
          mountPath: /opt/data
  command:
    # gitopsctl boot (installed into the tools emptyDir by the
    # install-gitopsctl initContainer) replaces the old boot.sh shim.
    - /opt/tools/gitopsctl
    - boot
  args: []
  # Startup + readiness probes on the gateway's own API server (0.0.0.0:8642,
  # `/health`). These previously targeted the dashboard on :9119, which is now
  # disabled (HERMES_DASHBOARD below): the dashboard runs as a *second* Hermes
  # process, and every Hermes process loads the entire MCP fleet. Two processes
  # meant two of every MCP server — 13 extra stdio children and roughly 800MiB
  # on a node already under memory pressure — and the boot-time contention was
  # breaking stdio pipes, surfacing as clustered MCP `Connection closed` drops.
  # The gateway is the process actually doing the work and answers `/health` on
  # 8642, so it is also the more honest readiness gate.
  #
  # The gateway only listens there AFTER the ~10 min boot (apt systemDeps →
  # mise install → MCP prewarm → codegraph indexing → `boot: handing over to
  # hermes`). Before this gating landed the pod reported Ready immediately
  # while nothing served, so the `openagent-hermes-agent` endpoints listed it
  # ready ~10 min early. startupProbe gates readiness, so the pod only flips
  # Ready once the gateway actually answers; readiness failures never restart
  # a pod.
  #
  # No livenessProbe: the image's s6-overlay already supervises and restarts
  # `hermes gateway run` on crash, so a liveness probe would duplicate that
  # while adding a way to kill-restart the whole pod (dropping in-flight
  # orchestration).
  probes:
    startup:
      httpGet:
        path: /health
        port: 8642
      # ~20 min budget = 120 failures × 10s. Measured boot is ~10 min, so
      # ~2× headroom; httpGet counts any 2xx/3xx as success.
      periodSeconds: 10
      failureThreshold: 120
      timeoutSeconds: 3
    readiness:
      httpGet:
        path: /health
        port: 8642
      # 3 failures × 10s = 30s before the pod is un-Ready; readiness never
      # restarts, so this only gates the endpoints, not the pod lifecycle.
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
  resources:
    # requests == limits on purpose: VPA `Auto` only applies a recommendation to
    # a container whose request equals its limit, and it does so silently — with
    # the old 256Mi/6Gi split the autoscaler would have done nothing while
    # looking enabled. The VPA owns this number from here, bounded 3Gi-8Gi (see
    # the vpa block at the bottom of this file).
    #
    # 3Gi to start, down from 6Gi: this container's measured idle/peak is
    # ~1.7-2.2Gi. If the data disagrees, the autoscaler raises it.
    requests:
      cpu: "2"
      memory: 3Gi
    limits:
      cpu: "2"
      memory: 3Gi
  extraEnvFrom:
    - secretRef:
        name: openagent-secrets
  service:
    # No Service: the only port the OCI subchart maps is 9119, which served the
    # dashboard only, and the dashboard is off (HERMES_DASHBOARD above). The
    # WebUI and everything else reach the agent through `openagent-hermes-api`
    # (8642), which this chart defines separately. Leaving this enabled would
    # publish a port with nothing behind it.
    enabled: false
    port: 9119

# ── MCP verification (manifest certification) ──────────────────────
# The manifest at hermes-agent.config.mcp_servers is the single source of
# truth. Two in-cluster checks prove it against real servers; both do a genuine
# JSON-RPC initialize + tools/list and fail when a declared tool is missing:
#
#   * preflight — Helm/ArgoCD PostSync hook Job. PostSync (not PreSync) because
#     it needs the same PVC + boot-installed toolchain the gateway uses, which
#     the main sync creates. Fails the sync loudly and prints the server's own
#     stderr (which Hermes discards, half the original problem).
#   * cronjob — every 15 min, quiet on match; only drift produces output and a
#     non-zero exit, so a watcher alerts on change, not on every run.
#
# Both are disabled by a single toggle without deleting them. The checks run
# the gitopsctl verifier binary from the prebuilt tools image (installed into
# an emptyDir by the install-gitopsctl initContainer); the manifest ships in
# the openagent-mcp-manifest ConfigMap, rendered from the same mcp_servers
# values — no duplicated server list anywhere.
mcpVerification:
  preflight:
    enabled: true
    # PostSync can run before the gateway's first boot has installed the
    # toolchain (mise node/uv on the PVC); the Job waits up to this long.
    toolchainWaitSeconds: 300
    activeDeadlineSeconds: 1800
    backoffLimit: 0
  cronjob:
    enabled: true
    schedule: "*/15 * * * *"
    activeDeadlineSeconds: 900
    backoffLimit: 0
    historyLimit: 3

# ── Hermes WebUI (gateway thin-client dashboard) ───────────────────
hermes-webui:
  enabled: true

claude-proxy:
  enabled: true

# ── Shared DB ───────────────────────────────────────────
# The `openagent-pg` cluster is gone; LiteLLM writes to the centralised `pg-main`
# cluster (ns data). Its role (`openagent`) and bootstrap SQL are declared in
# services/helm/postgres-operator, as a `users:` shorthand entry that renders into the
# SGScript the cluster now references — that chart owns DB provisioning, this one does not.

# ── Dashboard (VirtualService) ─────────────────────────────────────
dashboard:
  subdomain: "openagent"
  destination:
    host: "openagent-hermes-workspace.openagent.svc.cluster.local"
    port: 3000

# ── LiteLLM Admin UI (VirtualService) ─────────────────────────────
litellmVirtualService:
  host: "litellm.maklab.net"
  destination:
    host: "openagent-litellm.openagent.svc.cluster.local"
    port: 4000

# ── VPA ────────────────────────────────────────────────────────────
# Dynamic sizing: the autoscaler sets the memory/cpu requests from observed
# usage, so nobody hand-tunes a limit again. Read the header comment in
# templates/vpa.yaml before changing this block — three things there are
# easy to get silently wrong (requests == limits required for `Auto` to apply at
# all; bounds are per container, `"*"` is only a default; helpers are switched
# off explicitly instead of inheriting these numbers).
#
# The floors are intentionally LOW. VPA's target follows the observed peak, not
# the floor, so a low minAllowed does not squeeze a busy pod — it stops an idle
# history from capping the recommendation and lets the autoscaler pull an
# over-provisioned pod back down. `maxAllowed` is the real guardrail.
vpa:
  enabled: true
  updateMode: "Auto"
  targets:
    # The gateway. Its own history keeps the recommendation where the work
    # actually is. `hermes-doctor` is deliberately NOT listed — it falls to
    # the `"*"` policy and keeps its manifest values.
    - name: openagent-hermes-agent
      containers:
        - name: hermes-agent
          # RequestsOnly, not the default RequestsAndLimits. The gateway is idle
          # most of the day and bursts hard at boot (13 MCP servers start
          # together). With requests == limits the VPA's decayed-average target
          # becomes a hard cap: it pinned CPU at 109m — 80% of cgroup periods
          # throttled — and discovery timed out at 120s with 8-9 servers still
          # connecting. RequestsOnly keeps VPA's sizing for scheduling while the
          # manifest's 2000m limit survives, so the burst is not throttled. It
          # also stops the VPA pulling the memory limit below the manifest's
          # 3Gi, which would OOM a pod that peaks near 2Gi at boot.
          controlledValues: RequestsOnly
          minCpu: 50m
          minMemory: 512Mi
          maxCpu: "2"
          maxMemory: 8Gi

# PodDisruptionBudget for LiteLLM, which is HPA-scaled (min 2, max 4) and is the stack's
# only LLM gateway. It had no PDB while running 4/4 replicas.
