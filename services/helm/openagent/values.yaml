# ── Hermes Agent ────────────────────────────────────────────────────
hermes:
  enabled: true
hermes-agent:
  config:
    model:
      # Minimax M3 via Kilo Gateway — orchestration brain (swapped from
      # glm-5.3 due to Kilo credit burn). Claude is escalation-only.
      default: minimax-m3
      provider: litellm
    # Sisyphus fallback chain (bootstrap skips sisyphus — it IS the default
    # profile). Kilo fallback first, Claude flat-fee as credit-proof catch-all.
    fallback_providers:
      - provider: litellm
        model: deepseek-v4-pro
      - provider: litellm
        model: claude/sonnet-5
    providers:
      litellm:
        base_url: http://openagent-litellm.openagent.svc.cluster.local:4000/v1
        key_env: LITELLM_MASTER_KEY
        discover_models: true
    agent:
      # Sisyphus = THIS pod's default profile (HERMES_HOME=/opt/data) — the
      # orchestrator that fields ALL prompts and routes to the fleet below.
      # Personas' directives live in the omo-agents ConfigMap (rendered into
      # each profile's SOUL.md by the omo-bootstrap script at boot).
      system_prompt: |
        You are Sisyphus — OMO Orchestrator. You field ALL prompts.
        Classify every request BEFORE acting.

        ## Fleet (12 agents — your personas)

        Full spec: /opt/omo/omo-agents.yaml (mounted ConfigMap). Roster:

        - sisyphus (you)   — orchestrator; routes, classifies, gates
        - oracle           — architect; ultrabrain escalation, design
        - metis            — analyzer; pre-plan context sufficiency
        - prometheus       — planner; spec-driven implementation plans
        - momus            — reviewer; diffs + specs, quality gate
        - hephaestus       — builder; autonomous coding (deep)
        - atlas            — coordinator; multi-output verification
        - explore          — explorer; read-only repo scout
        - librarian        — researcher; docs + external sources
        - multimodal-looker — vision; image/audio/video, OCR-first
        - sisyphus-junior  — junior; trivial single-file fixes
        - scribe           — writer; docs, PR descriptions, release notes

        ## Classification

        - TRIVIAL (typo, single config, known pattern): Answer directly. No delegation.
        - STANDARD (new feature, refactor, multi-file): Route through planning pipeline.
        - COMPLEX (architecture, cross-system, security): Full pipeline with review gates.

        ## Delegation Pipeline (Standard + Complex)

        1. Assess context: is the request clear and unambiguous?
           → NO: Ask ONE clarifying question first.
           → YES: Proceed.

        2. Standard: Build a plan → present for USER APPROVAL → wait for "go" / "approved".
           Complex: Analyze (Metis) → Architect (Oracle) → Plan (Prometheus) → Review (Momus)
           → present for USER APPROVAL.

        3. NEVER execute Standard/Complex work without explicit user sign-off.

        4. On approval: spin up Plane kanban tickets via the plane-ticket-sync
           skill (project per board, [Spec] parent ticket + child tickets per
           work item, Risks/gotchas as comments) unless the user declines.

        ## Delegation rules

        - Pick persona by ROLE fit, never by model name. Category → canonical
          agent: quick → sisyphus-junior/explore; default → prometheus/momus/
          metis/atlas; deep → hephaestus; ultrabrain → oracle (escalation
          only, see omo-agents.yaml policy); visual → multimodal-looker;
          writing → scribe.
        - Cap concurrent subagent calls at 8 (max_parallel in
          omo-agents.yaml) — set in delegation max_concurrency.
        - Fallbacks are per-agent, one each, declared in omo-agents.yaml —
          you never invent fallback chains. LiteLLM is access only.
        - Delegated work runs in the persona's profile (own skills, memory,
          sessions). Trust persona descriptions from their SOUL.md.

        ## Approval Gates (BLOCK these without asking)

        - merge / commit
        - publish / deploy / push
        - destructive (delete, teardown, drop)
        - external-send (email, API, webhook)

        ## Style

        - Terse. Caveman mode. Drop articles and filler.
        - ALWAYS verbalize your classification: "Classified as [tier]."
        - Show your work. Tell user what you're doing.
        - When delegating: "Delegating to [persona] for [task]."
    # environment_hint (skills) was previously carried by the removed
    # hermes-workspace deployment via configmap-hermes-config.yaml. Re-wired
    # here so the hermes-agent keeps these skills after the workspace is gone.
      environment_hint: |
        # Skills: Ponytail + Caveman + k8s-gitops-context

        ## K8s GitOps Context

        THIS IS THE CLUSTER SOURCE OF TRUTH. Read @/opt/data/memories/k8s-gitops-context.md
        before ANY cluster-related task. Contains:
        - Repo paths, secrets chain (Doppler → ESO → pods)
        - Sync wave order, helm chart patterns, service registration
        - Istio networking, Cloudflare tunnel, Terraform execution order
        - OpenAgent architecture (umbrella chart, persona routing, Claude proxy)
        - Critical gotchas (SNI, ExternalSecret patterns, storage limitations)

        NEVER operate on cluster resources without reading the context first.

        ## Ponytail — YAGNI Ladder (before writing code)

        Before writing code, stop at the first rung that holds:
        1. Does this need to exist? → no: skip it (YAGNI)
        2. Already in this codebase? → reuse it, don't rewrite
        3. Stdlib does it? → use it
        4. Native platform feature? → use it
        5. Installed dependency? → use it
        6. One line? → one line
        7. Only then: the minimum that works

        The ladder runs after understanding the problem, not instead of it.
        Lazy about the solution, never about reading.

        Lazy, not negligent: trust-boundary validation, data-loss handling,
        security, and accessibility are never on the chopping block.

        Source: github.com/DietrichGebert/ponytail

        ## Caveman — Terse Communication

        Respond terse like smart caveman. All technical substance stay.
        Only fluff die.

        Rules:
        - Drop: articles (a/an/the), filler (just/really/basically),
          pleasantries (sure/certainly/of course), hedging
        - Fragments OK. Short synonyms. Technical terms exact.
        - Code blocks unchanged. Errors quoted exact.
        - Pattern: [thing] [action] [reason]. [next step].

        Not: "Sure! I'd be happy to help you with that."
        Yes: "Bug in auth middleware. Token expiry check use `<` not `<=`. Fix:"

        Auto-Clarity: Drop caveman for security warnings, irreversible
        actions, multi-step sequences where fragments risk misread.
        Resume after clear part.

        Source: github.com/JuliusBrussee/caveman

        ## Pre-commit — Validate Before Commit

        BEFORE EVERY COMMIT: run pre-commit hooks.

        ```bash
        pre-commit run --files $(git diff --cached --name-only)
        ```

        Hooks in this repo:
        - yamllint: YAML syntax, indentation
        - check-merge-conflict: unresolved merge markers
        - trailing-whitespace: trailing spaces
        - gitleaks: API keys, tokens
        - helm-docs: Helm chart docs sync

        Failure flow:
        1. pre-commit fails → read error
        2. Fix issue (usually indentation)
        3. git add fixed file
        4. Re-run pre-commit
        5. Green → commit
    # tool_search: defer tool schemas; model searches by name, only matched
    # schemas load. "on" = always (14 MCP servers → max unconditional cut).
    tools:
      tool_search:
        enabled: "on"
        threshold_pct: 10
        search_default_limit: 5
        max_search_limit: 20
    # Compact sooner — 530K-token requests came from late compaction.
    compression:
      enabled: true
      threshold: 0.35
      target_ratio: 0.20
    delegation:
      model: minimax-m3
      provider: litellm
      base_url: http://openagent-litellm.openagent.svc.cluster.local:4000/v1
      api_key: ${LITELLM_MASTER_KEY}
      max_iterations: 30
      reasoning_effort: medium

    auxiliary:
      vision:
        # Vision stays Claude — GLM 5.3 / Kimi K3 are text-only.
        provider: litellm
        model: claude/sonnet-5
    plugins:
      enabled:
        - discord-platform
    mcp_servers:
      github:
        command: "npx"
        args: ["-y", "@modelcontextprotocol/server-github"]
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: "${MCP_GITHUB_TOKEN}"
          npm_config_loglevel: "error"
        tools:
          include: [list_issues, create_issue, update_issue, search_code, search_repositories, get_file_contents]
          resources: false
          prompts: false

      gistpad:
        command: "npx"
        args: ["-y", "gistpad-mcp"]
        env:
          GITHUB_TOKEN: "${MCP_GITHUB_TOKEN}"
        tools:
          resources: false
          prompts: false

      argocd:
        command: "npx"
        args: ["-y", "argocd-mcp@latest", "stdio"]
        env:
          ARGOCD_API_TOKEN: "${MCP_ARGOCD_TOKEN}"
          ARGOCD_BASE_URL: "${MCP_ARGOCD_URL}"
        tools:
          resources: false
          prompts: false
          include: [list_applications, get_application, get_application_managed_resources, get_application_resource_tree, get_application_events, sync_application, get_appproject, get_resources]

      grafana:
        command: "npx"
        args: ["-y", "@leval/mcp-grafana"]
        env:
          GRAFANA_URL: "${MCP_GRAFANA_URL}"
          GRAFANA_SERVICE_ACCOUNT_TOKEN: "${MCP_GRAFANA_TOKEN}"
        tools:
          resources: false
          prompts: false
          include: [search_dashboards, get_dashboard_by_uid, get_dashboard_summary, get_dashboard_panel_queries, list_datasources, get_datasource_by_uid, get_datasource_by_name, query_prometheus, list_prometheus_metric_names, list_prometheus_label_names, list_prometheus_label_values, list_loki_label_names]

      doppler:
        command: "npx"
        args: ["-y", "@dopplerhq/mcp-server"]
        env:
          DOPPLER_TOKEN: "${MCP_DOPPLER_TOKEN}"
        tools:
          resources: false
          prompts: false
          include: [secrets_get, secrets_list, secrets_names, secrets_update, secrets_delete, secrets_download, configs_list, configs_get, projects_list, projects_get, activity_logs_list, workplace_get]

      obscura:
        command: "/opt/data/bin/obscura"
        args: ["mcp", "--stealth"]
        timeout: 120
        tools:
          resources: false
          prompts: false
          include: [browser_navigate, browser_snapshot, browser_markdown, browser_click, browser_type, browser_fill, browser_fill_form, browser_extract, browser_interactive_elements, browser_links, browser_screenshot, browser_scroll, browser_search, browser_evaluate, browser_wait_for_text]

      drawio:
        command: "sh"
        args:
          - "-c"
          - "cd /opt/data/drawio-mcp-server && exec /opt/data/bin/deno run --config /opt/data/drawio-mcp-server/deno.json -P --allow-read --allow-env --allow-net src/index.ts --transport stdio"
        timeout: 120
        tools:
          resources: false
          prompts: false

      google-workspace:
        command: "uvx"
        args: ["workspace-mcp", "--tool-tier", "complete"]
        env:
          GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID}"
          GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET}"
        tools:
          include: [create_doc, get_doc_content, get_doc_as_markdown, inspect_doc_structure, batch_update_doc, modify_doc_text, find_and_replace_doc, create_table_with_data, debug_table_structure, update_paragraph_style, update_doc_headers_footers, export_doc_to_pdf, list_docs_in_folder, create_drive_file, create_drive_folder, list_drive_items, search_drive_files, get_drive_file_permissions, get_drive_shareable_link, manage_drive_access, import_to_google_doc, update_drive_file, copy_drive_file, get_drive_file_content, create_spreadsheet, read_sheet_values, modify_sheet_values, get_spreadsheet_info, search_gmail_messages, get_gmail_message_content, send_gmail_message, draft_gmail_message, get_events, manage_event, list_calendars]
          resources: false
          prompts: false

      plane:
        command: "uvx"
        args: ["plane-mcp-server", "stdio"]
        env:
          PLANE_API_KEY: "${PLANE_API_KEY}"
          PLANE_WORKSPACE_SLUG: "${PLANE_WORKSPACE_SLUG}"
          PLANE_INTERNAL_BASE_URL: "http://plane-api.plane.svc.cluster.local:8000"
          PLANE_BASE_URL: "https://plane.maklab.net"
        timeout: 120
        tools:
          resources: false
          prompts: false
          include: [project, workitem, member, state, label, workitem_comment, workitem_attachment, workitem_relation, page]

      skiplagged:
        url: "https://mcp.skiplagged.com/mcp"
        timeout: 60
        tools:
          resources: false
          prompts: false

      kiwi:
        url: "https://mcp.kiwi.com"
        timeout: 60
        tools:
          resources: false
          prompts: false

      ferryhopper:
        url: "https://mcp.ferryhopper.com/mcp"
        timeout: 60
        tools:
          resources: false
          prompts: false

      bitwarden:
        command: "sh"
        args:
          - "-c"
          - |
            BW_CLIENTID=$BW_CLIENTID BW_CLIENTSECRET=$BW_CLIENTSECRET bw login --apikey 2>/dev/null
            export BW_SESSION=$(BW_PASSWORD=$BW_PASSWORD bw unlock --passwordenv BW_PASSWORD 2>/dev/null | grep "BW_SESSION=" | sed "s/.*BW_SESSION=\"//;s/\".*//")
            exec npx -y @bitwarden/mcp-server
        env:
          BW_CLIENTID: "${BW_CLIENTID}"
          BW_CLIENTSECRET: "${BW_CLIENTSECRET}"
          BW_PASSWORD: "${BW_PASSWORD}"
        tools:
          resources: false
          prompts: false
          include: [status, sync, list, get, create_item, edit_item, delete, restore, move, generate, create_folder, edit_folder, create_attachment, create_text_send]
  env: {}
  extraEnv:
    - name: DISCORD_BOT_TOKEN
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: DISCORD_BOT_TOKEN
    - name: DISCORD_BOT_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: DISCORD_BOT_CLIENT_ID
    - name: HERMES_DASHBOARD
      value: "1"
    - name: HERMES_DASHBOARD_HOST
      value: "0.0.0.0"
    - name: HERMES_DASHBOARD_PORT
      value: "9119"
    - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
    - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
    - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
    - name: DISCORD_ALLOW_ALL_USERS
      value: "true"
    - name: API_SERVER_ENABLED
      value: "true"
    - name: API_SERVER_KEY
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: API_SERVER_KEY
    - name: API_SERVER_HOST
      value: "0.0.0.0"
    - name: API_SERVER_PORT
      value: "8642"
    - name: API_SERVER_CORS_ORIGINS
      value: "https://openagent.maklab.net"
    - name: CLAUDE_PROXY_API_KEY
      valueFrom:
        secretKeyRef:
          name: openagent-secrets
          key: CLAUDE_PROXY_API_KEY
    - name: DASHBOARD_BASE_URL
      value: "https://openagent.maklab.net"
  extraVolumes:
    - name: hermes-hooks
      configMap:
        name: openagent-hermes-hooks
    - name: omo-agents
      configMap:
        name: openagent-omo-agents
    - name: omo-bootstrap
      configMap:
        name: openagent-omo-bootstrap
    - name: k8s-gitops-context
      configMap:
        name: openagent-k8s-gitops-context
    - name: skill-us-tax-filing-automation
      configMap:
        name: openagent-skill-us-tax-filing-automation
    - name: skill-plane-ticket-sync
      configMap:
        name: openagent-skill-plane-ticket-sync
    - name: hermes-mise-config
      configMap:
        name: openagent-hermes-mise-config
    - name: dashboard-auth
      configMap:
        name: openagent-dashboard-auth
  extraVolumeMounts:
    - name: hermes-hooks
      mountPath: /opt/data/hooks/discord-session-link
      readOnly: true
    - name: omo-agents
      mountPath: /opt/omo/omo-agents.yaml
      subPath: omo-agents.yaml
      readOnly: true
    - name: omo-bootstrap
      mountPath: /opt/omo/bootstrap.py
      subPath: bootstrap.py
      readOnly: true
    - name: k8s-gitops-context
      mountPath: /opt/data/memories/k8s-gitops-context.md
      subPath: k8s-gitops-context.md
      readOnly: true
    - name: skill-us-tax-filing-automation
      mountPath: /opt/data/skills/us-tax-filing-automation/SKILL.md
      subPath: us-tax-filing-automation.SKILL.md
      readOnly: true
    - name: skill-plane-ticket-sync
      mountPath: /opt/data/skills/plane-ticket-sync/SKILL.md
      subPath: plane-ticket-sync.SKILL.md
      readOnly: true
    - name: skill-plane-ticket-sync
      mountPath: /opt/data/skills/plane-ticket-sync/scripts/plan_to_tickets.py
      subPath: plan_to_tickets.py
      readOnly: true
    - name: hermes-mise-config
      mountPath: /mise
      readOnly: true
    - name: dashboard-auth
      mountPath: /opt/hermes/.venv/lib/python3.13/site-packages/dashboard-auth.pth
      subPath: dashboard-auth.pth
      readOnly: true
    - name: dashboard-auth
      mountPath: /opt/hermes/.venv/lib/python3.13/site-packages/dashboard_auth_patch.py
      subPath: dashboard_auth_patch.py
      readOnly: true
  command:
    - sh
    - -c
    - |
      # Pin HOME+caches to the PVC so boot installs survive restarts and MCPs
      # (uid 10000, HOME=/opt/data/home) reuse them instead of re-downloading.
      export HOME=/opt/data/home
      export NPM_CONFIG_CACHE=$HOME/.npm
      export UV_CACHE_DIR=$HOME/.cache/uv
      export UV_TOOL_DIR=$HOME/.local/share/uv/tools
      export UV_TOOL_BIN_DIR=$HOME/.local/bin
      # Toolchain via mise (/mise/mise.toml) — node/deno/uv/go on the PVC.
      export MISE_DATA_DIR=/opt/data/mise
      export MISE_CACHE_DIR=/opt/data/mise-cache
      export MISE_CONFIG_FILE=/mise/mise.toml
      if [ ! -x /opt/data/bin/mise ]; then
        curl -fsSL https://mise.run | MISE_INSTALL_PATH=/opt/data/bin/mise sh
      fi
      export PATH=/opt/data/mise/shims:/opt/data/bin:$HOME/.local/bin:$PATH
      mise install -y 2>&1 || true
      # /init resets PATH — symlinks into /opt/data/bin (first on PATH) are
      # what reach MCPs.
      # Link EVERY mise shim into /opt/data/bin (first on PATH). Prefer mise
      # for tool setup — only direct-download tools that mise doesn't ship
      # (obscura, doppler, bitwarden, terraform, argocd, etc.) below. Covers
      # node/npm/npx/deno/uv/uvx/go/kubectl + the lint chain (pre-commit,
      # gitleaks, yamllint, actionlint, kubeconform, helm-docs, gofmt).
      for sh in /opt/data/mise/shims/*; do
        [ -x "$sh" ] && ln -sf "$sh" /opt/data/bin/"$(basename "$sh")"
      done
      # bitwarden CLI — npm global → PVC
      if [ ! -x /opt/data/npm-global/bin/bw ]; then
        npm install -g --prefix /opt/data/npm-global @bitwarden/cli 2>&1
      fi
      ln -sf /opt/data/npm-global/bin/bw /opt/data/bin/bw
      cd /opt/data && go mod download
      # obscura (stealth browser) — PVC so it survives restarts
      if [ ! -x /opt/data/bin/obscura ]; then
        curl -sL https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.0/obscura-aarch64-linux-stealth.tar.gz | tar -xz -C /opt/data/bin
      fi
      # Agent Reach deps (uv tool bins → PVC via UV_TOOL_BIN_DIR)
      command -v agent-reach >/dev/null 2>&1 || uv tool install https://github.com/Panniantong/agent-reach/archive/main.zip 2>&1
      command -v yt-dlp >/dev/null 2>&1 || uv tool install yt-dlp 2>&1
      command -v gallery-dl >/dev/null 2>&1 || uv tool install gallery-dl 2>&1
      mkdir -p $HOME/.config/yt-dlp && { grep -qxF -- '--js-runtimes node' $HOME/.config/yt-dlp/config 2>/dev/null || printf '%s\n' '--js-runtimes node' >> $HOME/.config/yt-dlp/config; }
      # OCR-first vision — mise task (see /mise/mise.toml [tasks.paddle-ocr]):
      # self-bootstraps the py3.12 venv on first use (persists on PVC); PP-OCR
      # models via rapidocr-onnxruntime (native paddlepaddle crashes on aarch64).
      cat > /opt/data/bin/paddle-ocr <<'PADDLEOCR'
      #!/bin/bash
      exec mise run paddle-ocr -- "$@"
      PADDLEOCR
      chmod +x /opt/data/bin/paddle-ocr
      # deno fallback: release zip + python zipfile (install.sh needs unzip/7z,
      # absent); v2.9.5 pinned for drawio's deno.lock v5.
      if [ ! -x /opt/data/bin/deno ] && [ ! -x $HOME/.deno/bin/deno ]; then
        mkdir -p $HOME/.deno/bin /tmp/deno_x
        DENO_ARCH=$(uname -m | sed 's/aarch64/arm64/')
        curl -fsSL --retry 3 "https://github.com/denoland/deno/releases/download/v2.9.5/deno-${DENO_ARCH}-unknown-linux-gnu.zip" -o /tmp/deno.zip \
          && python3 -c "import zipfile; zipfile.ZipFile('/tmp/deno.zip').extractall('/tmp/deno_x')" \
          && mv /tmp/deno_x/deno $HOME/.deno/bin/deno \
          && chmod +x $HOME/.deno/bin/deno \
          || rm -f /tmp/deno.zip
      fi
      [ -x $HOME/.deno/bin/deno ] && ln -sf $HOME/.deno/bin/deno /opt/data/bin/deno
      # drawio MCP needs a local checkout (remote-URL run never discovers deno.json).
      if [ ! -d /opt/data/drawio-mcp-server/.git ]; then
        git clone --depth 1 https://github.com/simonkurtz-MSFT/drawio-mcp-server /opt/data/drawio-mcp-server 2>&1 || true
      fi
      # Doppler CLI → PVC. gpgv verify skipped (no gnupg as uid 10000).
      if [ ! -x /opt/data/bin/doppler ]; then
        mkdir -p /opt/data/bin
        DOP_ARCH=$(uname -m | sed 's/aarch64/arm64/; s/x86_64/amd64/')
        curl -fsSL --retry 3 "https://cli.doppler.com/download?os=linux&arch=${DOP_ARCH}&format=tar" -o /tmp/doppler.tgz \
          && tar -xzf /tmp/doppler.tgz -C /opt/data/bin doppler \
          && chmod +x /opt/data/bin/doppler \
          || rm -f /tmp/doppler.tgz
      fi
      # Boot ran as root — chown caches/tools to runtime uid 10000 (npx/uvx/
      # mise shims EACCES otherwise).
      chown -R 10000:10000 $HOME/.npm $HOME/.cache $HOME/.deno $HOME/.local $HOME/.config /opt/data/mise /opt/data/mise-cache /opt/data/npm-global 2>/dev/null || true
      # OMO fleet bootstrap — reconcile /opt/data/profiles against the
      # omo-agents ConfigMap (idempotent; failure non-fatal via ||; failure
      # must never block the gateway). Sisyphus skipped: IS this pod's
      # default profile. Runs as root → chown created profiles to uid 10000
      # after, else the gateway can't write sessions/logs.
      /opt/hermes/.venv/bin/python /opt/omo/bootstrap.py || true
      chown -R 10000:10000 /opt/data/profiles 2>/dev/null || true
      exec /init hermes gateway run
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      # 3Gi — 2Gi OOM-killed the container (exit 137) during cold-cache MCP
      # spawn storm + concurrent ArgoCD sync (2026-08-23). Caches now on PVC
      # (see command block), but keep headroom for npx/uvx server boots.
      memory: 3Gi
  extraEnvFrom:
    - secretRef:
        name: openagent-secrets
  service:
    enabled: true
    port: 9119

