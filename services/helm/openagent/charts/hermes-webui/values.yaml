# hermes-webui chart values.
# These are accessed from the parent umbrella chart as hermes-webui.*
#
# hermes-webui runs natively in "gateway" mode (HERMES_WEBUI_CHAT_BACKEND=gateway):
# it is a PURE HTTP thin-client that POSTs /v1/chat/completions to the existing
# Hermes Agent's OpenAI-compatible API server (:8642). It does NOT run a second
# in-process agent. All inference/memory/tools/sessions stay on the jyje agent.
enabled: true
image:
  repository: ghcr.io/nesquena/hermes-webui
  # NOTE: use the multi-arch `latest` tag, not a versioned v0.52.x tag. The
  # versioned tags are single-manifest (amd64-only) and will not run on this
  # arm64 k3d cluster (ImagePullBackOff / no matching arch). `latest` is a
  # multi-arch index incl. linux/arm64 (verified on the registry).
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

# The webui keeps its OWN session/workspace/settings state here.
# MUST be a separate PVC — never the agent's /opt/data (RWO + concurrent SQLite
# WAL writes would corrupt the agent's persona/session store).
persistence:
  enabled: true
  size: 2Gi
  storageClass: "local-path"

# Agent session bridge: mount the hermes-agent home READ-ONLY so the gateway
# watcher (api/gateway_watcher.py) can list agent sessions (discord/cli/cron/
# api_server) in the sidebar and /chat/{sid} deep links resolve. HERMES_HOME is
# pointed at this mount so state.db is found at <mountPath>/state.db. The agent
# keeps state.db in WAL mode with -shm/-wal present while running, so the
# read-only SQLite URI (mode=ro) works; never mount this read-write (two
# writers on the same WAL db = corruption).
agentState:
  enabled: true
  claimName: openagent-hermes-agent
  mountPath: /data/agent

service:
  # Drop-in: reuse the exact dashboard Service name + port the ingress already
  # points at, so the ApplicationSet (gateway destination openagent-hermes-workspace:3000)
  # and all DNS stay unchanged. The webui container listens on this port (HERMES_WEBUI_PORT).
  name: "openagent-hermes-workspace"
  port: 3000

# Hermes Agent gateway backend (thin-client target).
hermes:
  # OpenAI-compatible API server on the existing jyje agent.
  apiUrl: "http://openagent-hermes-api.openagent.svc.cluster.local:8642"
  # API bearer key. Must match the agent's API_SERVER_KEY (server-side only —
  # never surfaced to browser JS).
  apiKey: "***REMOVED***"

# Public origin the dashboard is served at (needed for CSRF/origin checks
# behind the reverse proxy + Istio).
publicUrl: "https://openagent.maklab.net"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
