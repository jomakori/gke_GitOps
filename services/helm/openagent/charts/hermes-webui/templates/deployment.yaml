{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes-webui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes-webui
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hermes-webui.labels" . | nindent 6 }}
      app.kubernetes.io/component: hermes-webui
  template:
    metadata:
      labels:
        {{- include "hermes-webui.labels" . | nindent 8 }}
        app.kubernetes.io/component: hermes-webui
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Copy the agent's pure-python packages (skills/cron views need them:
        # agent.skill_utils, tools.skills_tool, cron.jobs, cron.scheduler,
        # hermes_cli.config, utils, gateway.session_context). The webui runs
        # gateway mode with no agent source; HERMES_WEBUI_AGENT_DIR=/src makes
        # config.py put it on sys.path. Third-party deps come from the webui
        # venv — no agent deps installed.
        {{- if .Values.agentSource.enabled }}
        - name: agent-source
          image: "{{ .Values.agentSource.image }}"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /src
              for p in agent tools cron hermes_cli gateway acp_adapter utils.py hermes_constants.py; do
                cp -a "{{ .Values.agentSource.sourcePath }}/$p" /src/
              done
          volumeMounts:
            - name: agent-src
              mountPath: /src
        {{- end }}
        # Gateway mode runs NO in-process agent, so the first-run onboarding
        # wizard's system check (probes /root/.hermes/config.yaml + agent imports
        # inside THIS container) is a guaranteed false negative. Merge wizard +
        # sidebar defaults into settings.json on every boot (setdefault — never
        # clobbers user-tuned values), so onboarding never renders and agent
        # sessions (discord/cli/cron) show in the sidebar.
        - name: seed-onboarding
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ ! -f /data/settings.json ]; then
                mkdir -p /data
                echo '{}' > /data/settings.json
              fi
              python3 - <<'PY'
              import json
              p = '/data/settings.json'
              d = json.load(open(p))
              d.setdefault('onboarding_completed', True)
              d.setdefault('default_workspace', '/data/workspace')
              d.setdefault('show_cli_sessions', True)
              json.dump(d, open(p, 'w'), indent=2)
              PY
          volumeMounts:
            - name: hermes-webui-state
              mountPath: /data
        - name: install-webui-deps
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # The stock hermes-webui image ships code in /apptoo with NO
              # pre-built venv. The default entrypoint (docker_init.bash) would
              # unconditionally attempt to install the Hermes agent source deps,
              # so we bypass it entirely. Here we build a venv with just the
              # webui's own requirements, then the main container runs
              # `python /apptoo/server.py` in gateway mode (a pure HTTP client).
              if [ ! -f /app/venv/.deps_installed ]; then
                mkdir -p /app
                python3 -m venv /app/venv
                /app/venv/bin/pip install --no-cache-dir -q -r /apptoo/requirements.txt
                touch /app/venv/.deps_installed
              fi
          volumeMounts:
            - name: runtime
              mountPath: /app
      containers:
        - name: hermes-webui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/venv/bin/python
            - /apptoo/server.py
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: HERMES_WEBUI_HOST
              value: "0.0.0.0"
            - name: HERMES_WEBUI_PORT
              value: {{ .Values.service.port | toString | quote }}
            - name: HERMES_WEBUI_CHAT_BACKEND
              value: "gateway"
            # Hard-skip first-run onboarding: guard in api/onboarding.py makes the
            # apply endpoint a no-op (never writes config.yaml), and the
            # seed-onboarding initContainer pre-writes settings.json so
            # /api/settings reports onboarding_completed=true from first boot.
            - name: HERMES_WEBUI_SKIP_ONBOARDING
              value: "1"
            - name: HERMES_WEBUI_GATEWAY_BASE_URL
              value: {{ .Values.hermes.apiUrl | quote }}
            - name: HERMES_WEBUI_GATEWAY_API_KEY
              value: {{ .Values.hermes.apiKey | quote }}
            - name: HERMES_WEBUI_STATE_DIR
              value: /data
            # Point Hermes at the mounted agent home so the gateway watcher +
            # session discoverability resolve <mountPath>/state.db — the agent's
            # real session store (discord/cli/cron/api_server sessions appear in
            # the sidebar when show_cli_sessions is on).
            - name: HERMES_HOME
              value: {{ .Values.agentState.mountPath | quote }}
            {{- if .Values.agentSource.enabled }}
            # Agent source for skills/cron views (see agent-source initContainer).
            # _discover_python: pin the webui venv python explicitly.
            - name: HERMES_WEBUI_AGENT_DIR
              value: /src
            - name: HERMES_WEBUI_PYTHON
              value: /app/venv/bin/python
            {{- end }}
            - name: HERMES_WEBUI_DEFAULT_WORKSPACE
              value: /data/workspace
            - name: HERMES_WEBUI_SECURE
              value: "1"
            - name: HERMES_WEBUI_ALLOWED_ORIGINS
              value: {{ .Values.publicUrl | quote }}
            - name: HERMES_WEBUI_TRUST_FORWARDED_HOST
              value: "1"
            - name: HERMES_WEBUI_TRUST_FORWARDED_PROTO
              value: "1"
            - name: HERMES_WEBUI_TRUST_FORWARDED_FOR
              value: "1"
            - name: HERMES_WEBUI_SSE_CHUNKED
              value: "1"
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: runtime
              mountPath: /app
            - name: hermes-webui-state
              mountPath: /data
            {{- if .Values.agentState.enabled }}
            - name: agent-state
              mountPath: {{ .Values.agentState.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.agentSource.enabled }}
            - name: agent-src
              mountPath: /src
              readOnly: true
            {{- end }}
      volumes:
        - name: runtime
          emptyDir: {}
        {{- if .Values.agentSource.enabled }}
        - name: agent-src
          emptyDir: {}
        {{- end }}
        - name: hermes-webui-state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hermes-webui.fullname" . }}-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.agentState.enabled }}
        - name: agent-state
          persistentVolumeClaim:
            claimName: {{ .Values.agentState.claimName }}
            readOnly: true
        {{- end }}
{{- end }}
