{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default (include "hermes-webui.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes-webui
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    {{- include "hermes-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes-webui
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- end }}
