{{- if and .Values.enabled .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hermes-webui.fullname" . }}-state
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-webui.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes-webui
  annotations:
    # Same sync-wave as the consuming Deployment. local-path uses
    # WaitForFirstConsumer, so the PVC only binds once a pod schedules against
    # it. If the PVC is in an earlier wave, ArgoCD waits for it to become
    # Healthy (Pending forever) and never creates the Deployment -> deadlock.
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
