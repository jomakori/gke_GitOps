apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes-workspace.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes-workspace.labels" . | nindent 4 }}
    app.kubernetes.io/component: hermes-workspace
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "hermes-workspace.labels" . | nindent 6 }}
      app.kubernetes.io/component: hermes-workspace
  template:
    metadata:
      labels:
        {{- include "hermes-workspace.labels" . | nindent 8 }}
        app.kubernetes.io/component: hermes-workspace
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      volumes:
        - name: swarm-config
          configMap:
            name: openagent-swarm
            items:
              - key: swarm.yaml
                path: swarm.yaml
        - name: runtime-data
          emptyDir: {}
        - name: hermes-home
          emptyDir: {}
        - name: shared-bin
          emptyDir: {}
        - name: hermes-config
          configMap:
            name: openagent-swarm-hermes-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: local-bin
          emptyDir: {}
        - name: k8s-gitops-context
          configMap:
            name: openagent-k8s-gitops-context
      initContainers:
        - name: install-hermes-tmux
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e

              apt-get update && apt-get install -y tmux python3-venv git curl unzip

              cp $(which git) /shared/bin/git
              cp $(which curl) /shared/bin/curl
              cp $(which unzip) /shared/bin/unzip

              curl -fsSL "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-arm64" -o /shared/bin/jq && chmod 755 /shared/bin/jq

              # Python venv + packages
              python3 -m venv /shared/bin/venv && \
              /shared/bin/venv/bin/pip install hermes-agent pre-commit

              # Copy tmux + libs
              cp /usr/bin/tmux /shared/bin/tmux && \
              ldd /usr/bin/tmux | grep -o '/[^ ]*' | while read lib; do cp "$lib" /shared/bin/ 2>/dev/null; done

              # Terraform
              TF_VER="1.9.8"
              curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VER}/terraform_${TF_VER}_linux_arm64.zip" -o /tmp/tf.zip && \
              unzip -o /tmp/tf.zip -d /shared/bin && rm /tmp/tf.zip && \
              chmod 755 /shared/bin/terraform

              # Helm
              curl -fsSL "https://get.helm.sh/helm-v3.16.3-linux-arm64.tar.gz" | tar xz -C /tmp && \
              mv /tmp/linux-arm64/helm /shared/bin/helm && rm -rf /tmp/linux-arm64 && \
              chmod 755 /shared/bin/helm

              # kubectl
              curl -fsSL "https://dl.k8s.io/release/v1.31.4/bin/linux/arm64/kubectl" -o /shared/bin/kubectl && \
              chmod 755 /shared/bin/kubectl

              # gitleaks (filename has no v prefix)
              curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz" | tar xz -C /shared/bin gitleaks && \
              chmod 755 /shared/bin/gitleaks

              # Doppler CLI (auto-detects arch)
              curl -fsSL https://cli.doppler.com/install.sh | sh && \
              cp $(which doppler) /shared/bin/doppler

              # Symlinks in ~/.local/bin/ for workspace binary resolution
              HERMES_BIN=/shared/bin/venv/bin/hermes
              chmod 755 "$HERMES_BIN"
              ln -sf "$HERMES_BIN" /shared/.local/bin/hermes
              ln -sf /shared/bin/tmux /shared/.local/bin/tmux
              ln -sf /shared/bin/terraform /shared/.local/bin/terraform
              ln -sf /shared/bin/helm /shared/.local/bin/helm
              ln -sf /shared/bin/kubectl /shared/.local/bin/kubectl
              ln -sf /shared/bin/gitleaks /shared/.local/bin/gitleaks
              ln -sf /shared/bin/doppler /shared/.local/bin/doppler
              ln -sf /shared/bin/venv/bin/pre-commit /shared/.local/bin/pre-commit

              # Central model mapping
              echo 'orchestrator=claude/sonnet-4' > /shared/bin/worker-models.cfg
              for entry in \
                'supervisor=claude/sonnet-4' \
                'strategist=deepseek-v4-pro' \
                'reviewer=deepseek-v4-pro' \
                'architect=claude/opus-4' \
                'builder=minimax/M3' \
                'junior-builder=deepseek-v4-flash' \
                'researcher=zai/glm-4.7-flash' \
                'explorer=zai/glm-4.7-flash'; do
                echo "$entry" >> /shared/bin/worker-models.cfg
              done

              # Swarm wrapper
              echo '#!/bin/sh' > /shared/bin/swarm-wrapper.sh
              echo 'worker=$(basename "$0")' >> /shared/bin/swarm-wrapper.sh
              echo 'model=$(grep "^${worker}=" /shared/bin/worker-models.cfg | cut -d= -f2)' >> /shared/bin/swarm-wrapper.sh
              echo 'if [ -n "$model" ]; then exec /shared/bin/venv/bin/hermes -m "$model" "$@"; else exec /shared/bin/venv/bin/hermes "$@"; fi' >> /shared/bin/swarm-wrapper.sh
              chmod 755 /shared/bin/swarm-wrapper.sh

              for worker in orchestrator supervisor strategist reviewer architect builder junior-builder researcher explorer; do
                ln -sf /shared/bin/swarm-wrapper.sh /shared/.local/bin/$worker
              done
          volumeMounts:
            - name: shared-bin
              mountPath: /shared/bin
            - name: local-bin
              mountPath: /shared/.local/bin
      containers:
        - name: hermes-workspace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: PATH
              value: "/shared/bin/venv/bin:/shared/bin:/home/workspace/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin"
            - name: LD_LIBRARY_PATH
              value: "/shared/bin"
            - name: HERMES_CLI_BIN
              value: /shared/bin/venv/bin/hermes
            - name: TMUX_BIN
              value: /shared/bin/tmux
            - name: HOST
              value: "0.0.0.0"
            - name: HERMES_ALLOW_INSECURE_REMOTE
              value: "1"
            - name: COOKIE_SECURE
              value: "0"
            - name: HERMES_API_URL
              value: {{ .Values.hermes.apiUrl | quote }}
            - name: HERMES_DASHBOARD_URL
              value: {{ .Values.hermes.dashboardUrl | quote }}
            - name: OPENAI_API_KEY
              value: {{ .Values.hermes.apiKey | quote }}
            - name: HERMES_API_KEY
              value: {{ .Values.hermes.apiKey | quote }}
            - name: AGENT_API_KEY
              value: {{ .Values.hermes.apiKey | quote }}
          envFrom:
            - secretRef:
                name: openagent-secrets
          volumeMounts:
            - name: swarm-config
              mountPath: /app/swarm.yaml
              subPath: swarm.yaml
              readOnly: true
            - name: runtime-data
              mountPath: /app/.runtime
            - name: hermes-home
              mountPath: /home/workspace/.hermes
            - name: hermes-config
              mountPath: /home/workspace/.hermes/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: shared-bin
              mountPath: /shared/bin
              readOnly: true
            - name: local-bin
              mountPath: /home/workspace/.local/bin
              readOnly: true
            - name: k8s-gitops-context
              mountPath: /workspace/reference/k8s-gitops-context.md
              subPath: k8s-gitops-context.md
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
