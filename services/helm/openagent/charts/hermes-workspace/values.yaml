# hermes-workspace values
# These are accessed from the parent chart as hermes-workspace.*
dopplerConfig: "svc_openagent"
storageClass: "local-path"

image:
  repository: ghcr.io/outsourc-e/hermes-workspace
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  port: 3000
  # The workspace deployment is kept as the swarm controller (tmux workers) but
  # its Service is disabled because hermes-webui reuses the drop-in Service name
  # openagent-hermes-workspace for the public dashboard. Swarm workers are
  # in-pod (tmux panes) — no Service needed for them.
  enabled: true

hermes:
  apiUrl: "http://openagent-hermes-api.openagent.svc.cluster.local:8642"
  dashboardUrl: "http://openagent-hermes.openagent.svc.cluster.local:9119"
  apiKey: "hermes-api-server-key-1234"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
