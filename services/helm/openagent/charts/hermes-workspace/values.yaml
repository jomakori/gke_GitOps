# hermes-workspace values
# These are accessed from the parent chart as hermes-workspace.*
dopplerConfig: "svc_openagent"
storageClass: "local-path"

image:
  repository: ghcr.io/outsourc-e/hermes-workspace
  tag: "latest"
  # Always re-pull: `latest` floats and IfNotPresent kept a stale v2.3.0-era
  # bundle pinned. Current main (2026-08-22+) carries the gateway API fallback
  # for sessions/messages and the resilient dashboard-token fetch (#686).
  pullPolicy: Always

service:
  port: 3000

hermes:
  apiUrl: "http://openagent-hermes-api.openagent.svc.cluster.local:8642"
  # Point the dashboard URL at the gateway API, not the 9119 dashboard.
  # The agent dashboard (9119) is BasicAuth-gated on non-loopback binds
  # (June 2026 hardening) and the workspace bundle has no password-login flow,
  # so the dashboard proxy gets 401 no_cookie. The gateway API (8642) accepts
  # HERMES_API_TOKEN as Bearer and serves the session APIs; pointing here
  # makes the dashboard probe fail and session list/detail/messages fall back
  # to the token-authed API path.
  dashboardUrl: "http://openagent-hermes-api.openagent.svc.cluster.local:8642"
  apiKey: "***REMOVED***"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
