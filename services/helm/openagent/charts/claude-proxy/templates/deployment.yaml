{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "claude-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: claude-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "claude-proxy.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: claude-proxy
  template:
    metadata:
      labels:
        {{- include "claude-proxy.labels" . | nindent 8 }}
        app.kubernetes.io/component: claude-proxy
    spec:
      # No imagePullSecrets on purpose. ghcr.io/jomakori/ocp is a PUBLIC package
      # (anonymous token request → 200), so the image needs no credentials. The
      # `ghcr-pull-secret` this chart used to reference holds a credential that
      # GHCR now rejects (403, verified against the package token endpoint), and
      # containerd does NOT fall back to anonymous when it is handed a bad one —
      # the pod sat in ImagePullBackOff with "failed to authorize ... 403
      # Forbidden" while the registry served the same image to anonymous pulls.
      # If this image ever becomes private, add a pull secret that is actually
      # valid (and verify it with a token request before trusting it).
      initContainers:
        - name: seed-credentials
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              # File-based credentials are the FALLBACK path: with
              # CLAUDE_CODE_OAUTH_TOKEN set, OCP authenticates the `claude -p` spawn
              # from the env token and never reads this file.
              #
              # Seed from the bootstrap secret ONLY on first boot (empty PVC). There
              # is deliberately no refresh logic here — Claude Code rotates its OAuth
              # refresh token (single-use) and writes the rotated pair back to
              # ~/.claude itself, so a refreshing init container would fight the CLI
              # and the k8s secret would go stale after the first rotation.
              if [ ! -f /writable/.credentials.json ]; then
                cp /secrets/.credentials.json /writable/.credentials.json
                echo "Seeded credentials from secret"
              else
                echo "Credentials already present, skipping seed"
              fi
          volumeMounts:
            - name: claude-credentials-secret
              mountPath: /secrets
              readOnly: true
            - name: claude-credentials-writable
              mountPath: /writable
      containers:
        - name: claude-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # OCP binds loopback by default; the Service needs it on all interfaces.
            - name: CLAUDE_BIND
              value: "0.0.0.0"
            - name: CLAUDE_PROXY_PORT
              value: {{ .Values.service.port | quote }}
            - name: CLAUDE_BIN
              value: /usr/local/bin/claude
            # Caller-side tool calling over OCP's MCP bridge (upstream ADR 0022).
            # 0 restores the drop-tools behaviour agents cannot use.
            - name: OCP_TOOL_CALLING
              value: {{ .Values.ocp.toolCalling | quote }}
            # The caller supplies its own system prompt; do not inject CLAUDE.md or
            # the CLI's auto-memory into every request.
            - name: CLAUDE_NO_CONTEXT
              value: {{ .Values.ocp.noContext | quote }}
            # Host gate (upstream ADR 0020): a request whose Host is a public DNS
            # name is refused unless declared here. Only the in-cluster Service
            # names are declared — nothing routes to this proxy from outside.
            - name: OCP_ALLOWED_HOSTS
              value: {{ .Values.ocp.allowedHosts | default (printf "claude-proxy,claude-proxy.%s.svc.cluster.local" .Release.Namespace) | quote }}
            # Long-lived subscription token (from `claude setup-token`), synced from
            # Doppler `svc_openagent`. Optional: without it OCP falls back to the
            # credentials file on the PVC.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.tokenSecretName }}
                  key: {{ .Values.credentials.tokenSecretKey }}
                  optional: true
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          volumeMounts:
            # HOME in the image is /home/ocp, so this is ~/.claude.
            - name: claude-credentials-writable
              mountPath: /home/ocp/.claude
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 2
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
      volumes:
        - name: claude-credentials-secret
          secret:
            secretName: claude-credentials
        - name: claude-credentials-writable
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: claude-credentials
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
