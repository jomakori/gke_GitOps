{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "claude-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: claude-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "claude-proxy.labels" . | nindent 6 }}
      app.kubernetes.io/component: claude-proxy
  template:
    metadata:
      labels:
        {{- include "claude-proxy.labels" . | nindent 8 }}
        app.kubernetes.io/component: claude-proxy
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: refresh-token
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              cp /secrets/.credentials.json /writable/.credentials.json && \
              python3 -c "
              import json, time, urllib.request, os

              CREDS_FILE = '/writable/.credentials.json'
              TOKEN_URL = 'https://platform.claude.com/v1/oauth/token'
              CLIENT_ID = '9d1c250a-e61b-44d9-88ed-5944d1962f5e'

              if not os.path.exists(CREDS_FILE):
                  print('No credentials file, skipping refresh')
                  exit(0)

              with open(CREDS_FILE) as f:
                  creds = json.load(f)
              oauth = creds.get('claudeAiOauth', {})
              refresh_token = oauth.get('refreshToken', '')
              expires_at = oauth.get('expiresAt', 0)
              now_ms = int(time.time() * 1000)

              if not refresh_token:
                  print('No refresh token, skipping')
                  exit(0)

              ttl_h = (expires_at - now_ms) / 1000 / 3600
              print(f'Token TTL: {ttl_h:.1f}h')

              if ttl_h > 1:
                  print('Token fresh, skipping refresh')
                  exit(0)

              print('Refreshing OAuth token...')
              body = json.dumps({
                  'grant_type': 'refresh_token',
                  'refresh_token': refresh_token,
                  'client_id': CLIENT_ID,
              }).encode()

              req = urllib.request.Request(TOKEN_URL, data=body, method='POST')
              req.add_header('Content-Type', 'application/json')
              req.add_header('Accept', 'application/json')
              req.add_header('User-Agent', 'claude-cli/2.1.207 (external, cli)')

              try:
                  resp = urllib.request.urlopen(req, timeout=15)
                  data = json.loads(resp.read())
                  new_access = data.get('access_token', '')
                  new_refresh = data.get('refresh_token', refresh_token)
                  expires_in = data.get('expires_in', 3600)

                  if new_access:
                      new_expires = int(time.time() * 1000) + (expires_in * 1000)
                      oauth['accessToken'] = new_access
                      oauth['refreshToken'] = new_refresh
                      oauth['expiresAt'] = new_expires
                      creds['claudeAiOauth'] = oauth
                      with open(CREDS_FILE, 'w') as f:
                          json.dump(creds, f)
                      print(f'Token refreshed. New TTL: {expires_in/3600:.1f}h')
                  else:
                      print('Refresh response missing access_token')
              except Exception as e:
                  print(f'Refresh failed: {e}')
              " && \
               echo "Token refresh init complete"
               echo "Token refresh complete"
          volumeMounts:
            - name: claude-credentials-secret
              mountPath: /secrets
              readOnly: true
            - name: claude-credentials-writable
              mountPath: /writable
      containers:
        - name: claude-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              sed -i '/^const MODEL_ALIASES/,/^};/c\
              const MODEL_ALIASES: Record<string, string> = {\
                sonnet: \"claude-sonnet-5\",\
                opus: \"claude-opus-4-6\",\
                haiku: \"claude-haiku-4-5\",\
                \"sonnet-5\": \"claude-sonnet-5\",\
                \"claude-sonnet-5\": \"claude-sonnet-5\",\
                \"sonnet-4.6\": \"claude-sonnet-4-6\",\
                \"claude-sonnet-4\": \"claude-sonnet-4-6\",\
                \"opus-4.6\": \"claude-opus-4-6\",\
                \"claude-opus-4\": \"claude-opus-4-6\",\
                \"claude-haiku-4\": \"claude-haiku-4-5\",\
                \"gpt-4\": \"claude-sonnet-5\",\
                \"gpt-4o\": \"claude-sonnet-5\",\
              };' /root/.bun/install/global/node_modules/claude-pipe/src/claude.ts && \
              cat > /root/.bun/install/global/node_modules/claude-pipe/src/responses.ts << 'RESPEOF'
import { spawnClaude } from "./claude";
import { serializeOpenAIMessages } from "./serialize";

export async function handleOpenAIResponses(req: Request): Promise<Response> {
  let body: any = await req.json();
  let messages: Array<{role: string; content: string}> = [];
  if (typeof body.input === "string") messages = [{ role: "user", content: body.input }];
  else if (Array.isArray(body.input)) messages = body.input.map((m: any) => ({role: m.role, content: typeof m.content === "string" ? m.content : JSON.stringify(m.content)}));
  const { prompt, system } = serializeOpenAIMessages(messages);
  const finalSystem = body.instructions || system || undefined;
  const model = body.model || "claude-sonnet-5";
  const id = "resp_" + crypto.randomUUID().slice(0, 24);

  if (body.stream) {
    const encoder = new TextEncoder();
    let fullText = "";
    let sentCreated = false;
    const stream = new ReadableStream({
      async start(controller) {
        const send = (data: object) => controller.enqueue(encoder.encode("data: " + JSON.stringify(data) + "\n\n"));
        for await (const event of spawnClaude({ prompt, model, system: finalSystem })) {
          if (event.type !== "stream_event" || !("event" in event)) continue;
          const sse = (event as any).event as {type:string; delta?:{type:string; text?:string}};
          if (sse.type === "content_block_delta" && sse.delta?.type === "text_delta" && sse.delta.text) {
            if (!sentCreated) { send({type:"response.created",response:{id,object:"response",model,output:[{id:id+"_msg",type:"message",role:"assistant",content:[]}]}}); sentCreated=true; }
            fullText += sse.delta.text;
            send({type:"response.output_text.delta",item_id:id+"_msg",output_index:0,content_index:0,delta:sse.delta.text});
          }
        }
        send({type:"response.completed",response:{id,object:"response",model,output:[{id:id+"_msg",type:"message",role:"assistant",content:[{type:"output_text",text:fullText}]}]}});
        controller.close();
      }
    });
    return new Response(stream, {headers:{"Content-Type":"text/event-stream","Cache-Control":"no-cache"}});
  } else {
    let fullText = "";
    for await (const event of spawnClaude({ prompt, model, system: finalSystem })) {
      if (event.type !== "stream_event" || !("event" in event)) continue;
      const sse = (event as any).event as {type:string; delta?:{type:string; text?:string}};
      if (sse.type === "content_block_delta" && sse.delta?.type === "text_delta" && sse.delta.text) fullText += sse.delta.text;
    }
    return Response.json({id,object:"response",model,output:[{id:id+"_msg",type:"message",role:"assistant",content:[{type:"output_text",text:fullText}]}],usage:{input_tokens:0,output_tokens:0}});
  }
}
RESPEOF
              sed -i '/if (url.pathname === "\/v1\/chat\/completions"/a\
    if (url.pathname === "\/v1\/responses" \&\& req.method === "POST") { return handleOpenAIResponses(req); }' /root/.bun/install/global/node_modules/claude-pipe/src/index.ts
              sed -i 's/import { handleOpenAICompletions } from "\.\/openai"/import { handleOpenAICompletions } from "\.\/openai"\nimport { handleOpenAIResponses } from "\.\/responses"/' /root/.bun/install/global/node_modules/claude-pipe/src/index.ts
              exec /usr/local/bin/bun /usr/local/bin/claude-pipe
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: CLAUDE_PROXY_API_KEY
              value: "claude-proxy-local"

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: claude-credentials-writable
              mountPath: /root/.claude
      volumes:
        - name: claude-credentials-secret
          secret:
            secretName: claude-credentials
        - name: claude-credentials-writable
          emptyDir: {}
{{- end }}
