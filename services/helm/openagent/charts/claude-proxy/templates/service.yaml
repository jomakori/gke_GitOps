{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: claude-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "claude-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: claude-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    {{- include "claude-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: claude-proxy
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
    - port: 4524
      targetPort: responses
      name: responses
{{- end }}
