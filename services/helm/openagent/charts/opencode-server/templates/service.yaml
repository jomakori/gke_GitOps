{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-server.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opencode-server.labels" . | nindent 4 }}
    app.kubernetes.io/component: opencode-server
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  selector:
    # Must match the Deployment's stable selector subset (see deployment.yaml).
    app.kubernetes.io/name: {{ include "opencode-server.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: opencode-server
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
{{- end }}
