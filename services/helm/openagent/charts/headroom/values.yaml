# Headroom prompt-compression sidecar — called by the LiteLLM `pre_call` guardrail
# (services/helm/openagent/values.yaml litellm.proxy_config.guardrails), never by
# clients directly. See README.md and https://docs.litellm.ai/docs/proxy/headroom.
#
# ENABLED BY DEFAULT AT BOTH LAYERS (flipped from opt-in 2026-11-07, user-directed):
#   1. This subchart: Chart.yaml dependency `condition: headroom.enabled`. True (the
#      default) means the umbrella renders this Deployment/Service out of the box.
#   2. The LiteLLM guardrail's `default_on: true`. Every request through the proxy is
#      compressed unless a caller explicitly opts out (per-request `guardrails` /
#      `litellm_metadata.guardrails` field, or `--set headroom.enabled=false` to drop
#      the sidecar entirely).
enabled: true

# Pre-built OFFICIAL image (ghcr.io/headroomlabs-ai/headroom) — unlike claude-proxy/OCP,
# this is NOT a repo-built image; Headroom publishes its own multi-arch container.
# Verified live against GHCR on 2026-11-07:
#   - tag `0.43.1` is a published multi-arch OCI image index (linux/amd64 + linux/arm64 —
#     this cluster's nodes are arm64).
#   - the digest below is the INDEX digest (not a per-platform manifest digest); pulling
#     by digest still resolves the right platform because containerd dereferences an
#     index digest through to its platform manifests.
#   - tag `0.27.0` — the `headroom-ai[proxy]==0.27.0` pin shown in LiteLLM's own "Deploy
#     Headroom" example Dockerfile — does NOT exist as a published GHCR tag for this
#     image (confirmed 404). That snippet is a generic pip-install Dockerfile example in
#     LiteLLM's docs, not an upstream Headroom release; this chart follows Headroom's own
#     published container instead, pinned by digest so `IfNotPresent` can never silently
#     serve stale content under a reused tag (see tests/litellm_image_pin_test.yaml for
#     why that failure mode matters in this repo).
image:
  repository: ghcr.io/headroomlabs-ai/headroom
  tag: "0.43.1@sha256:c4486ccc8096ce44dd825361f1defb67e66710da1b2191f03b283992b8aaf01c"
  pullPolicy: IfNotPresent

service:
  port: 8787

# Every workload in this umbrella declares both request and limit for cpu and memory.
# Headroom runs an in-process ML router (Kompress/Magika) for compression scoring, so it
# is heavier than a pure network sidecar — sized above claude-proxy's idle footprint.
# Sized from a live OOMKill at the previous 1Gi limit: a single worker compressing
# ~300 KB request bodies with the in-process ONNX/Kompress scorer held several
# hundred MB of payload copies plus the model, and was killed (exit 137) every few
# minutes while a handful of sessions were active — each kill surfaced as
# connection-refused on every in-flight LLM call.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 3Gi

# Headroom proxy runtime config — see https://headroomlabs-ai.github.io/headroom/proxy/
proxy:
  # Headroom is loopback-only by default (a non-loopback caller gets 404, not 403 — the
  # route stays invisible to scanners). LiteLLM calls this service from a DIFFERENT pod,
  # so the sidecar pattern this guardrail depends on requires allowing remote callers.
  # The boundary is the NetworkPolicy at the bottom of this file (ingress from the
  # LiteLLM pod only); the shared token in `auth` is an opt-in second layer.
  allowRemote: true
  # Inbound authentication. OFF by default because the credential must exist in
  # Doppler first — this chart cannot create it. Enable both sides together:
  #   1. add HEADROOM_API_KEY to the openagent Doppler config,
  #   2. set proxy.auth.enabled=true.
  # Wiring, verified against both implementations:
  #   - LiteLLM reads the shared secret from its own env as HEADROOM_API_KEY (fallback
  #     in litellm guardrail_hooks/headroom/headroom.py when `api_key` is unset) and
  #     sends the token in an `Authorization` header to POST {api_base}/v1/compress.
  #   - This chart injects the SAME Secret key into the pod as HEADROOM_PROXY_TOKEN,
  #     which makes the proxy require that bearer token. /livez and /readyz stay
  #     unauthenticated by design, so enabling this does not break probes.
  #   - The Secret is `openagent-secrets` (ESO <- Doppler, already envFrom'd into the
  #     LiteLLM pods by the umbrella chart), so one Doppler key serves both sides and
  #     there is no second copy to drift.
  # The token is never a values field: the old plaintext `token:` key was removed.
  auth:
    enabled: false
    existingSecret:
      name: openagent-secrets
      key: HEADROOM_API_KEY
  # Telemetry/beacon — both OFF. HEADROOM_TELEMETRY=off is documented upstream (LiteLLM's
  # "Deploy Headroom" Dockerfile example sets it). HEADROOM_BEACON=off is set here per the
  # approved spec as a defensive belt-and-suspenders control; this exact env var name was
  # NOT found in the Headroom docs surveyed during implementation (docs.headroomlabs.ai,
  # headroomlabs-ai.github.io) as of 2026-11-07 — if a given Headroom release has no such
  # var, it is simply unused. Flag as unverified if a stricter guarantee is required.
  telemetry: "off"
  beacon: "off"

# Ingress restriction for the Headroom Service. ON by default and load-bearing:
# ClusterIP is not isolation — any pod in any namespace can dial a ClusterIP — and
# neither Istio ambient (no ztunnel data plane in this mesh) nor Headroom's own auth
# (off above) protects these calls. Verified live 2026-11-08 that this cluster
# ENFORCES NetworkPolicy (k3s flannel + kube-router policy controller): a probe pod in
# `openagent` was refused (ECONNREFUSED) on a policy-selected target and connected
# normally on two unselected ones. Disabling this without also enabling `proxy.auth`
# makes the chart fail to render (templates/_validate.tpl).
networkPolicy:
  enabled: true
  # The only application caller. `podLabelName`/`instance` are the labels LiteLLM's
  # pods actually carry (verified live on Deployment openagent-litellm: chart
  # litellm-helm 1.92.0 sets app.kubernetes.io/name=litellm plus instance=<release>).
  # `instance` defaults to the release name, which is the same release this chart is a
  # subchart of; override it only if Headroom is ever installed separately.
  litellm:
    podLabelName: litellm
    instance: ""
  # kubelet probes arrive from the node address, which cannot be expressed as a
  # podSelector. This is the k3d node subnet (nodes are 192.168.97.2/.3/.4/.6); it also
  # admits hostNetwork pods on those nodes. Empty list = probes must be exec probes.
  nodeCIDRs:
    - 192.168.97.0/24
