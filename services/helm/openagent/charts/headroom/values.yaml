dopplerConfig: "svc_openagent"
storageClass: "local-path"

headroom:
  enabled: true
  image:
    repository: ghcr.io/chopratejas/headroom
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 8787
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  storage:
    size: 2Gi
    accessMode: ReadWriteOnce
  litellmUrl: "http://openagent-litellm.openagent.svc.cluster.local:4000/v1"
