{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: headroom
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: headroom
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # ClusterIP only — no Ingress/LoadBalancer anywhere in this chart. The
  # LiteLLM pod is the only intended caller (same namespace, Service DNS).
  type: ClusterIP
  selector:
    {{- include "headroom.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: headroom
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
{{- end }}
