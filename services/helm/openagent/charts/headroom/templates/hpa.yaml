{{- if and .Values.enabled .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: headroom
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "headroom.labels" . | nindent 4 }}
    app.kubernetes.io/component: headroom
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: headroom
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # CPU only: the guardrail call is CPU-bound (in-process ONNX/Kompress scoring
    # of each request body) and short-lived, so CPU is what tracks queueing.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
