{{- if .Values.postgres.users }}
apiVersion: stackgres.io/v1
kind: SGScript
metadata:
  name: {{ .Values.postgres.scriptName }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # StackGres 1.18: spec.users removed from SGCluster — roles/DBs are created here.
  # SQL (incl. password) comes from Doppler key <initSqlKey> via the pg-secrets Secret.
  scripts:
    {{- range $u := .Values.postgres.users }}
    - name: init-{{ $u.name }}
      scriptFrom:
        secretKeyRef:
          name: pg-secrets
          key: {{ $u.initSqlKey | quote }}
    {{- end }}
{{- end }}
