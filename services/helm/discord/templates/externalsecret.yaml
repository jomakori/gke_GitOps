apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-vnc
  namespace: discord
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    # Single Doppler config for this app (apps/discord_prd); hardcoded like
    # opendesign's store ref rather than derived from a `dopplerConfig` value.
    name: doppler-discord
  target:
    name: discord-vnc
    creationPolicy: Owner
  data:
    - secretKey: VNC_PW
      remoteRef:
        key: VNC_PW
