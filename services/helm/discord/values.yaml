# Overrides for bjw-s app-template (vendored tarball in charts/). This chart
# owns no Kubernetes manifests: deployment, service, probes and volumes are
# all expressed here.
app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: kasmweb/chromium
            tag: 1.19.0
          env:
            # KasmVNC kiosk target: Discord web app in a Chromium single-app desktop.
            LAUNCH_URL: https://discord.com/app
            # Replaces kasm_startup.sh's default args (--start-maximized) so the
            # browser comes up fullscreen with no tab strip, toolbar or infobars.
            APP_ARGS: >-
              --kiosk --no-first-run --no-default-browser-check --disable-infobars
              --disable-session-crashed-bubble --disable-features=Translate,MediaRouter
              --password-store=basic --autoplay-policy=no-user-gesture-required
            VNC_RESOLUTION: 1280x800
            MAX_FRAME_RATE: "30"
            # Voice needs both audio streams; everything else is dead weight for a
            # single-tab kiosk and just burns CPU next to the encoder.
            KASM_SVC_AUDIO: "1"
            KASM_SVC_AUDIO_INPUT: "1"
            KASM_SVC_GAMEPAD: "0"
            KASM_SVC_PRINTER: "0"
            KASM_SVC_UPLOADS: "0"
            KASM_SVC_SMARTCARD: "0"
            KASM_SVC_RECORDER: "0"
            KASM_SVC_WEBCAM: "0"
            # kasmvncpasswd reads this at container start (vnc_startup.sh) and
            # replaces the image's publicly-documented default password.
            VNC_PW:
              valueFrom:
                secretKeyRef:
                  name: discord-vnc
                  key: VNC_PW
          probes:
            startup:
              enabled: true
              type: TCP
              port: 6901
              spec:
                failureThreshold: 40
                periodSeconds: 5
            readiness:
              enabled: true
              type: TCP
              port: 6901
            liveness:
              enabled: true
              type: TCP
              port: 6901
              spec:
                failureThreshold: 6
                periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
      initContainers:
        # Chromium profile PVC starts root-owned (default provisioner behaviour);
        # kasm-user (uid 1000, gid 0 per the live pod) needs write access before
        # the main container starts, or Chromium falls back to an ephemeral profile.
        chown-profile:
          image:
            repository: busybox
            tag: "1.38"
          command:
            - sh
            - -c
            - chown -R 1000:0 /profile /home/kasm-user/.config
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
      pod:
        securityContext:
          runAsUser: 1000
          runAsGroup: 0
          fsGroup: 0
  service:
    main:
      controller: main
      ports:
        http:
          port: 6901
          protocol: HTTP
  persistence:
    # KasmVNC + Chromium crash on the 64Mi default /dev/shm.
    # Image entrypoint seeds ~/.config; a PVC mountpoint leaves .config root-owned.
    kasm-config:
      type: emptyDir
      globalMounts:
        - path: /home/kasm-user/.config
    shm:
      type: emptyDir
      medium: Memory
      sizeLimit: 512Mi
      globalMounts:
        - path: /dev/shm
    # Chromium profile (143MB after a Discord login) survives restarts here.
    # NOT mounted at /home/kasm-user: the image seeds /home-kasm-default-profile
    # into an empty home at startup, and a volume over home would shadow that.
    chromium-profile:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 2Gi
      storageClass: local-path
      # itemCount is 1 (this is the only persistentVolumeClaim-type item; `shm`
      # is emptyDir and doesn't count), so the default naming rule would not
      # append the identifier suffix. forceRename pins the PVC name explicitly.
      forceRename: discord-chromium-profile
      advancedMounts:
        main:
          main:
            - path: /home/kasm-user/.config/chromium
          chown-profile:
            - path: /profile
