dopplerConfig: "svc_postgres_operator"

# Feature gates — the appset splits this chart across two Applications:
#   renderOperator=true  + renderClusters=false  → operator only (ns postgres-operator)
#   renderOperator=false + renderClusters=true   → clusters only (cluster-scope)
renderOperator: true
renderClusters: true

# Docs: https://stackgres.io/doc/latest/install/helm/parameters
#
# The upstream subchart is declared with `alias: stackgresOperator` in Chart.yaml,
# so its values nest under this camelCase name and `condition:` reads the very same
# key. Before that alias existed the entire block below was silently dead: a
# top-level values key only reaches a subchart when it matches the dependency's
# `name` or `alias`, and neither matched this spelling. Helm accepted it,
# `helm lint` / `helm template` / `kubeconform` all passed, ArgoCD reported Synced,
# and the only observable symptom was the live SGConfig disagreeing with git.
#
# Cost of that dead config, verified against the live SGConfig CR (the only place
# it was observable):
#   authentication.createAdminSecret  wanted false → was effectively true
#   extensions.cache.enabled          wanted true  → was effectively false
#   grafana.autoEmbed                 wanted true  → was effectively false
# `extensions.cache.enabled: true` is also what creates the operator's extensions
# cache StatefulSet and its 1Gi local-path PVC, so this block gates that workload.
#
# Every pod here is BestEffort without these, and the operator was OOMKilled
# (158 restarts) with its webhook fail-closed — which blocks ArgoCD from syncing
# ANY StackGres resource cluster-wide.
# NOTE: the chart renders ONLY the operator Deployment; the restapi/adminui
# Deployments are created at runtime by the operator from the SGConfig CR, so
# their resources are not settable here (tracked separately).
# CPU limits deliberately omitted (CFS throttling); the memory limit is the real ceiling.
stackgresOperator:
  enabled: true
  operator:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  # opt for virtualService
  adminui:
    service:
      exposeHTTP: false
      type: ClusterIP
  # ┌─────────────────────────────────────────────────────────────────────────────┐
  # │   Certificate Configuration                                                 │
  # └─────────────────────────────────────────────────────────────────────────────┘
  cert:
    autoapprove: true
    createForOperator: true
    createForWebApi: true
    createForCollector: true
    regenerateCert: true
    certDuration: 730
    regenerateWebCert: true
    regenerateWebRsa: true
  # ┌─────────────────────────────────────────────────────────────────────────────┐
  # │   RBAC Configuration                                                        │
  # └─────────────────────────────────────────────────────────────────────────────┘
  rbac:
    create: true
  # ┌─────────────────────────────────────────────────────────────────────────────┐
  # │   Authentication Configuration                                              │
  # └─────────────────────────────────────────────────────────────────────────────┘
  authentication:
    type: jwt
    # ExternalSecret stackgres-restapi-admin provides ADMIN_USER/ADMIN_PASSWORD from Doppler
    createAdminSecret: false
  # ┌─────────────────────────────────────────────────────────────────────────────┐
  # │   Grafana Integration                                                       │
  # └─────────────────────────────────────────────────────────────────────────────┘
  grafana:
    autoEmbed: true
    schema: http
    user:
    password:
  # ┌─────────────────────────────────────────────────────────────────────────────┐
  # │   Extensions Configuration                                                  │
  # └─────────────────────────────────────────────────────────────────────────────┘
  extensions:
    repositoryUrls:
      - https://extensions.stackgres.io/postgres/repository
    cache:
      enabled: true
      preloadedExtensions:
        - x86_64/linux/timescaledb-1\\.7\\.4-pg12
      persistentVolume:
        size: 1Gi
        accessModes:
        - ReadWriteOnce
        storageClass: local-path
# NOTE: no `backupStorage` key — the upstream stackgres-operator chart has no such
# value, so it was inert under any nesting. Per-cluster SGObjectStorage is the
# real backup configuration (see postgres.clusters.*.backups below).

# StackGres clusters owned by this chart. Each entry = one SGCluster +
# SGPostgresConfig + SGPoolingConfig + optional SGObjectStorage/backups.
# DB roles/DBs/connection secrets for shorthand users (passwordKey/initSqlKey)
# are created via SGScript + ExternalSecret, owned by this chart too (parity
# with the old pg-main chart) — see services/helm/openagent for full-form users.
postgres:
  clusters:
    pg-main:
      namespace: data
      storageClass: local-path
      instances: 1
      storage: 15Gi
      version: "18"
      profile: "development"
      disableMetricsExporter: true
      # Connection pooling ENABLED 2026-09-23: StackGres runs pgbouncer in front of
      # the primary, so consumers get multiplexed connections. SGPoolingConfig
      # `pg-main-pooling` carries pool_mode=transaction (see
      # templates/sgpoolingconfig.yaml). Transaction pooling disables prepared
      # statements, so any client that uses them must opt in:
      #   Prisma/LiteLLM → `?pgbouncer=true` in the connection URL
      # (set via litellm.db.url in services/helm/openagent/values.yaml).
      # NOTE: with pooling on, the read-write service `pg-main` resolves to the
      # pooler; a direct-to-postgres path is still available through the
      # per-instance services if a client cannot tolerate transaction pooling.
      disableConnectionPooling: false
      configName: pg-main-config
      poolingConfigName: pg-main-pooling
      # Resource discipline: profile values are the pod total; without explicit
      # per-container resources StackGres leaves every container unset (BestEffort).
      # pgbouncer is listed because pooling is now enabled.
      resources:
        cluster-controller:
          cpu: "200m"
          memory: 384Mi
        patroni:
          cpu: "1000m"
          memory: 2Gi
        postgres-util:
          cpu: "100m"
          memory: 128Mi
        pgbouncer:
          cpu: "250m"
          memory: 128Mi
      managedSqlScript: plane-pg-init    # SGScript rendered by this chart from users below
      users:
        - name: plane
          passwordKey: PLANE_PG_PASSWORD
          initSqlKey: PLANE_INIT_SQL
          databases:
            - name: plane
        # LiteLLM migrated off the retired per-service cluster (openagent-pg) onto
        # this centralized one. The user `openagent` keeps its EXISTING password
        # (Doppler OPENAGENT_PG_PASSWORD in svc_openagent → openagent-litellm-secrets),
        # so no consumer credential has to change — only the host does.
        - name: openagent
          passwordKey: OPENAGENT_PG_PASSWORD
          initSqlKey: OPENAGENT_INIT_SQL
          databases:
            - name: litellm
      backups:
        enabled: true
        cronSchedule: "0 2 */2 * *"           # EVERY 2 DAYS @02:00 (centralized cluster — user requirement)
        retention: 4
        bucket: stackgres-pg-main
        endpoint: https://f8caac5c12d315d3690fd6df74cacdb9.r2.cloudflarestorage.com
        region: auto
        credentialsSecret: pg-secrets          # in ns data, rendered by this chart (dataFrom find-all)
        credentialsSecretManagedByOperator: false
        createStorageAccountSecret: false
    openagent-pg:
      namespace: openagent
      storageClass: local-path
      instances: 1
      storage: 5Gi
      version: "18"
      profile: "development"
      disableMetricsExporter: true
      disableConnectionPooling: true
      configName: openagent-pg-config
      poolingConfigName: openagent-pg-pooling
      # Resource discipline: profile values are the pod total; without explicit
      # per-container resources StackGres leaves every container unset (BestEffort).
      resources:
        cluster-controller:
          cpu: "200m"
          memory: 384Mi
        patroni:
          cpu: "500m"
          memory: 1Gi
        postgres-util:
          cpu: "100m"
          memory: 128Mi
      managedSqlScript: openagent-pg-init     # rendered by openagent chart (creds owner; incl. role creation)
      syncWave: "-1"
      backups:
        enabled: true
        cronSchedule: "0 2 */2 * *"           # EVERY 2 DAYS @02:00 (user requirement)
        retention: 4
        bucket: stackgres-pg-main          # shared bucket (only one exists; StackGres keys are cluster-prefixed)
        endpoint: https://f8caac5c12d315d3690fd6df74cacdb9.r2.cloudflarestorage.com
        region: auto
        credentialsSecret: pg-secrets         # in ns openagent, rendered by this chart (below)
        credentialsSecretManagedByOperator: true
        createStorageAccountSecret: true
