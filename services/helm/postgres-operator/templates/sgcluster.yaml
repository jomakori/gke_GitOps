{{- /*
  NOTE: no spec.users — the SGCluster CRD (StackGres 1.18) schema has no users
  field. Roles/DBs are created via managedSql SGScripts owned by each app chart
  (shorthand users in values are SGScript input only).
*/ -}}
{{- if .Values.renderClusters }}
{{- range $name, $c := .Values.postgres.clusters }}
apiVersion: stackgres.io/v1
kind: SGCluster
metadata:
  name: {{ $name }}
  namespace: {{ $c.namespace }}
  annotations:
    {{- if $c.syncWave }}
    argocd.argoproj.io/sync-wave: {{ $c.syncWave | quote }}
    {{- else }}
    argocd.argoproj.io/sync-wave: "0"
    {{- end }}
spec:
  instances: {{ $c.instances }}
  postgres:
    version: {{ $c.version | quote }}
  # `profile` IS a real SGCluster field and it DOES apply — verified against the live CRD,
  # after an earlier version of this change wrongly called it dead config. Default
  # `production`; this cluster runs `development`, which is why the live pods show
  # `resources: {}`: that profile unsets the resource requirements. Removing the value
  # would let ArgoCD prune the field (it is not in ignoreDifferences), flipping resource
  # and anti-affinity defaults, and the CRD itself warns that changing it "may require a
  # restart" — on the primary database serving Plane and LiteLLM. Passed through as-is.
  profile: {{ $c.profile | quote }}
  pods:
    persistentVolume:
      size: {{ $c.storage }}
{{- if $c.storageClass }}
      storageClass: {{ $c.storageClass }}
      {{- end }}
    disableMetricsExporter: {{ $c.disableMetricsExporter }}
    disableConnectionPooling: {{ $c.disableConnectionPooling }}
{{- if $c.resources }}
    resources:
      containers:
      {{- range $cn, $cr := $c.resources }}
        {{ $cn }}:
          requests:
            cpu: {{ $cr.cpu | quote }}
            memory: {{ $cr.memory | quote }}
          limits:
            cpu: {{ $cr.cpu | quote }}
            memory: {{ $cr.memory | quote }}
      {{- end }}
{{- end }}
  configurations:
    sgPostgresConfig: {{ $c.configName | quote }}
    sgPoolingConfig: {{ $c.poolingConfigName | quote }}
    {{- if $c.backups.enabled }}
    backups:
      - cronSchedule: {{ $c.backups.cronSchedule | quote }}
        retention: {{ $c.backups.retention }}
        sgObjectStorage: {{ $name }}-storage
    {{- end }}
  {{- if $c.managedSqlScript }}
  managedSql:
    scripts:
      - id: 0
        sgScript: {{ $c.managedSqlScript }}
      # The operator's OWN script for this cluster (StackGres auto-creates
      # `<cluster>-default`, ownerReference = the cluster). It carries the prometheus
      # exporter init and StackGres' password-update step. Referenced explicitly
      # because the appset no longer ignores `/spec/managedSql`: a one-entry list
      # would have silently dropped it, stopping password maintenance.
      - id: 1
        sgScript: {{ $name }}-default
  {{- end }}
---
{{- end }}
{{- end }}
