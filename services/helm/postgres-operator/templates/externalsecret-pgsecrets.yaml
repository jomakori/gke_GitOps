{{- if .Values.renderClusters }}
{{- range $name, $c := .Values.postgres.clusters }}
{{- if and $c.backups.enabled (not $c.backups.credentialsSecretManagedByOperator) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $c.backups.credentialsSecret }}
  namespace: {{ $c.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    {{ $cfg := required "dopplerConfig is required (appset injects it)" $.Values.dopplerConfig }}
    name: doppler-svc-{{ $cfg | trimPrefix "svc_" | replace "_" "-" }}
  target:
    name: {{ $c.backups.credentialsSecret }}
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: ".*"
---
{{- end }}
{{- end }}
{{- end }}
