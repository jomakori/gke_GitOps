{{- if .Values.renderClusters }}
{{- range $name, $c := .Values.postgres.clusters }}
{{- if $c.backups.enabled }}
# R2 credentials live in Doppler devops/svc_cloudflare — the Cloudflare service
# account config, which is where the token is created and rotated. They used to be
# duplicated into svc_postgres_operator and pulled in by the pg-secrets find-all; the
# duplicate went stale when the token secret was regenerated and every backup failed
# with 403 SignatureDoesNotMatch for five days. Backups read the authoritative config
# directly, so a rotation needs no second copy.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $c.backups.r2CredentialsSecret }}
  namespace: {{ $c.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-svc-cloudflare
  target:
    name: {{ $c.backups.r2CredentialsSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: R2_ACCOUNT_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: R2_ACCOUNT_ACCESS_KEY
---
{{- end }}
{{- end }}
{{- end }}
