apiVersion: v2
name: postgres-operator
description: A Helm chart for StackGres - a PostgreSQL operator
type: application

version: 1.18.6
appVersion: "1.18.6"

dependencies:
  - name: stackgres-operator
    version: 1.18.6
    repository: https://stackgres.io/downloads/stackgres-k8s/stackgres/helm/
    # The alias is what makes the `stackgresOperator:` block in values.yaml reach
    # this subchart. Without it, values nested under that spelling are dead config
    # (Helm routes a top-level key only to a dependency's `name` or `alias`), while
    # `condition:` below still reads it - so the operator installed correctly and
    # silently ignored every setting. Verified: with the alias the operator's
    # SGCONFIG env carries createAdminSecret:false, extensions.cache.enabled:true
    # and grafana.autoEmbed:true; without it, upstream defaults.
    alias: stackgresOperator
    condition: stackgresOperator.enabled
