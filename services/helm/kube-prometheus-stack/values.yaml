dopplerConfig: "svc_grafana"

# Docs: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
# ┌──────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐
# │ Kube Prometheus Stack Configuration                                                                              │
# │ For more options, refer to official documentation:                                                               │
# │ https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml           │
# └──────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘
kube-prometheus-stack:
  # ┌─────────────────────────────────────────────────────────────────────────────┐
  # │   Default Rules Configuration                                               │
  # │   - Create default rules for monitoring the cluster                         │
  # │   - Disable rules for unreachable components                                │
  # └─────────────────────────────────────────────────────────────────────────────┘
  defaultRules:
    create: true
    rules:
      etcd: false
      kubeScheduler: false

  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ Set custom ACN approved ports for these services                         │
  # └──────────────────────────────────────────────────────────────────────────┘
  alertmanager:
    service:
      port: 15010
  # ┌─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┐
  # │   Component Scraping Configuration                                                                                  │
  # │   Disable component scraping for the kube controller manager, etcd, and kube-scheduler                              │
  # │   These components are not reachable on EKS                                                                         │
  # └─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────┘
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeSchedulerAlerting:
    enabled: false
  kubeSchedulerRecording:
    enabled: false
  # ┌─────────────────────────────────────────────────────────────────────────────┐
  # │   Prometheus Configuration                                                  │
  # └─────────────────────────────────────────────────────────────────────────────┘
  prometheus:
    service:
      port: 15017
    prometheusSpec:
      # resources, at last: with none this pod is BestEffort — the kernel's first choice
      # on a contended node — measured at 987 restarts with `resources: {}`, replaying
      # its WAL and being OOMKilled (exit 137) every ~13 minutes. Requests stop it being
      # the designated victim; the memory limit turns a runaway TSDB into one restarted
      # pod instead of a dead node.
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          # 2Gi, not 3Gi. Live footprint is ~1.1-1.26Gi (253k head series,
          # 147MB head chunks); 3Gi was headroom nobody used on a VM that is
          # chronically at its 16Gi ceiling (Committed_AS 27.9Gi vs
          # CommitLimit 25.7Gi). 2Gi still restarts a runaway TSDB cleanly
          # instead of letting it starve the node.
          memory: 2Gi
      # Bound the TSDB as well: 10d of time retention with no size cap let head and
      # compaction grow unbounded on a 30Gi volume.
      # 16GB, not 24GB: still ~2x the observed on-disk footprint, but stops
      # compaction from building a larger working set than the VM can stomach.
      retentionSize: 16GB
      # Prometheus StorageSpec for persistent data on AWS EBS
      # ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/user-guides/storage.md
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 30Gi
    kubelet:
      serviceMonitor:
        relabelings:
          - action: replace
            regex: (.*)
            replacement: $1
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: kubernetes_node
        metricRelabelings:
          - action: replace
            sourceLabels:
              - node
            targetLabel: instance
  # ┌──────────────────────────────────────────────────────────────────────────┐
  # │ Prometheus Operator Configuration                                        │
  # └──────────────────────────────────────────────────────────────────────────┘
  prometheusOperator:
    enabled: true
    # Not using cert-manager
    tls:
      enabled: false
    admissionWebhooks:
      enabled: false
  # ┌─────────────────────────────────────────────────────────────────────────────┐
  # │   Grafana Configuration                                                     │
  # └─────────────────────────────────────────────────────────────────────────────┘
  grafana:
    # Same failure as Prometheus, smaller numbers: 184 restarts on grafana plus 89/78 on
    # its two sidecars, all BestEffort with `resources: {}`.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    # Grafana's sqlite DB (which holds service-account tokens, dashboard state, etc.)
    # lives in /var/lib/grafana. With the upstream emptyDir default, every pod restart
    # wipes it — so SA tokens issued against the live DB go stale and every Grafana MCP
    # / drift-check consumer starts 401-ing (openagent Degraded after the last restart).
    # Persist it alongside Prometheus' TSDB.
    persistence:
      enabled: true
      storageClassName: local-path
      size: 2Gi
    admin:
      existingSecret: "grafana-admin-credentials"
      userKey: "ADMIN_USER"
      passwordKey: "ADMIN_PASSWORD"
    adminUser: "admin"
    adminPassword: "changeme"
    enabled: true
