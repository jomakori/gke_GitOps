apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openagent-availability
  namespace: {{ .Release.Namespace }}
  labels:
    # Matched by the Prometheus instance's ruleSelector (release-scoped default).
    release: {{ .Release.Name }}
    app.kubernetes.io/part-of: openagent
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  groups:
    - name: openagent.availability
      rules:
        # Every series here was read live off this cluster before the rule was written.
        - alert: OpenagentGatewayUnavailable
          expr: kube_deployment_status_replicas_available{namespace="openagent",deployment="openagent-litellm"} < 1
          for: 5m
          labels:
            severity: critical
            component: openagent
          annotations:
            summary: LiteLLM has no available replicas.
            description: >-
              Every agent turn that routes through the gateway is failing. Check the
              pod's startup logs for a Postgres connection failure: on 2026-10-13 the
              gateway exited 145 times this way and the outage ran ~11h undetected.
        - alert: OpenagentNodeDiskPressure
          expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
            component: openagent
          annotations:
            summary: 'Node {{ "{{ $labels.node }}" }} reports DiskPressure.'
            description: >-
              The kubelet evicts pods in this state. Postgres runs on a local-path PVC
              and was evicted this way on 2026-10-13, taking the gateway with it. Note
              the root filesystem is btrfs, where df free percentage overstates usable
              space, so the condition itself is the trustworthy signal.
        - alert: OpenagentPodRestartSpike
          expr: increase(kube_pod_container_status_restarts_total{namespace="openagent"}[15m]) > 20
          for: 5m
          labels:
            severity: warning
            component: openagent
          annotations:
            summary: 'Pod {{ "{{ $labels.pod }}" }} is restarting repeatedly.'
            description: >-
              A sustained restart loop rather than a single blip. The 2026-10-13
              gateway outage showed as 145 restarts over ~11h.
