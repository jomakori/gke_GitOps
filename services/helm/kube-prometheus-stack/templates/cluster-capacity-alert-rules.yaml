apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-capacity
  namespace: {{ .Release.Namespace }}
  labels:
    # Matched by the Prometheus instance's ruleSelector (release-scoped default).
    release: {{ .Release.Name }}
    app.kubernetes.io/part-of: cluster-capacity
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  groups:
    - name: cluster.capacity
      rules:
        # Cluster-wide, no namespace pin: catches scheduling and resource
        # pressure in any workload, not just openagent. Every expression
        # here was run live against prometheus-operated:9090 before merge.
        - alert: PodsPendingTooLong
          expr: count by (namespace, pod) (kube_pod_status_phase{phase="Pending"} == 1) > 0
          for: 3m
          labels:
            severity: warning
            component: cluster-capacity
          annotations:
            grafana_url: 'https://tinyurl.com/2xhwlhnt'
            summary: 'Pod {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} has been Pending for over 3 minutes.'
            description: >-
              The pod is not scheduled. Check node capacity, taints, and whether
              its PVC is bound.
        - alert: ContainerCPUHigh
          expr: >-
            sum by (namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total[5m]))
            /
            sum by (namespace, pod, container) (rate(container_cpu_cfs_periods_total[5m]))
            > 0.5
          for: 5m
          labels:
            severity: warning
            component: cluster-capacity
          annotations:
            grafana_url: 'https://tinyurl.com/23w5f4jt'
            summary: 'Container {{ "{{ $labels.container }}" }} in {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} is CPU-throttled.'
            description: >-
              Over half of CPU periods were throttled for 5 minutes. The CPU limit
              is likely below real demand.
        - alert: ContainerMemoryPressure
          expr: >-
            container_memory_working_set_bytes
            / on(namespace, pod, container)
            kube_pod_container_resource_limits{resource="memory"}
            > 0.85
          for: 10m
          labels:
            severity: warning
            component: cluster-capacity
          annotations:
            grafana_url: 'https://tinyurl.com/22zx9zaz'
            summary: 'Container {{ "{{ $labels.container }}" }} in {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} is above 85% of its memory limit.'
            description: >-
              Memory has stayed above 85% of the limit for 10 minutes. At the
              limit the kubelet OOM-kills the container without warning.
        - alert: ContainerOomRisk
          expr: >-
            container_memory_working_set_bytes
            / on(namespace, pod, container)
            kube_pod_container_resource_limits{resource="memory"}
            > 0.95
          for: 5m
          labels:
            severity: critical
            component: cluster-capacity
          annotations:
            grafana_url: 'https://tinyurl.com/22zx9zaz'
            summary: 'Container {{ "{{ $labels.container }}" }} in {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} is above 95% of its memory limit.'
            description: >-
              Memory has stayed above 95% of the limit for 5 minutes. An OOM kill
              is likely unless usage drops or the limit is raised.
        # Node-level free space. The PVC rules below cannot see this failure:
        # local-path PVs are hostPath, so kubelet reports the WHOLE filesystem
        # for kubelet_volume_stats_*, and a 5Gi claim holding 132G still shows
        # ~40% free. On 2026-10-23 the node fs went 34% -> 6% free in 50 minutes,
        # the kubelet evicted every namespace at 5%, and the only warnings were
        # node-exporter's predictive rule 14m ahead and DiskPressure itself —
        # i.e. after eviction had already started. These two fire earlier.
        # min by (instance, device) collapses the ~8 mounts of one filesystem
        # (/, /var/lib/kubelet, /etc/hosts, /var/log, /k3d/images, ...) into one
        # series per device, so a full node raises one alert, not eight.
        - alert: NodeFilesystemFreeLow
          expr: >-
            min by (instance, device) (
              node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.*|overlay|squashfs|ramfs|autofs"}
              /
              node_filesystem_size_bytes{fstype!~"tmpfs|fuse.*|overlay|squashfs|ramfs|autofs"}
            ) < 0.25
          for: 10m
          labels:
            severity: warning
            component: cluster-capacity
          annotations:
            grafana_url: 'https://tinyurl.com/24w26ng8'
            summary: 'Node filesystem {{ "{{ $labels.instance }}" }} ({{ "{{ $labels.device }}" }}) has under 25% free.'
            description: >-
              Free space has stayed under 25% for 10 minutes. The kubelet starts
              evicting pods at 5%, and this filesystem crossed that in 50 minutes
              on 2026-10-23. Find the growth before eviction starts: du the largest
              PVC on the node, and check for regenerable build trees (Rust target/,
              caches) rather than assuming the claim's requested size caps it.
        - alert: NodeFilesystemFreeCritical
          expr: >-
            min by (instance, device) (
              node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.*|overlay|squashfs|ramfs|autofs"}
              /
              node_filesystem_size_bytes{fstype!~"tmpfs|fuse.*|overlay|squashfs|ramfs|autofs"}
            ) < 0.12
          for: 5m
          labels:
            severity: critical
            component: cluster-capacity
          annotations:
            grafana_url: 'https://tinyurl.com/24w26ng8'
            summary: 'Node filesystem {{ "{{ $labels.instance }}" }} ({{ "{{ $labels.device }}" }}) has under 12% free.'
            description: >-
              Under 12% free and falling. Eviction begins at 5%; the kubelet will
              taint the node with disk-pressure and evict pods across every
              namespace, not just the one consuming the space. Free space or move
              the workload now — eviction is not selective.
        - alert: ContainerStoragePressure
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.20
          for: 10m
          labels:
            severity: warning
            component: cluster-capacity
          annotations:
            grafana_url: 'https://tinyurl.com/2xosx4ul'
            summary: 'PVC {{ "{{ $labels.persistentvolumeclaim }}" }} in {{ "{{ $labels.namespace }}" }} has less than 20% free.'
            description: >-
              Free space has stayed under 20% for 10 minutes. Writes fail once the
              volume fills. Check what is growing and whether cleanup applies.
        - alert: ContainerOomRiskDisk
          expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.05
          for: 5m
          labels:
            severity: critical
            component: cluster-capacity
          annotations:
            grafana_url: 'https://tinyurl.com/2xosx4ul'
            summary: 'PVC {{ "{{ $labels.persistentvolumeclaim }}" }} in {{ "{{ $labels.namespace }}" }} has less than 5% free.'
            description: >-
              Free space has stayed under 5% for 5 minutes. The owning pod is at
              imminent risk of write failures or disk-full crash loops. Free space
              or expand the volume now.
