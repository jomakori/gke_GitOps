apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: openagent-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openagent
spec:
  # The Discord webhook URL is read from key ALERT_DISCORD_WEBHOOK_URL in the
  # secret grafana-admin-credentials, which the chart's existing ExternalSecret
  # already fills from every key in the Doppler config it points at. Nothing in
  # this repo holds the value, and no second ExternalSecret is created for it:
  # one pointing at a key that does not exist yet sits not-Ready forever, and
  # because ArgoCD waits on each sync wave, it stalls the whole app's sync
  # instead of just being inert. Until the Doppler key exists the operator
  # cannot render this receiver and leaves Alertmanager's current config in
  # place.
  #
  # Alertmanager's own regexes are anchored. This matches the three OpenAgent
  # alerts plus the six cluster-capacity alerts, and nothing else.
  #
  # Grouping by resource labels yields one Discord message per pod, PVC, or
  # node, rather than one bundled message per alert name.
  #
  # Message templates are escaped with {{ "..." }} so Helm emits them literally
  # for Alertmanager to render.
  route:
    receiver: discord
    matchers:
      - name: alertname
        value: "Openagent.*|PodsPendingTooLong|ContainerCPUHigh|ContainerMemoryPressure|ContainerOomRisk|ContainerStoragePressure|ContainerOomRiskDisk"
        matchType: "=~"
    groupBy: ["alertname", "namespace", "pod", "container", "persistentvolumeclaim", "node"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 6h
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: grafana-admin-credentials
            key: ALERT_DISCORD_WEBHOOK_URL
          sendResolved: true
          title: '{{ "{{ .Status | toUpper }}: {{ .GroupLabels.alertname }}" }}'
          message: |
            {{ "{{ range .Alerts }}" }}🚨 {{ "{{ .Annotations.summary }}" }}

            {{ "{{ .Annotations.description }}" }}

            Resource: `{{ "{{ or .Labels.persistentvolumeclaim .Labels.pod .Labels.node }}" }}`
            {{ "{{ with .Labels.namespace }}" }}Namespace: `{{ "{{ . }}" }}`
            {{ "{{ end }}" }}Severity: `{{ "{{ .Labels.severity }}" }}`

            [More details]({{ "{{ .Annotations.grafana_url }}" }})
            {{ "{{ end }}" }}
