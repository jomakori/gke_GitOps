apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-{{ .Values.dopplerConfig | replace "_" "-" }}
  refreshInterval: 24h
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
  data:
    # Only this one key is pulled; the value stays in Doppler and is never
    # written into this repo or read by an agent.
    - secretKey: url
      remoteRef:
        key: DISCORD_WEBHOOK_URL
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: openagent-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: openagent
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  route:
    receiver: discord
    # Opt-in by alertname: the stock kube-prometheus-stack rules (100+ days of
    # them) and the stock Watchdog keep falling through to the chart's default
    # `null` receiver instead of flooding the channel.
    matchers:
      - name: alertname
        value: "Openagent.*"
        matchType: "=~"
    groupBy: ["alertname"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 6h
  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: url
          sendResolved: true
