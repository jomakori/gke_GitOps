apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-auth-ext
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-{{ .Values.dopplerConfig | replace "_" "-" }}
  refreshInterval: 24h
  target:
    name: cloudflare-tunnel-auth
    creationPolicy: Owner
  data:
    # Map the Doppler `TUNNEL_TOKEN` key to a K8s secret key called `token`
    # so the upstream chart's `secretKeyRef.key: token` resolves. This is
    # the same pattern used by the postgres-operator ExternalSecret
    # (template-only `data:` mapping). Cannot use `dataFrom.find` here
    # because the chart reads a hardcoded key name; we'd have to rename
    # the Doppler key globally, which would break other consumers.
    - secretKey: token
      remoteRef:
        key: TUNNEL_TOKEN
