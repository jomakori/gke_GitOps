suite: test cloudflare-tunnel umbrella chart
templates:
  - external-secret.yaml
release:
  name: my-release
  namespace: cloudflare-tunnel
tests:
  - it: should render an ExternalSecret that maps Doppler TUNNEL_TOKEN to K8s secret key 'token'
    # The upstream chart's deployment.yaml uses `secretKeyRef.key: token`
    # to read the tunnel token. The ExternalSecret must write a K8s secret
    # key called `token` (not the Doppler key name verbatim) so the chart
    # can resolve it. Regression: previously the ES used a `template` block
    # that renamed the key to `TUNNEL_TOKEN`, breaking the chart's lookup.
    asserts:
      - isKind:
          of: ExternalSecret
      - contains:
          path: spec.data
          content:
            secretKey: token
            remoteRef:
              key: TUNNEL_TOKEN
      - matchRegex:
          path: spec.secretStoreRef.name
          pattern: ^doppler-svc-cloudflare$

  - it: should set the Secret name to cloudflare-tunnel-auth (matches chart's secretKeyRef.name)
    # The chart hardcodes `secretKeyRef.name: cloudflare-tunnel-auth`
    # in deployment.yaml line 64. The ES must write to that exact name.
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: cloudflare-tunnel-auth

  - it: should use Owner creation policy (ESO manages the secret lifecycle)
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.creationPolicy
          value: Owner
