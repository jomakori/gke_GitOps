suite: splash placeholder VirtualService
templates:
  - templates/splash.yaml
tests:
  - it: answers the configured host with a directResponse page
    set:
      splash.host: splash.example.com
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: VirtualService
      - isAPIVersion:
          of: networking.istio.io/v1
      - equal:
          path: metadata.namespace
          value: istio-system
      - equal:
          path: spec.hosts
          value:
            - splash.example.com
      - equal:
          path: spec.gateways
          value:
            - maklab-gateway
      - equal:
          path: spec.http[0].directResponse.status
          value: 200
      - notExists:
          path: spec.http[0].route
      # Browsers render the page only when the type is html, not Envoy's
      # text/plain default.
      - equal:
          path: spec.http[0].headers.response.set["content-type"]
          value: "text/html; charset=utf-8"
      - matchRegex:
          path: spec.http[0].directResponse.body.string
          pattern: "^<!doctype html>"
      - matchRegex:
          path: spec.http[0].directResponse.body.string
          pattern: "There's no PR currently staged"
      - matchRegex:
          path: spec.http[0].directResponse.body.string
          pattern: "https://github.com/jomakori/openkite/pulls\\?q=is%3Apr\\+is%3Aopen\\+label%3Astaging"
  - it: attaches to the configured gateway and namespace
    set:
      gateway.name: other-gateway
      gateway.namespace: other-namespace
      splash.host: splash.example.com
    asserts:
      - equal:
          path: metadata.namespace
          value: other-namespace
      - equal:
          path: spec.gateways
          value:
            - other-gateway
  - it: renders no manifest when disabled
    set:
      splash.enabled: false
    asserts:
      - hasDocuments:
          count: 0
