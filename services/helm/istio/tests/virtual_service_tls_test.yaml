suite: VirtualService TLS origination to TLS-serving backends
release:
  name: istio
  namespace: istio-system

templates:
  - templates/virtual-services.yaml

tests:
  - it: renders no DestinationRule when destination.tls is not set
    set:
      gateway:
        name: maklab-gateway
        namespace: istio-system
      virtualServices:
        argocd:
          enabled: true
          host: argocd.maklab.net
          destination:
            host: argo-cd-argocd-server.argocd.svc.cluster.local
            port: 80
    asserts:
      - documentSelector:
          path: metadata.name
          value: argocd
        equal:
          path: spec.http[0].route[0].destination.port.number
          value: 80
      # asserts against every rendered document: none may be a DestinationRule
      - matchRegex:
          path: kind
          pattern: ^VirtualService$

  - it: adds a DestinationRule that originates TLS on the destination port
    set:
      gateway:
        name: maklab-gateway
        namespace: istio-system
      virtualServices:
        argocd:
          enabled: true
          host: argocd.maklab.net
          destination:
            host: argo-cd-argocd-server.argocd.svc.cluster.local
            port: 443
            tls:
              enabled: true
    asserts:
      - documentSelector:
          path: $[?(@.kind == "DestinationRule")].metadata.name
          value: argocd
          matchMany: true
        equal:
          path: spec.host
          value: argo-cd-argocd-server.argocd.svc.cluster.local
      - documentSelector:
          path: $[?(@.kind == "DestinationRule")].metadata.name
          value: argocd
          matchMany: true
        equal:
          path: spec.trafficPolicy.portLevelSettings[0].tls.mode
          value: SIMPLE
      - documentSelector:
          path: $[?(@.kind == "DestinationRule")].metadata.name
          value: argocd
          matchMany: true
        equal:
          path: spec.trafficPolicy.portLevelSettings[0].tls.insecureSkipVerify
          value: true
