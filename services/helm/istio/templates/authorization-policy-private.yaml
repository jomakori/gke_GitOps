{{- range $name, $vs := .Values.virtualServices }}
{{- if and $vs.enabled $vs.enablePrivate }}
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-cf-access-{{ $name }}
  namespace: {{ $.Values.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: ["*"]
      to:
        - operation:
            hosts:
              - {{ $vs.host }}
{{- if $vs.aud }}
    # Token must be issued for THIS application, not merely for any app in the
    # shared RequestAuthentication audience list. Without this rule a valid JWT
    # for one private host satisfies the DENY check on every other one.
    - when:
        - key: request.auth.claims[aud]
          notValues:
            - {{ $vs.aud }}
      to:
        - operation:
            hosts:
              - {{ $vs.host }}
{{- end }}
---
{{- end }}
{{- end }}
