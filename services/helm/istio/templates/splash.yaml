{{- if .Values.splash.enabled }}
---
# Placeholder answer for a host with no app deployed behind it. A directResponse
# route needs no backend, pod or image. VirtualServices claiming the same host on
# one gateway are merged, and for identical matches the older one keeps the route,
# so this permanently owns the host: a staging environment deployed later is
# shadowed (see the chart README). It also cannot cover a deployed-but-broken app:
# that pod answers its own 503 before this route is consulted.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: splash
  namespace: {{ .Values.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  hosts:
    - {{ required "splash.host is required when splash.enabled is true" .Values.splash.host | quote }}
  gateways:
    - {{ .Values.gateway.name }}
  http:
    - headers:
        # Without an explicit type Envoy labels the body `text/plain` and
        # browsers print the markup instead of rendering the page.
        response:
          set:
            content-type: "text/html; charset=utf-8"
      directResponse:
        status: {{ .Values.splash.status }}
        body:
          string: |-
{{ include "istio.splash.page" . | indent 12 }}
{{- end }}
