{{- /*
  DENY policy for a host whose ROUTE is declared outside this chart.

  `virtualServices.<name>.enablePrivate` cannot express these hosts: that entry
  also declares the host's route, and for a dynamically generated route (the
  OpenKite PR previews — one `pr-<N>.openkite.maklab.net` per open pull request)
  there is nothing static to write. This template takes such hosts on their own
  and renders the SAME rule as authorization-policy-private.yaml.

  Hosts may be wildcards: Istio matches `*.example.com` in a policy's
  `operation.hosts` as a suffix match (AuthorizationPolicy reference, "Writing
  Host Match Policies"), so a single `*.openkite.maklab.net` entry gates every
  current and future preview host without a policy per pull request.

  The policy name is derived from the host, with `*` spelled out as `wildcard`:
  without it `*.openkite.maklab.net` and `openkite.maklab.net` would collapse to
  the same name and the second entry would overwrite the first.
*/}}
{{- range $host := .Values.privateHosts }}
{{- $name := regexReplaceAll "[^a-z0-9]+" (lower (replace "*" "wildcard" $host)) "-" | trimAll "-" }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: require-cf-access-{{ $name }}
  namespace: {{ $.Values.gateway.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      istio: ingressgateway
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals: ["*"]
      to:
        - operation:
            hosts:
              - {{ $host | quote }}
{{- end }}
