# ── Upstream sub-chart values ────────────────────────────────────────────

# istio/base — CRDs and cluster-scoped Istio resources
base:
  enableCRDTemplates: true

# istiod — Istio control plane (ambient mode, STRICT mTLS)
istiod:
  profile: ambient
  meshConfig:
    trustDomain: cluster.local
    accessLogFile: /dev/stdout
    defaultConfig:
      proxyStatsMatcher:
        inclusionRegexps:
          - ".*outlier_detection.*"
          - ".*circuit_breakers.*"
          - ".*upstream_rq_retry.*"
          - ".*upstream_cx_.*"
    enablePrometheusMerge: true
  pilot:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    nodeSelector:
      intent: apps
  # HPA disabled: metrics-server unavailable on this cluster → HPAs can't compute and
  # abort every istio app sync. Fixed replicas instead. (istiod gates its HPA on the
  # legacy autoscaleEnabled key, NOT autoscaling.enabled.)
  autoscaleEnabled: false
  telemetry:
    enabled: true
    v2:
      prometheus:
        enabled: true

# istio/gateway — ingress gateway deployment (aliased to avoid collision with local .Values.gateway)
ingress-gateway:
  name: istio-ingressgateway
  labels:
    app: istio-ingressgateway
    istio: ingressgateway
  service:
    type: NodePort
    ports:
      - name: http2
        port: 80
        targetPort: 80
        nodePort: 32718
        protocol: TCP
      - name: https
        port: 443
        targetPort: 443
        nodePort: 30451
        protocol: TCP
  nodeSelector:
    intent: apps
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  autoscaling:
    enabled: false

# ── Local template values (from istio-config) ────────────────────────────

dopplerConfig: "svc_cloudflare"

clusterDomain: maklab.net
certEmail: admin@maklab.net

cloudflare:
  apiTokenSecretName: cloudflare-api-token
  apiTokenSecretKey: CF_API_TOKEN
  access:
    teamDomain: ""
    audienceTag: ""  # Comma-separated AUDs from CF Access Applications (e.g. "aud1,aud2"). Set by argocd-appset from Doppler CF_ACCESS_AUDS.

gateway:
  name: maklab-gateway
  namespace: istio-system

certificate:
  name: wildcard-maklab-net
  secretName: wildcard-maklab-net-tls
  duration: 2160h
  renewBefore: 720h

virtualServices:
  argocd:
    enabled: true
    host: argocd.maklab.net
    destination:
      host: argo-cd-argocd-server.argocd.svc.cluster.local
      port: 80

  excalidash:
    enabled: true
    host: draw.maklab.net
    enablePrivate: true
    destination:
      host: excalidash.excalidash.svc.cluster.local
      port: 80
  opencost:
    enabled: false
    host: opencost.maklab.net
    destination:
      host: opencost.opencost.svc.cluster.local
      port: 9090
  headlamp:
    enabled: false
    host: headlamp.maklab.net
    destination:
      host: headlamp.headlamp.svc.cluster.local
      port: 80

  # Hermes built-in dashboard (agent port 9119): high-level Hermes admin —
  # /api/analytics/usage (token usage), /api/analytics/models, sessions,
  # cron jobs, skills hub, config, system stats. Public (no CF Access): the
  # dashboard has its own basic-auth login (HERMES_DASHBOARD_BASIC_AUTH_* from
  # Doppler via openagent-secrets). hermes.maklab.net flows through the
  # wildcard tunnel → maklab-gateway; ExternalDNS creates the record.
  hermes-dashboard:
    enabled: true
    host: hermes.maklab.net
    destination:
      host: openagent-hermes-agent.openagent.svc.cluster.local
      port: 9119

# Hosts that get the CF Access DENY policy of `enablePrivate` but whose ROUTE is
# declared elsewhere — so they cannot be a `virtualServices` entry, which
# carries both the host and its destination.
#
# OpenKite PR previews are the case: `pr-<N>.openkite.maklab.net`, one per open
# pull request, generated by the ApplicationSet in `apps/openkite-preview` and
# torn down when the PR closes. The set changes with every PR, so it cannot be
# a static entry here; a per-PR policy list would also mean churn on this chart
# for something it does not route. Istio matches `operation.hosts` entries as
# suffix wildcards, so one entry gates every preview host, present and future,
# with no per-PR resource in the cluster.
#
# Each entry renders `require-cf-access-<host>` — the same DENY-except-valid-CF-
# Access-JWT rule as `enablePrivate`, enforced by the ingress gateway pods
# (which serve the preview Gateway too). The matching CF Access application is
# the wildcard app in devops_Terraform `6-cloudflare-access.tf`; its AUD has to
# reach `cloudflare.access.audienceTag` below or the JWT fails validation and
# the policy denies every authenticated request.
#
# A wildcard does not cover its parent: `*.openkite.maklab.net` does NOT gate
# `openkite.maklab.net` itself.
# -- Extra hosts that get the private DENY policy without a VirtualService here.
privateHosts:
  - "*.openkite.maklab.net"

# PodDisruptionBudget for the ingress gateway. It runs 2 replicas and fronts every
# request into the cluster, but had no PDB — a node drain could take both.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
