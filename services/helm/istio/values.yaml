# ── Upstream sub-chart values ────────────────────────────────────────────

# istio/base — CRDs and cluster-scoped Istio resources
base:
  enableCRDTemplates: true

# istiod — Istio control plane (ambient mode, STRICT mTLS)
istiod:
  profile: ambient
  meshConfig:
    trustDomain: cluster.local
    accessLogFile: /dev/stdout
    defaultConfig:
      proxyStatsMatcher:
        inclusionRegexps:
          - ".*outlier_detection.*"
          - ".*circuit_breakers.*"
          - ".*upstream_rq_retry.*"
          - ".*upstream_cx_.*"
    enablePrometheusMerge: true
  pilot:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    nodeSelector:
      intent: apps
  # HPA disabled: metrics-server unavailable on this cluster → HPAs can't compute and
  # abort every istio app sync. Fixed replicas instead. (istiod gates its HPA on the
  # legacy autoscaleEnabled key, NOT autoscaling.enabled.)
  autoscaleEnabled: false
  telemetry:
    enabled: true
    v2:
      prometheus:
        enabled: true

# istio/gateway — ingress gateway deployment (aliased to avoid collision with local .Values.gateway)
ingress-gateway:
  name: istio-ingressgateway
  labels:
    app: istio-ingressgateway
    istio: ingressgateway
  service:
    type: NodePort
    ports:
      - name: http2
        port: 80
        targetPort: 80
        nodePort: 32718
        protocol: TCP
      - name: https
        port: 443
        targetPort: 443
        nodePort: 30451
        protocol: TCP
  nodeSelector:
    intent: apps
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  autoscaling:
    enabled: false

# ── Local template values (from istio-config) ────────────────────────────

dopplerConfig: "svc_cloudflare"

clusterDomain: maklab.net
certEmail: admin@maklab.net

cloudflare:
  apiTokenSecretName: cloudflare-api-token
  apiTokenSecretKey: CF_API_TOKEN
  access:
    teamDomain: ""
    audienceTag: ""  # Comma-separated AUDs from CF Access Applications (e.g. "aud1,aud2"). Set by argocd-appset from Doppler CF_ACCESS_AUDS.

gateway:
  name: maklab-gateway
  namespace: istio-system

certificate:
  name: wildcard-maklab-net
  secretName: wildcard-maklab-net-tls
  duration: 2160h
  renewBefore: 720h

virtualServices:
  argocd:
    enabled: true
    host: argocd.maklab.net
    destination:
      host: argo-cd-argocd-server.argocd.svc.cluster.local
      port: 80

  excalidash:
    enabled: true
    host: draw.maklab.net
    enablePrivate: true
    destination:
      host: excalidash.excalidash.svc.cluster.local
      port: 80
  opencost:
    enabled: false
    host: opencost.maklab.net
    destination:
      host: opencost.opencost.svc.cluster.local
      port: 9090
  headlamp:
    enabled: false
    host: headlamp.maklab.net
    destination:
      host: headlamp.headlamp.svc.cluster.local
      port: 80

  # Hermes built-in dashboard (agent port 9119): high-level Hermes admin —
  # /api/analytics/usage (token usage), /api/analytics/models, sessions,
  # cron jobs, skills hub, config, system stats. Public (no CF Access): the
  # dashboard has its own basic-auth login (HERMES_DASHBOARD_BASIC_AUTH_* from
  # Doppler via openagent-secrets). hermes.maklab.net flows through the
  # wildcard tunnel → maklab-gateway; ExternalDNS creates the record.
  hermes-dashboard:
    enabled: true
    host: hermes.maklab.net
    destination:
      host: openagent-hermes-agent.openagent.svc.cluster.local
      port: 9119

# Placeholder page for a host with no app deployed behind it: one VirtualService
# with a `directResponse`, so it needs no backend, pod or image (splash.yaml).
# Envoy prefers a deployed app's exact-host route over this one, so the page is
# selected only while the host is otherwise unrouted.
splash:
  # -- Render the placeholder VirtualService.
  enabled: true
  # -- Host the placeholder answers for. Keep it exact — a wildcard here would
  # answer every unrouted host on the domain.
  host: staging-openkite.maklab.net
  # -- HTTP status of the placeholder response. 200 reads as a normal page; 503
  # makes uptime checks flag the missing preview.
  status: 200
  # -- Name under the logo (the logo itself is the kite mark above it).
  brand: OpenKite
  # -- First line below the logo.
  message: "There's no PR currently staged."
  # -- Second line, as a link to the pull requests filtered by the staging label.
  linkText: "Confirm if PR has a staging label"
  # -- URL the link text points at: the open pull requests carrying the staging
  # label, which are the ones that can be staged.
  linkUrl: "https://github.com/jomakori/openkite/pulls?q=is%3Apr+is%3Aopen+label%3Astaging"

# Hosts whose route is declared elsewhere and that still need the DENY policy of
# `enablePrivate`. Each entry emits a `require-cf-access-<host>` AuthorizationPolicy
# into `istio-system` from this chart (authorization-policy-private-hosts.yaml).
# Wildcards are allowed and Istio treats `*.example.com` in `operation.hosts` as a
# suffix match, so a single entry covers every preview host.
privateHosts:
  - "*.openkite.maklab.net"

# PodDisruptionBudget for the ingress gateway. It runs 2 replicas and fronts every
# request into the cluster, but had no PDB — a node drain could take both.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
