apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    # Store name is derived from the appset-injected `dopplerConfig` instead of
    # being hardcoded: the ClusterSecretStore itself is generated by
    # services/helm/external-secrets as doppler-<config with underscores as dashes>,
    # so a hardcoded store name here would make `dopplerConfig` a decorative key
    # that silently has no effect. Renders `doppler-svc-tailscale` for the
    # default `svc_tailscale`.
    name: doppler-{{ .Values.dopplerConfig | default "svc_tailscale" | replace "_" "-" }}
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef:
        key: TAILSCALE_OAUTH_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: TAILSCALE_OAUTH_CLIENT_SECRET
