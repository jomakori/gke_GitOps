apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    # Derived from the appset-injected `dopplerConfig`; renders `doppler-ci` for
    # the default. See the ClusterSecretStore generator in services/helm/external-secrets.
    name: doppler-{{ .Values.dopplerConfig | default "ci" | replace "_" "-" }}
  target:
    name: dex-secrets
    creationPolicy: Owner
  # Explicit keys, not `find`: the CI config also holds the Terraform and GitHub
  # tokens, and the identity provider has no business holding those.
  data:
    {{- range .Values.secretKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ . }}
    {{- end }}
