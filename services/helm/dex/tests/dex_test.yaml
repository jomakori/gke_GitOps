suite: dex identity provider
templates:
  - charts/dex/templates/secret.yaml
  - charts/dex/templates/deployment.yaml
  - charts/dex/templates/service.yaml
tests:
  - it: renders the Google connector and the hermes public client
    template: charts/dex/templates/secret.yaml
    asserts:
      - equal:
          path: data["config.yaml"]
          value: ""

  - it: reads the Google credentials from the ESO-rendered secret
    template: charts/dex/templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            secretRef:
              name: dex-secrets
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_EXPAND_ENV
            value: "true"

  - it: gives Dex a writable /tmp while the root filesystem stays read-only
    template: charts/dex/templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: serves the OIDC endpoints on 5556
    template: charts/dex/templates/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 5556
