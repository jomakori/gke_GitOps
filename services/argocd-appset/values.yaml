# Global Values - shared values - passed in via DevOps repo (Terraform)
argoNamespace: ""
argoProject: ""
clusterDomain: ""
clusterName: ""
clusterServer: ""
repoUrl: ""
storageClass: "local-path"
targetRevision: ""
accessTeamDomain: ""
accessAudienceTag: ""

# Service Configurations
services:
# Wave 0 — Init services (no deps)
  localPath:
    enable: true
    syncWave: "0"
    syncOptions:
      - CreateNamespace=true

  certManager:
    enable: true
    syncWave: "0"
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  metricsServer:
    enable: true
    syncWave: "0"
    destNamespace: kube-system
    finalizer: true

    syncOptions:
      - Replace=true

  vpa:
    enable: true
    syncWave: "0"
    destNamespace: vpa
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  # Wave 1 — Secret engine
  externalSecrets:
    enable: true
    syncWave: "1"
    finalizer: true

    retryLimit: 5
    retryMaxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      # SSA avoids the 256KB last-applied annotation on the huge ESO CRDs
      # (SyncError: metadata.annotations: Too long). Required since 2026-08-09.
      - ServerSideApply=true
      # Fail-fast: a wedged sync (e.g. CRD/health gate) must not hang forever.
      - SyncTimeoutSeconds=300
    ignoreDifferences:
      - group: ""
        kind: Secret
        name: external-secrets-webhook
        namespace: external-secrets
        jsonPointers:
          - /data
          - /type
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
          - .webhooks[].failurePolicy
          - .webhooks[].matchPolicy
          - .webhooks[].namespaceSelector
          - .webhooks[].objectSelector
          - .webhooks[].timeoutSeconds
          - .webhooks[].rules[].scope

  # Wave 2 — Istio umbrella (after external-secrets ClusterSecretStores are ready)
  istio:
    enable: true
    syncWave: "2"
    destNamespace: istio-system
    dopplerConfig: "svc_cloudflare"
    ignoreDifferences:
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
          - .spec.dataFrom[].find.conversionStrategy
          - .spec.dataFrom[].find.decodingStrategy
          - .spec.dataFrom[].find.nullBytePolicy
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[].clientConfig.caBundle
          - .webhooks[].failurePolicy
          - .webhooks[].matchPolicy
          - .webhooks[].namespaceSelector
          - .webhooks[].objectSelector
          - .webhooks[].timeoutSeconds
          - .webhooks[].rules[].scope
    parameters:
      - name: virtualServices.argocd.enabled
        value: "true"
      - name: virtualServices.argocd.host
        value: argocd.maklab.net
      - name: virtualServices.argocd.destination.host
        value: argo-cd-argocd-server.argocd.svc.cluster.local
      - name: virtualServices.argocd.destination.port
        value: "80"
  tailscale:
    enable: true
    syncWave: "2"
    destNamespace: tailscale
    dopplerConfig: "svc_tailscale"
    retryLimit: 3
    retryMaxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - SyncTimeoutSeconds=300

  openagent:
    enable: true
    syncWave: "5"
    destNamespace: openagent
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
    parameters:
      - name: clusterDomain
        value: "{{ .Values.clusterDomain }}"
      - name: storageClass
        value: "{{ .Values.storageClass }}"
    dopplerConfig: "svc_openagent"
    gateways:
      enable_private: true
      destination:
        serviceName: openagent-hermes-workspace
        servicePort: 3000
    syncOptions:
      - CreateNamespace=true
    skipSchemaValidation: true
    # The MCP preflight runs as a PostSync hook and fails the sync when a server
    # does not come up. With the default limit of 1, one failure exhausts the
    # retry budget and the app sits OutOfSync/Degraded with no further attempt -
    # so a subsequent commit that fixes the gate is never applied without a
    # manual sync. Several gate failures are genuinely transient (the drift job
    # has caught kiwi returning "initialize HTTP 503: upstream connect error ...
    # connection timeout"), and those deserve a retry.
    #
    # Known limitation: this does not make a permanently-red gate recover. If the
    # gate keeps failing, the sync stays Failed and still needs a manual sync -
    # by design, since a gate that cannot fail a sync is not a gate.
    retryLimit: 5
    ignoreDifferences:
      # HPA writes live .spec.replicas on the litellm Deployment; ArgoCD
      # selfHeal would fight it into a perpetual sync loop. Ignore the field.
      - group: apps
        kind: Deployment
        name: openagent-litellm
        namespace: openagent
        jsonPointers:
          - /spec/replicas

  # Wave 3 — Edge infrastructure (after istio for backend routing)
  cloudflareTunnel:
    enable: true
    syncWave: "3"
    dopplerConfig: "svc_cloudflare"
    # Deployment selector became immutable when the chart bumped its labels —
    # ArgoCD can't patch it → stuck OutOfSync. Replace=true force-recreates the
    # Deployment once on sync (seconds of tunnel downtime), then it's stable.
    syncOptions:
      - CreateNamespace=true
      - Replace=true

  # Wave 4 — Operators (no endpoint deps)
  externalDns:
    enable: true
    syncWave: "4"
    dopplerConfig: "svc_cloudflare"

  keda:
    enable: false
    syncWave: "4"
    argocdNamespace: argocd
    finalizer: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

  mongodbOperator:
    enable: false
    syncWave: "4"
    argocdNamespace: argocd
    argoProject: default

    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retryLimit: 2
    retryMaxDuration: 3m
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/respect-existing: "true"
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jqPathExpressions:
          - .

  # Wave 4 — StackGres operator only (upstream subchart + operator admin ES + SGConfig hook).
  # Cluster CRs live in the separate cluster-scope app `postgresClusters` below —
  # a namespaced app can only manage resources in its own namespace.
  postgresOperator:
    enable: true
    syncWave: "4"
    argocdNamespace: argocd
    argoProject: default
    destNamespace: postgres-operator
    dopplerConfig: "svc_postgres_operator"
    parameters:
      - name: renderClusters
        value: "false"
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    # Raised from 2/3m for the same reason as postgresClusters below: an operator
    # rollout makes the sgcluster/sgscript admission webhooks unavailable, so a sync
    # started during the rollout burns its budget and never self-recovers.
    retryLimit: 5
    retryMaxDuration: 5m
    skipCrds: true
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jqPathExpressions:
          - .
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
          - .spec.data[].remoteRef.conversionStrategy
          - .spec.data[].remoteRef.decodingStrategy
          - .spec.data[].remoteRef.metadataPolicy
          - .spec.data[].remoteRef.nullBytePolicy

  # StackGres cluster resources (SGCluster/SGPostgresConfig/SGPoolingConfig/
  # SGObjectStorage + SGScript + pg-secrets ExternalSecrets + Namespace data).
  # Cluster-scope (destNamespace: "") so resources pin explicit namespaces
  # (data, openagent). Renders with renderOperator=false + dependency disabled.
  # finalizer: false — app removal must orphan the SGClusters, not cascade-delete
  # them (same safety gate as the old pgMain entry).
  postgresClusters:
    enable: true
    syncWave: "5"
    argocdNamespace: argocd
    argoProject: default
    destNamespace: ""
    finalizer: false
    helmPath: services/helm/postgres-operator
    dopplerConfig: "svc_postgres_operator"
    parameters:
      - name: renderOperator
        value: "false"
      - name: renderClusters
        value: "true"
      # Disables the upstream operator subchart for this clusters-only Application.
      # The key must stay in step with services/helm/postgres-operator/Chart.yaml:
      # `condition:` and this parameter both read the dependency alias
      # `stackgresOperator`. Renaming one without the other silently re-enables the
      # subchart here, and this Application would then render the operator into the
      # same namespace as the postgres-operator Application (two apps, one
      # Deployment). The alias is also what makes the chart's `stackgresOperator:`
      # values block reach the subchart at all.
      - name: stackgresOperator.enabled
        value: "false"
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    # selfHeal made explicit (the helper defaulted it true implicitly) so the
    # drift-correction behaviour of the database ApplicationSet is visible here.
    selfHeal: true
    # retryLimit/retryMaxDuration raised from 2/3m: this app owns both databases,
    # and its dependencies are the most outage-coupled in the repo (every SGCluster
    # write needs the operator's mutating webhook, which is unavailable for the
    # whole duration of an operator rollout). At 2/3m a sync attempted in that
    # window exhausts its budget and then waits for a new revision - exactly when
    # nobody is pushing commits. Same reasoning (and same values) as `openagent`.
    retryLimit: 5
    retryMaxDuration: 5m
    ignoreDifferences:
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
          - .spec.data[].remoteRef.conversionStrategy
          - .spec.data[].remoteRef.decodingStrategy
          - .spec.data[].remoteRef.metadataPolicy
          - .spec.data[].remoteRef.nullBytePolicy
          - .spec.dataFrom[].find.conversionStrategy
          - .spec.dataFrom[].find.decodingStrategy
          - .spec.dataFrom[].find.nullBytePolicy
      - group: stackgres.io
        kind: SGPostgresConfig
        name: pg-main-config
        namespace: data
        jsonPointers:
          - /spec/postgresql.conf
      - group: stackgres.io
        kind: SGCluster
        name: pg-main
        namespace: data
        jsonPointers:
          - /metadata/annotations/stackgres.io~1operatorVersion
          - /spec/configurations/observability
          - /spec/pods/disableEnvoy
          - /spec/pods/disablePostgresUtil
          - /spec/pods/managementPolicy
          - /spec/pods/updateStrategy
          - /spec/postgres/flavor
          - /spec/postgres/ssl
          - /spec/postgresServices
          - /spec/replication
          # Stays ignored: `sgInstanceProfile` must name an SGInstanceProfile CR and there
          # is none in git to point at (the operator creates `<cluster>-default` itself).
          # Not to be confused with `profile`, which DOES apply — see the chart.
          - /spec/sgInstanceProfile
          # Stays ignored, and it is vestigial either way: the SGCluster CRD in
          # StackGres 1.18 has NO `spec.users` field (verified against the live CRD
          # schema), which is why role provisioning goes through the managedSql
          # SGScript below instead. Kept only so the list still reads as "we thought
          # about users".
          - /spec/users
          # NOT ignored any more. This is the one path that actually provisions the
          # database roles: the chart renders an SGScript (from its `users:` block —
          # passwordKey/initSqlKey) and the cluster has to reference it. While this was
          # ignored, the live cluster kept referencing scripts from a since-deleted
          # Application while the chart's own SGScript sat unreferenced, so a role
          # declared in git was never created. The chart now also references the
          # operator's auto-created `<cluster>-default` script, because un-ignoring
          # alone would have dropped that reference (it carries the exporter init and
          # StackGres' own password-update step, which the chart does not model).
        jqPathExpressions:
          - .spec.configurations.backups[].reconciliationTimeout
      # The `openagent-pg` SGCluster + its SGPostgresConfig/pooling objects used to be
      # ignored here. Both are gone from the cluster list, so the entries would ignore
      # nothing — ArgoCD prunes them (prune: true, no ownerReference makes that unsafe).
      # There is one Postgres cluster now: `pg-main` (ns data).
# Plane.so — kanban backend. Workloads only; pg-main cluster + creds are
  # owned by the postgres-operator chart (postgresClusters app).
  plane:
    enable: true
    syncWave: "6"
    destNamespace: plane
    dopplerConfig: "svc_postgres_operator"
    syncOptions:
      - CreateNamespace=true
      - SyncTimeoutSeconds=300
    gateways:
      enable_public: true
      subdomain: plane
      destination:
        serviceName: plane-web
        servicePort: 3000

  # Wave 5 — General services
  kubePrometheusStack:
    enable: true
    dopplerConfig: "svc_grafana"
    finalizer: true
    syncWave: "5"
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    ignoreDifferences:
      - group: apps
        kind: DaemonSet
        name: kube-prometheus-stack-prometheus-node-exporter
        namespace: kube-prometheus-stack
        jsonPointers:
          - /spec/template/spec/containers/0/resources
      - group: external-secrets.io
        kind: ExternalSecret
        jqPathExpressions:
          - .spec.dataFrom[].find.conversionStrategy
          - .spec.dataFrom[].find.decodingStrategy
          - .spec.dataFrom[].find.nullBytePolicy
    gateways:
      enable_private: true
      subdomain: grafana
      destination:
        serviceName: kube-prometheus-stack-grafana


  redisOperator:
    enable: false
    syncWave: "5"
    finalizer: true
    environments:
      - production
      - staging
    syncOptions:
      - CreateNamespace=true
      - Replace=true
      - ServerSideApply=true
    parameters:
      - name: redis-cluster.persistence.storageClass
        value: "{{ .Values.storageClass }}"

  openagentDiscord:
    enable: false
    syncWave: "3"
    destNamespace: openagent
    dopplerConfig: "svc_openagent"
    parameters:
      - name: config.mentionOnly
        value: "false"
    syncOptions:
      - CreateNamespace=true

  excalidash:
    enable: false
    # Stateful and already running outside ArgoCD: removal must orphan the
    # workload, never cascade-delete its namespace/PVC (`local-path` has
    # reclaimPolicy Delete). Same guard as postgresClusters.
    finalizer: false
    prune: false
    syncWave: '6'
    argocdNamespace: argocd
    argoProject: default
    destNamespace: excalidash
    helmPath: services/helm/excalidash
    gateways:
      enable_private: true
    syncOptions:
      - CreateNamespace=true

  opendesign:
    enable: false
    # Stateful and already running outside ArgoCD: removal must orphan the
    # workload, never cascade-delete its namespace/PVC (`local-path` has
    # reclaimPolicy Delete). Same guard as postgresClusters.
    finalizer: false
    prune: false
    syncWave: '6'
    argocdNamespace: argocd
    argoProject: default
    destNamespace: opendesign
    helmPath: services/helm/opendesign
    gateways:
      enable_private: true
    syncOptions:
      - CreateNamespace=true
    parameters:
      - name: opendesign.config.disableApiAuth
        value: "1"
      - name: opendesign.config.bindHost
        value: "127.0.0.1"
      - name: opendesign.config.allowedOrigins
        value: "https://design.maklab.net"
      - name: opendesign.config.publicBaseUrl
        value: "https://design.maklab.net"
      - name: opendesign.replicaCount
        value: "1"
      - name: opendesign.persistence.enabled
        value: "true"
      - name: opendesign.persistence.storageClass
        value: "local-path"
      - name: opendesign.persistence.size
        value: "10Gi"
      - name: opendesign.ingress.enabled
        value: "false"
