# Global Values - shared values - passed in via DevOps repo (Terraform)
argoNamespace: ""
argoProject: ""
clusterDomain: ""
clusterName: ""
clusterServer: ""
repoUrl: ""
storageClass: ""
targetRevision: ""

# App Environment Values — dopplerConfig maps to ClusterSecretStore/doppler-{name}
demoApi:
  environment:
    staging:
      dopplerConfig: demo-api-staging
    production:
      dopplerConfig: demo-api-prod

notesUi:
  environment:
    staging:
      dopplerConfig: notes-ui-staging
    production:
      dopplerConfig: notes-ui-prod

# App Configurations — key = app name (used for Application metadata.name + chart lookup)
apps:
  demoApi:
    enable: false
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Secret
        jsonPointers:
          - /metadata/argocd.argoproj.io/sync-wave
    parameters:
      - name: appName
        value: "demoApi"
      - name: demoApi.environments.staging.dopplerConfig
        value: "{{ .Values.demoApi.environment.staging.dopplerConfig }}"
      - name: demoApi.environments.production.dopplerConfig
        value: "{{ .Values.demoApi.environment.production.dopplerConfig }}"

  notesUi:
    enable: false
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Secret
        jsonPointers:
          - /metadata/argocd.argoproj.io/sync-wave
    parameters:
      - name: appName
        value: "notesUi"
      - name: notesUi.environments.staging.dopplerConfig
        value: "{{ .Values.notesUi.environment.staging.dopplerConfig }}"
      - name: notesUi.environments.production.dopplerConfig
        value: "{{ .Values.notesUi.environment.production.dopplerConfig }}"

  # Per-PR preview infrastructure for jomakori/openkite. Deploys the
  # apps/openkite-preview chart, which owns the preview ApplicationSet (GitHub
  # Pull Request generator) plus the shared preview namespace, wildcard Gateway
  # and Certificate. No `gateways` block: this app has no VirtualService host of
  # its own, and the shared template tolerates its absence.
  openkite-preview:
    enable: true
    syncWave: "6"
    helmPath: apps/openkite-preview
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    # Same retry-exhaustion trap as openagent. This app's only blocker was the
    # missing Doppler key ARGOCD_GITHUB_TOKEN, which its own ExternalSecret could
    # not fetch - so its sync failed, consumed the single default retry, and left
    # it OutOfSync with the ApplicationSet never created. Once the key existed the
    # app still would not re-attempt without a manual sync.
    retryLimit: 5
    syncOptions:
      - CreateNamespace=true
    # Inject the globals the preview chart expects. Values come from the
    # app-of-apps values contract (Terraform passes the same globals to this
    # chart via `apps.yml`), so the child Application renders exactly what
    # apps/argocd-appset itself received.
    parameters:
      - name: argoNamespace
        value: "{{ .Values.argoNamespace }}"
      - name: argoProject
        value: "{{ .Values.argoProject }}"
      - name: clusterDomain
        value: "{{ .Values.clusterDomain }}"
      - name: clusterName
        value: "{{ .Values.clusterName }}"
      - name: clusterServer
        value: "{{ .Values.clusterServer }}"
      - name: repoUrl
        value: "{{ .Values.repoUrl }}"
      - name: storageClass
        value: "{{ .Values.storageClass }}"
      - name: targetRevision
        value: "{{ .Values.targetRevision }}"

  # Persistent host for merged work on jomakori/openkite, so a UI change is
  # viewable without opening a throwaway PR. Reuses the per-PR preview workload
  # chart with the long-lived `main` tag published by openkite's image workflow,
  # into the shared preview namespace so it inherits the wildcard Certificate and
  # the existing Gateway. Unlike a generated pr-<N> Application, nothing prunes
  # it on merge.
  openkite-main:
    enable: true
    syncWave: "6"
    helmPath: apps/helm/openkite-preview
    destNamespace: openkite-preview
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    retryLimit: 5
    # No `gateways` block: the chart renders its own VirtualService bound to the
    # shared preview Gateway, so the appset must not add a second one for the
    # same host. No CreateNamespace either: the namespace is created and owned by
    # the openkite-preview app chart.
    parameters:
      - name: fullnameOverride
        value: openkite-main
      - name: image.repository
        value: ghcr.io/jomakori/openkite
      - name: image.tag
        value: main
      - name: ingress.host
        value: main.openkite.maklab.net
      - name: replicaCount
        value: "1"
