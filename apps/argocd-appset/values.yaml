# Global Values - shared values - passed in via DevOps repo (Terraform)
argoNamespace: ""
argoProject: ""
clusterDomain: ""
clusterName: ""
clusterServer: ""
repoUrl: ""
storageClass: ""
targetRevision: ""

# App Environment Values — dopplerConfig maps to ClusterSecretStore/doppler-{name}
demoApi:
  environment:
    staging:
      dopplerConfig: demo-api-staging
    production:
      dopplerConfig: demo-api-prod

openkite:
  # OpenKite's runtime secrets live in the openagent service's Doppler config:
  # staging runs the same workload, so it reads the same store.
  environment:
    staging:
      dopplerConfig: svc_openagent
    production:
      dopplerConfig: svc_openagent

notesUi:
  environment:
    staging:
      dopplerConfig: notes-ui-staging
    production:
      dopplerConfig: notes-ui-prod

# App Configurations — key = app name (used for Application metadata.name + chart lookup)
apps:
  demoApi:
    enable: false
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Secret
        jsonPointers:
          - /metadata/argocd.argoproj.io/sync-wave
    parameters:
      - name: appName
        value: "demoApi"
      - name: demoApi.environments.staging.dopplerConfig
        value: "{{ .Values.demoApi.environment.staging.dopplerConfig }}"
      - name: demoApi.environments.production.dopplerConfig
        value: "{{ .Values.demoApi.environment.production.dopplerConfig }}"

  notesUi:
    enable: false
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Secret
        jsonPointers:
          - /metadata/argocd.argoproj.io/sync-wave
    parameters:
      - name: appName
        value: "notesUi"
      - name: notesUi.environments.staging.dopplerConfig
        value: "{{ .Values.notesUi.environment.staging.dopplerConfig }}"
      - name: notesUi.environments.production.dopplerConfig
        value: "{{ .Values.notesUi.environment.production.dopplerConfig }}"

  # OpenKite: one spec, three entry points.
  #
  # PROD — this entry renders the apps/helm umbrella (helmPath below) for the
  # app's `production` environment: Deployment, Service and VirtualService at
  # openkite.maklab.net, gated by Cloudflare Access because the app spec sets
  # enable_private. There is no openkite-specific chart and no per-environment
  # manifest anywhere: the workload is the `openkite:` spec in apps/helm/values.yaml.
  #
  # PREVIEWS — `enable_preview` opts this app into the generic
  # templates/preview.yml generator, which emits one ApplicationSet for it. Each
  # admitted PR re-renders the SAME spec with per-PR coordinates (image tag,
  # subdomain, namespace) — so a preview cannot drift from what prod runs.
  #
  # STAGING — `staging.enable` opts the app into the second admission path in the
  # same file: the same PR generator under the `staging` label, rendering ONE
  # shared Application (fixed name, never one per PR) at the spec's own staging
  # environment with the admitted PR's tag. The slot is single-occupancy by
  # construction: the last PR labelled holds it.
  #
  # `openkite-preview` (the bespoke appset + workload chart pair) is deleted:
  # everything it did is now either the spec above or the generic generator.
  openkite:
    enable: true
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    # Injects openkite.enable_domain=true, so the umbrella renders the
    # VirtualService for the host. Privacy is NOT expressed here: it is the app
    # spec's `enable_private`, which renders the per-host Access DENY policy.
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Secret
        jsonPointers:
          - /metadata/argocd.argoproj.io/sync-wave
    enable_preview: true
    preview:
      repo: openkite
      # Only a PR carrying this label becomes a preview (the image gate in
      # jomakori/openkite pr-image.yml applies it after a successful push).
      label: preview
    # The staging admission path: same repo and token as `preview` above, and the
    # label is what differs — a request for the shared slot rather than for an
    # environment of the PR's own.
    staging:
      enable: true
      label: staging
    parameters:
      - name: appName
        value: "openkite"
      - name: openkite.environments.staging.dopplerConfig
        value: "{{ .Values.openkite.environment.staging.dopplerConfig }}"
      - name: openkite.environments.production.dopplerConfig
        value: "{{ .Values.openkite.environment.production.dopplerConfig }}"
      # The spec above enables the staging environment, because that is what the
      # staging entry point renders. The prod and preview Applications are not its
      # owner, so they render production alone — otherwise every preview would add
      # a second Application for the same staging objects (and a second
      # VirtualService for the same staging host). The staging entry point
      # re-asserts enable_staging after these, and turns production off instead.
      - name: openkite.enable_staging
        value: "false"
