# Global Values - shared values - passed in via DevOps repo (Terraform)
argoNamespace: ""
argoProject: ""
clusterDomain: ""
clusterName: ""
clusterServer: ""
repoUrl: ""
storageClass: ""
targetRevision: ""

# App Environment Values — dopplerConfig maps to ClusterSecretStore/doppler-{name}
demoApi:
  environment:
    staging:
      dopplerConfig: demo-api-staging
    production:
      dopplerConfig: demo-api-prod

notesUi:
  environment:
    staging:
      dopplerConfig: notes-ui-staging
    production:
      dopplerConfig: notes-ui-prod

# Engine values only. The console container consumes none of them (the app spec
# sets service.envFrom=false), so a web-facing process never holds broker keys.
tickerlight:
  environment:
    staging:
      dopplerConfig: tickerlight_stg
    production:
      dopplerConfig: tickerlight_prd

# App Configurations — key = app name (used for Application metadata.name + chart lookup)
apps:
  demoApi:
    enable: false
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Secret
        jsonPointers:
          - /metadata/argocd.argoproj.io/sync-wave
    parameters:
      - name: appName
        value: "demoApi"
      - name: demoApi.environments.staging.dopplerConfig
        value: "{{ .Values.demoApi.environment.staging.dopplerConfig }}"
      - name: demoApi.environments.production.dopplerConfig
        value: "{{ .Values.demoApi.environment.production.dopplerConfig }}"

  notesUi:
    enable: false
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Secret
        jsonPointers:
          - /metadata/argocd.argoproj.io/sync-wave
    parameters:
      - name: appName
        value: "notesUi"
      - name: notesUi.environments.staging.dopplerConfig
        value: "{{ .Values.notesUi.environment.staging.dopplerConfig }}"
      - name: notesUi.environments.production.dopplerConfig
        value: "{{ .Values.notesUi.environment.production.dopplerConfig }}"

  # Tickerlight: console + trading-mcp engine in one pod, one claim at /data.
  tickerlight:
    enable: true
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
    staging:
      # Per-PR preview appsets still need an Argo CD repo token secret
      # (argocd-github-token-tickerlight). That is unrelated to the standing
      # staging environment, which now renders from tickerlight.enable_staging
      # below using the tickerlight_stg Doppler config.
      enable: false
      label: staging
    parameters:
      - name: appName
        value: "tickerlight"
      - name: tickerlight.environments.staging.dopplerConfig
        value: "{{ .Values.tickerlight.environment.staging.dopplerConfig }}"
      - name: tickerlight.environments.production.dopplerConfig
        value: "{{ .Values.tickerlight.environment.production.dopplerConfig }}"
      - name: tickerlight.enable_staging
        value: "true"
