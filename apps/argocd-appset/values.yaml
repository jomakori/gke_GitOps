# Global Values - shared values - passed in via DevOps repo (Terraform)
argoNamespace: ""
argoProject: ""
clusterDomain: ""
clusterName: ""
clusterServer: ""
repoUrl: ""
storageClass: ""
targetRevision: ""

# App Environment Values — dopplerConfig maps to ClusterSecretStore/doppler-{name}
demoApi:
  environment:
    staging:
      dopplerConfig: demo-api-staging
    production:
      dopplerConfig: demo-api-prod

notesUi:
  environment:
    staging:
      dopplerConfig: notes-ui-staging
    production:
      dopplerConfig: notes-ui-prod

# App Configurations — key = app name (used for Application metadata.name + chart lookup)
apps:
  demoApi:
    enable: false
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Secret
        jsonPointers:
          - /metadata/argocd.argoproj.io/sync-wave
    parameters:
      - name: appName
        value: "demoApi"
      - name: demoApi.environments.staging.dopplerConfig
        value: "{{ .Values.demoApi.environment.staging.dopplerConfig }}"
      - name: demoApi.environments.production.dopplerConfig
        value: "{{ .Values.demoApi.environment.production.dopplerConfig }}"

  notesUi:
    enable: false
    syncWave: "6"
    helmPath: apps/helm/
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    gateways:
      enable_public: true
    syncOptions:
      - CreateNamespace=true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
      - group: apps
        kind: Secret
        jsonPointers:
          - /metadata/argocd.argoproj.io/sync-wave
    parameters:
      - name: appName
        value: "notesUi"
      - name: notesUi.environments.staging.dopplerConfig
        value: "{{ .Values.notesUi.environment.staging.dopplerConfig }}"
      - name: notesUi.environments.production.dopplerConfig
        value: "{{ .Values.notesUi.environment.production.dopplerConfig }}"

  opendesign:
    enable: false
    enable_private: true
    gateways:
      enable_public: false
    helmPath: apps/helm/opendesign
    project: default
    environment:
      production:
        cluster: https://kubernetes.default.svc
        namespace: opendesign
    parameters:
      - name: opendesign.config.disableApiAuth
        value: "1"
      - name: opendesign.config.bindHost
        value: "127.0.0.1"
      - name: opendesign.config.allowedOrigins
        value: "https://design.maklab.net"
      - name: opendesign.config.publicBaseUrl
        value: "https://design.maklab.net"
      - name: opendesign.replicaCount
        value: "1"
      - name: opendesign.persistence.enabled
        value: "true"
      - name: opendesign.persistence.storageClass
        value: "local-path"
      - name: opendesign.persistence.size
        value: "10Gi"
      - name: opendesign.ingress.enabled
        value: "false"

  excalidash:
    enable: false
    enable_private: true
    gateways:
      enable_public: false
    helmPath: apps/helm/excalidash
    project: default
    environment:
      production:
        cluster: https://kubernetes.default.svc
        namespace: excalidash

  # Per-PR preview infrastructure for jomakori/openkite. Deploys the
  # apps/openkite-preview chart, which owns the preview ApplicationSet (GitHub
  # Pull Request generator) plus the shared preview namespace, wildcard Gateway
  # and Certificate. No `gateways` block: this app has no VirtualService host of
  # its own, and the shared template tolerates its absence.
  openkite-preview:
    enable: true
    syncWave: "6"
    helmPath: apps/openkite-preview
    destNamespace: argocd
    argocdNamespace: argocd
    argoProject: default
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Inject the globals the preview chart expects. Values come from the
    # app-of-apps values contract (Terraform passes the same globals to this
    # chart via `apps.yml`), so the child Application renders exactly what
    # apps/argocd-appset itself received.
    parameters:
      - name: argoNamespace
        value: "{{ .Values.argoNamespace }}"
      - name: argoProject
        value: "{{ .Values.argoProject }}"
      - name: clusterDomain
        value: "{{ .Values.clusterDomain }}"
      - name: clusterName
        value: "{{ .Values.clusterName }}"
      - name: clusterServer
        value: "{{ .Values.clusterServer }}"
      - name: repoUrl
        value: "{{ .Values.repoUrl }}"
      - name: storageClass
        value: "{{ .Values.storageClass }}"
      - name: targetRevision
        value: "{{ .Values.targetRevision }}"
