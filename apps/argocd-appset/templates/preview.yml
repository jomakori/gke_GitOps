{{- /* Generic PR-preview generator: one ApplicationSet per app with enable_preview.
       Each admitted PR re-renders the app's own apps/helm spec (helmPath) at per-PR
       coordinates, so a preview cannot drift from prod. */}}
{{- $root := . }}
{{- range $key, $cfg := .Values.apps }}
{{- $kebabKey := include "kebab" $key }}
{{- $p := $cfg.preview | default dict }}
{{- $extraParams := list }}
{{- if (($cfg.gateways | default dict).enable_public) }}
{{-   $extraParams = append $extraParams (dict "name" (printf "%s.enable_domain" $key) "value" "true") }}
{{- end }}
{{- $mergedParams := concat ($cfg.parameters | default list) $extraParams }}
{{- if and $cfg.enable $cfg.enable_preview }}
{{- $repo := required (printf "apps.%s.preview.repo is required when enable_preview is true" $key) $p.repo }}
{{- $owner := $p.owner | default "jomakori" }}
{{- $envName := $p.environment | default "production" }}
{{- $label := $p.label | default "preview" }}
{{- $nsTemplate := $p.namespaceTemplate | default (printf "%s-pr{{ .number }}" $kebabKey) }}
{{- /* App-scoped by default: preview hosts for two apps must not collide. */}}
{{- $subdomainTemplate := $p.subdomainTemplate | default (printf "pr{{ .number }}-%s" $kebabKey) }}
{{- $tagTemplate := $p.tagTemplate | default "pr-{{ .number }}" }}
{{- $domain := $p.domain | default ($root.Values.clusterDomain | default "maklab.net") }}
{{- $hostTemplate := printf "%s.%s" $subdomainTemplate $domain }}
{{- $tokenSecretName := $p.tokenSecretName | default (printf "argocd-github-token-%s" $kebabKey) }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "%s-preview" $kebabKey }}
  namespace: {{ $root.Values.argoNamespace | default "argocd" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $cfg.syncWave | default "0" | quote }}
spec:
  goTemplate: true
  generators:
    - pullRequest:
        github:
          owner: {{ $owner | quote }}
          repo: {{ $repo | quote }}
          tokenRef:
            secretName: {{ $tokenSecretName | quote }}
            key: {{ $p.tokenSecretKey | default "token" | quote }}
          # Label gate: applied by the app repo's image workflow, and only after
          # its push succeeded — so no preview references an unbuilt tag.
          labels:
            - {{ $label | quote }}
        requeueAfterSeconds: {{ $p.requeueAfterSeconds | default 60 }}
  template:
    metadata:
      name: {{ $nsTemplate | quote }}
      labels:
        app.kubernetes.io/name: {{ $key | quote }}
        app.kubernetes.io/part-of: {{ $kebabKey | quote }}
      annotations:
        preview-url: {{ printf "https://%s" $hostTemplate | quote }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ $cfg.argoProject | default ($root.Values.argoProject | default "default") }}
      source:
        repoURL: {{ $root.Values.repoUrl | quote }}
        targetRevision: {{ $root.Values.targetRevision | default "main" | quote }}
        path: {{ $cfg.helmPath | quote }}
        helm:
          valueFiles:
            - values.yaml
          parameters:
            {{- range $mergedParams }}
            - name: {{ .name }}
              value: {{ tpl .value $root | quote }}
            {{- end }}
            - name: {{ printf "%s.environments.%s.tag" $key $envName }}
              value: {{ $tagTemplate | quote }}
            - name: {{ printf "%s.environments.%s.subdomain" $key $envName }}
              value: {{ $subdomainTemplate | quote }}
            - name: {{ printf "%s.namespaceOverride" $key }}
              value: {{ $nsTemplate | quote }}
            # The Application owns its namespace, so closing the PR prunes both.
            - name: {{ printf "%s.createNamespace" $key }}
              value: "true"
      destination:
        server: {{ $root.Values.clusterServer | default "https://kubernetes.default.svc" | quote }}
        namespace: {{ $nsTemplate | quote }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  syncPolicy:
    preserveResourcesOnDeletion: false
{{- end }}

{{- $s := $cfg.staging | default dict }}
{{- if and $cfg.enable $s.enable }}
{{- $repo := required (printf "apps.%s.preview.repo is required when staging.enable is true" $key) $p.repo }}
{{- $owner := $p.owner | default "jomakori" }}
{{- $envName := $s.environment | default "staging" }}
{{- $label := $s.label | default "staging" }}
{{- $appName := $s.name | default (printf "%s-%s" $kebabKey $envName) }}
{{- $tagTemplate := $s.tagTemplate | default "pr-{{ .number }}" }}
{{- $tokenSecretName := $p.tokenSecretName | default (printf "argocd-github-token-%s" $kebabKey) }}
{{- $namespace := $s.namespace | default (printf "%s-%s" $kebabKey $envName) }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ printf "%s-%s" $kebabKey $envName }}
  namespace: {{ $root.Values.argoNamespace | default "argocd" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $cfg.syncWave | default "0" | quote }}
spec:
  goTemplate: true
  generators:
    - pullRequest:
        github:
          owner: {{ $owner | quote }}
          repo: {{ $repo | quote }}
          tokenRef:
            secretName: {{ $tokenSecretName | quote }}
            key: {{ $p.tokenSecretKey | default "token" | quote }}
          labels:
            - {{ $label | quote }}
        requeueAfterSeconds: {{ $s.requeueAfterSeconds | default 60 }}
  template:
    metadata:
      name: {{ $appName | quote }}
      labels:
        app.kubernetes.io/name: {{ $key | quote }}
        app.kubernetes.io/part-of: {{ $kebabKey | quote }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ $cfg.argoProject | default ($root.Values.argoProject | default "default") }}
      source:
        repoURL: {{ $root.Values.repoUrl | quote }}
        targetRevision: {{ $root.Values.targetRevision | default "main" | quote }}
        path: {{ $cfg.helmPath | quote }}
        helm:
          valueFiles:
            - values.yaml
          parameters:
            {{- range $mergedParams }}
            - name: {{ .name }}
              value: {{ tpl .value $root | quote }}
            {{- end }}
            - name: {{ printf "%s.enable_staging" $key }}
              value: "true"
            - name: {{ printf "%s.enable_production" $key }}
              value: "false"
            - name: {{ printf "%s.environments.%s.tag" $key $envName }}
              value: {{ $tagTemplate | quote }}
      destination:
        server: {{ $root.Values.clusterServer | default "https://kubernetes.default.svc" | quote }}
        namespace: {{ $namespace | quote }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  syncPolicy:
    preserveResourcesOnDeletion: false
{{- $ph := $s.placeholder | default dict }}
{{- if $ph.enable }}
{{- $phAppName := $ph.name | default (printf "%s-%s-placeholder" $kebabKey $envName) }}
{{- $phRepo := $ph.stateRepoURL | default (printf "https://github.com/%s/%s" $owner $repo) }}
{{- $phBranch := required (printf "apps.%s.staging.placeholder.stateBranch is required" $key) $ph.stateBranch }}
{{- $phPath := required (printf "apps.%s.staging.placeholder.statePath is required" $key) $ph.statePath }}
---
# Placeholder for the staging host. This generator yields an item only while the
# marker directory exists on the state branch, and CI creates it exactly while no
# open pull request carries the staging label -- so the host has one claimant at a
# time: this placeholder and the staging environment never coexist (the older
# VirtualService would keep the host, see services/helm/splash).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $phAppName }}
  namespace: {{ $root.Values.argoNamespace | default "argocd" }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $cfg.syncWave | default "0" | quote }}
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: {{ $phRepo | quote }}
        revision: {{ $phBranch | quote }}
        directories:
          - path: {{ $phPath | quote }}
        requeueAfterSeconds: {{ $s.requeueAfterSeconds | default 60 }}
  template:
    metadata:
      name: {{ $phAppName | quote }}
      labels:
        app.kubernetes.io/name: {{ $key | quote }}
        app.kubernetes.io/part-of: {{ $kebabKey | quote }}
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ $cfg.argoProject | default ($root.Values.argoProject | default "default") }}
      source:
        repoURL: {{ $root.Values.repoUrl | quote }}
        targetRevision: {{ $root.Values.targetRevision | default "main" | quote }}
        path: {{ $ph.helmPath | default "services/helm/splash/" | quote }}
      destination:
        server: {{ $root.Values.clusterServer | default "https://kubernetes.default.svc" | quote }}
        namespace: {{ $ph.namespace | default "istio-system" | quote }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  syncPolicy:
    preserveResourcesOnDeletion: false
{{- end }}
{{- end }}
{{- end }}
