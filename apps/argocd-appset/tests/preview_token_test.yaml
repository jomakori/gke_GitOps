suite: preview generator token
templates:
  - templates/preview-token.yaml
tests:
  - it: provisions the generator token for the opted-in app
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: argocd-github-token-openkite
      - equal:
          path: metadata.namespace
          value: argocd
      - equal:
          path: spec.secretStoreRef.name
          value: doppler-svc-argocd
      - equal:
          path: spec.target.name
          value: argocd-github-token-openkite
      - equal:
          path: spec.data[0].remoteRef.key
          value: ARGOCD_GITHUB_TOKEN

  - it: provisions nothing when no app has opted in
    set:
      apps.openkite.enable_preview: false
    asserts:
      - hasDocuments:
          count: 0
