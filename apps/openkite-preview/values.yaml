# ───────────────────────────────────────────────────────────────────────────
# Global values — injected by the top-level app-of-apps Application
# (Terraform), same contract as apps/argocd-appset/values.yaml.
# ───────────────────────────────────────────────────────────────────────────
argoNamespace: ""
argoProject: ""
clusterDomain: ""
clusterName: ""
clusterServer: ""
repoUrl: ""
storageClass: ""
targetRevision: ""

# ───────────────────────────────────────────────────────────────────────────
# OpenKite PR preview
# ───────────────────────────────────────────────────────────────────────────
# ApplicationSet name (one resource fans out one Application per open PR).
appName: openkite-preview

# Shared preview namespace — the resources that must exist exactly once and must
# outlive every PR: the generator's GitHub token Secret (templates/
# externalsecret.yaml). Owned by this chart's Application, never by a generated
# per-PR Application.
#
# Routing and TLS deliberately do NOT live here. Previews are served by the
# cluster's own `istio-system/maklab-gateway` (hosts `*.maklab.net`) with the
# `wildcard-maklab-net-tls` Secret that gateway already holds, so a preview needs
# no gateway, no Certificate and no Secret of its own.
namespace: openkite-preview

# Destination namespace for each generated preview Application: one namespace
# per PR. The preview namespace is rendered by the workload chart
# (`namespace.create=true`) rather than created by ArgoCD's CreateNamespace sync
# option, because CreateNamespace creates a namespace the Application does not
# track — deleting the Application then prunes the Deployment/Service/
# VirtualService but strands the namespace. Declared in the chart, the namespace
# is a managed resource and goes with everything else.
namespaceTemplate: "openkite-preview-{{ .number }}"

# GitHub Pull Request generator source.
github:
  owner: jomakori
  repo: openkite
  # Read by the ApplicationSet tokenRef below. The Secret is produced by this
  # chart's own ExternalSecret (templates/externalsecret.yaml), which lives with
  # the generator that consumes it — the convention every other ExternalSecret
  # in this repo follows. The token value is never in this repo.
  tokenSecretName: argocd-github-token
  tokenSecretKey: token

# GitHub token consumed by the Pull Request generator above.
# Populate Doppler devops/svc_argocd/ARGOCD_GITHUB_TOKEN with a fine-grained PAT
# scoped to jomakori/openkite, permission Pull requests: Read. The
# ClusterSecretStore `doppler-svc-argocd` comes from services/helm/external-secrets.
githubToken:
  secretName: argocd-github-token
  secretKey: token
  remoteKey: ARGOCD_GITHUB_TOKEN
  dopplerConfig: svc_argocd
  refreshInterval: 24h

# Image gate - the ONLY label that makes a PR eligible for a preview.
# jomakori/openkite's .github/workflows/pr-image.yml applies it when (and only
# when) ghcr.io/jomakori/openkite:pr-<N> was pushed, and removes it when a new
# head's build fails. A PR that never produced an image renders no Application
# here at all, so nothing is deployed for it.
#
# Do NOT apply it by hand to opt a PR in: the label is a claim that the image
# exists, not a request to build one. A hand-applied label for a PR whose image
# was never pushed puts the preview back in the ImagePullBackOff state the gate
# removes. Unlabelling a PR tears its preview down on the next reconcile.
previewLabel: preview

# Helm chart rendered for each open PR (lives in this repo).
chartPath: apps/helm/openkite-preview

# goTemplate strings evaluated by the ApplicationSet controller (NOT Helm):
#   {{ .number }} is the numeric PR id — always DNS-safe (sanitized by nature).
#
# The host is ONE label under the zone (`pr131-openkite.maklab.net`), which is
# what makes the preview edge work without buying anything: Universal SSL covers
# the zone apex plus a single subdomain level, and the cluster's own
# `*.maklab.net` wildcard Certificate covers the same depth. A two-level host
# (`pr-131.openkite.maklab.net`) is served no certificate at all — Universal SSL
# stops at one level and Total TLS does not issue for Tunnel hostnames — so it
# needs a paid Advanced Certificate Manager subscription for the zone.
#
# The PR id leads the label so a preview URL sorts and reads by PR, and the
# shape stays one wildcard away from a Cloudflare Access application
# (`pr*-openkite.maklab.net` — one wildcard per label is allowed).
nameTemplate: "openkite-preview-{{ .number }}"
hostTemplate: "pr{{ .number }}-openkite.maklab.net"
tagTemplate: "pr-{{ .number }}"

# Image consumed by each preview (published by OKT-74 as :pr-<N>).
image:
  repository: ghcr.io/jomakori/openkite

# Preview replica count.
replicaCount: 1

# How often the Pull Request generator is re-evaluated (seconds).
requeueAfterSeconds: 60
