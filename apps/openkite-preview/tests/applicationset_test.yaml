suite: test openkite-preview ApplicationSet
templates:
  - applicationset.yaml
tests:
  - it: generates one Application per open PR via the GitHub Pull Request generator
    asserts:
      - isKind:
          of: ApplicationSet
      - equal:
          path: spec.goTemplate
          value: true
      - equal:
          path: metadata.namespace
          value: argocd
      - equal:
          path: spec.generators[0].pullRequest.github.owner
          value: jomakori
      - equal:
          path: spec.generators[0].pullRequest.github.repo
          value: openkite
      - equal:
          path: spec.generators[0].pullRequest.github.tokenRef.secretName
          value: argocd-github-token

  - it: gates previews on the PR label the image build applies, and nothing else
    asserts:
      - equal:
          path: spec.generators[0].pullRequest.github.labels
          value:
            - preview
      - lengthEqual:
          path: spec.generators[0].pullRequest.github.labels
          count: 1

  - it: renders the gate label from one value so the gate has a single source
    set:
      previewLabel: preview-gate
    asserts:
      - equal:
          path: spec.generators[0].pullRequest.github.labels[0]
          value: preview-gate

  - it: names each Application from the sanitized numeric PR id and cascade-deletes on close
    asserts:
      - equal:
          path: spec.template.metadata.name
          value: "openkite-preview-{{ .number }}"
      - equal:
          path: spec.template.metadata.finalizers[0]
          value: resources-finalizer.argocd.argoproj.io
      - equal:
          path: spec.syncPolicy.preserveResourcesOnDeletion
          value: false

  - it: injects the pr-<N> image tag and the one-level preview host
    asserts:
      - equal:
          path: spec.template.spec.source.helm.parameters[2].name
          value: image.tag
      - equal:
          path: spec.template.spec.source.helm.parameters[2].value
          value: "pr-{{ .number }}"
      - equal:
          path: spec.template.spec.source.helm.parameters[3].name
          value: ingress.host
      - equal:
          path: spec.template.spec.source.helm.parameters[3].value
          value: "pr{{ .number }}-openkite.maklab.net"

  - it: keeps the preview host at ONE label under the zone so standard cert coverage applies
    # A two-level host (pr-<N>.openkite.maklab.net) is served no certificate at the
    # Cloudflare edge — Universal SSL covers the apex plus a single label, and Total
    # TLS skips Tunnel hostnames — which silently breaks the Access gate. The label
    # count is the property that keeps the preview edge free; assert it directly.
    asserts:
      - equal:
          path: spec.template.spec.source.helm.parameters[3].value
          value: "pr{{ .number }}-openkite.maklab.net"
      - notMatchRegex:
          path: spec.template.spec.source.helm.parameters[3].value
          pattern: '\.openkite\.maklab\.net$'
      - notMatchRegex:
          path: spec.template.spec.source.helm.parameters[3].value
          pattern: '\*'

  - it: deploys each preview into its own per-PR namespace
    asserts:
      - equal:
          path: spec.template.spec.destination.namespace
          value: "openkite-preview-{{ .number }}"
      - equal:
          path: spec.template.spec.source.helm.parameters[5].name
          value: namespace.create
      - equal:
          path: spec.template.spec.source.helm.parameters[5].value
          value: "true"

  - it: renders no per-PR Ingress, so no path reaches the pod without the Access challenge
    asserts:
      - equal:
          path: spec.template.spec.source.helm.parameters[6].name
          value: ingress.enabled
      - equal:
          path: spec.template.spec.source.helm.parameters[6].value
          value: "false"

  - it: keeps the shared infra namespace separate from the per-PR destinations
    asserts:
      - notEqual:
          path: spec.template.spec.destination.namespace
          value: openkite-preview
