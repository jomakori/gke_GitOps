# ── ApplicationSet: one preview Application per eligible Pull Request ──────
# The Pull Request generator lists open PRs on jomakori/openkite (via the
# repo-scoped token OKT-76 provisions as ExternalSecret `argocd-github-token`)
# and admits only those carrying the image-gate label (Values.previewLabel).
# Each admitted item renders the openkite-preview chart with:
#   image     → ghcr.io/jomakori/openkite:pr-<N>   (OKT-74 publishes this tag)
#   host      → pr-<N>.openkite.maklab.net
#   namespace → openkite-preview-<N>   (its own, see Values.namespaceTemplate)
# When a PR closes, merges, or loses the label, the generator drops the item,
# the generated Application is deleted, and its `resources-finalizer` cascades
# deletion of the namespace and every resource in it. Nothing is ever written
# back to the repo/main.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.appName | default "openkite-preview" }}
  namespace: {{ .Values.argoNamespace | default "argocd" }}
  labels:
    {{- include "openkite-preview.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # goTemplate enables Go-template fields below. The placeholders live in
  # values.yaml as plain strings, so Helm leaves them untouched.
  goTemplate: true
  generators:
    - pullRequest:
        github:
          owner: {{ .Values.github.owner | quote }}
          repo: {{ .Values.github.repo | quote }}
          tokenRef:
            secretName: {{ .Values.github.tokenSecretName | quote }}
            key: {{ .Values.github.tokenSecretKey | quote }}
          # Image gate: only a PR carrying this label becomes a preview. The
          # label is applied by jomakori/openkite's `pr-image` workflow after it
          # pushes ghcr.io/jomakori/openkite:pr-<N>, and withdrawn when no image
          # was published - so a preview can never reference an image that was
          # never built (the ImagePullBackOff the unfiltered appset produced for
          # PRs 132/133). The controller filters the open-PR list client-side
          # (applicationset/services/pull_request/github.go, containLabels):
          # every label listed here must be present on the PR.
          labels:
            - {{ .Values.previewLabel | quote }}
        requeueAfterSeconds: {{ .Values.requeueAfterSeconds }}
  template:
    metadata:
      # Numeric PR id → always DNS-1123 safe (sanitized by construction).
      name: {{ .Values.nameTemplate | quote }}
      labels:
        app.kubernetes.io/name: {{ .Values.appName | default "openkite-preview" }}
        app.kubernetes.io/part-of: openkite
      annotations:
        openkite.maklab.net/preview-url: {{ printf "https://%s" .Values.hostTemplate | quote }}
      # Without this finalizer the Application would be removed but its
      # namespace-scoped resources would be orphaned on PR close.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.argoProject | default "default" }}
      source:
        repoURL: {{ .Values.repoUrl | quote }}
        targetRevision: {{ .Values.targetRevision | default "main" | quote }}
        path: {{ .Values.chartPath | quote }}
        helm:
          valueFiles:
            - values.yaml
          parameters:
            # Per-PR release name: openkite-preview-<N> (uniquely names the
            # Deployment/Service/VirtualService inside the per-PR namespace).
            - name: fullnameOverride
              value: {{ .Values.nameTemplate | quote }}
            - name: image.repository
              value: {{ .Values.image.repository | quote }}
            - name: image.tag
              value: {{ .Values.tagTemplate | quote }}
            - name: ingress.host
              value: {{ .Values.hostTemplate | quote }}
            - name: replicaCount
              value: {{ .Values.replicaCount | quote }}
            # Each preview owns its namespace, so closing the PR prunes the
            # namespace along with the Deployment/Service/VirtualService.
            - name: namespace.create
              value: "true"
            # No per-PR Ingress: an Ingress's TLS Secret has to live in the
            # Ingress's OWN namespace, and the wildcard Secret is issued once in
            # the shared preview namespace. TLS is terminated at the shared Istio
            # Gateway (credentialName from that namespace), which is the only
            # external path into a preview anyway.
            - name: ingress.enabled
              value: "false"
      destination:
        server: {{ .Values.clusterServer | default "https://kubernetes.default.svc" | quote }}
        # One namespace per PR, not one shared namespace with per-PR resource
        # names. The per-PR namespace is what makes teardown complete: the
        # generated Application owns the Namespace resource (namespace.create),
        # so the resources finalizer prunes namespace + Deployment + Service +
        # VirtualService together. Infrastructure that must exist exactly once —
        # wildcard Certificate, Istio Gateway, generator token — stays in
        # .Values.namespace, owned by this chart.
        namespace: {{ .Values.namespaceTemplate | quote }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # NOTE: deliberately NO `managedNamespaceMetadata` here. The per-PR
        # namespace belongs to the workload chart (namespace.create=true), which
        # declares it with its `istio.io/dataplane-mode: ambient` label as an
        # ordinary managed resource — so it is pruned with the preview, and no
        # Application asserts metadata on a namespace another one owns. The
        # resources that must not be pruned, the wildcard Certificate and the
        # Gateway, live in the shared namespace owned by THIS chart.
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  syncPolicy:
    # Do not preserve resources when the ApplicationSet no longer owns an
    # Application (PR closed) — combined with the finalizer above this is what
    # makes cleanup automatic.
    preserveResourcesOnDeletion: false
