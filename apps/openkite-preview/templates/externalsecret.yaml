# ArgoCD repo-scoped GitHub token for the Pull Request generator above.
#
# Produces Secret `argocd-github-token` (key `token`) in the argocd namespace,
# which the ApplicationSet `tokenRef` reads. Defined here rather than in a chart
# of its own so it sits with its only consumer — the convention followed by
# every other ExternalSecret in this repo (plane, pg-main, openagent, opendesign,
# excalidash, ...), none of which has a standalone secret chart.
#
# The value comes from Doppler devops/svc_argocd/ARGOCD_GITHUB_TOKEN via the
# ClusterSecretStore `doppler-svc-argocd` (services/helm/external-secrets).
# Nothing secret is stored in this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.githubToken.secretName }}
  # Explicitly the argocd namespace: that is where the ApplicationSet lives and
  # where its tokenRef looks. Not .Release.Namespace, which follows the parent.
  namespace: {{ .Values.argoNamespace | default "argocd" }}
  labels:
    {{- include "openkite-preview.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.githubToken.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-{{ .Values.githubToken.dopplerConfig | replace "_" "-" }}
  target:
    name: {{ .Values.githubToken.secretName }}
    creationPolicy: Owner
  # The generator reads a fixed key name (`token`), so map the descriptive
  # Doppler key onto it. Same explicit-mapping exception as cloudflare-tunnel
  # (TUNNEL_TOKEN -> token): a dataFrom.find of ".*" would only be right if the
  # Doppler key were itself named `token`.
  data:
    - secretKey: {{ .Values.githubToken.secretKey }}
      remoteRef:
        key: {{ .Values.githubToken.remoteKey }}
