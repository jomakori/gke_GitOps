# ── Shared preview infrastructure namespace ────────────────────────────────
# Holds only what must exist exactly once and outlive every PR: the wildcard TLS
# Secret (issued from certificate.yaml), the Istio Gateway, and the generator's
# GitHub token Secret. Preview workloads do NOT deploy here — each generated
# per-PR Application has its own namespace (Values.namespaceTemplate), rendered
# by the workload chart so it is pruned when the PR closes.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    istio.io/dataplane-mode: ambient
    app.kubernetes.io/part-of: openkite
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
