apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opendesign.fullname" . }}
  labels: {{- include "opendesign.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.class }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
