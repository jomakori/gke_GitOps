apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opendesign.fullname" . }}
  labels: {{- include "opendesign.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opendesign.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opendesign.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1001
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "opendesign.fullname" . }}
        - name: tmp
          emptyDir: {}
      containers:
        - name: {{ include "opendesign.name" . }}
          image: {{ .Values.image.repository | default "ghcr.io/nexu-io/od" }}:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          envFrom:
            - configMapRef:
                name: {{ include "opendesign.fullname" . }}
          env:
            - name: OD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opendesign.fullname" . }}
                  key: OD_API_TOKEN
                  optional: true
            {{- if .Values.agents.codex.OPENAI_BASE_URL }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.agents.codex.OPENAI_BASE_URL | quote }}
            {{- else if .Values.provider.endpoint }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.provider.endpoint | quote }}
            {{- end }}
            {{- if .Values.agents.codex.OPENAI_API_KEY }}
            - name: CODEX_API_KEY
              value: {{ .Values.agents.codex.OPENAI_API_KEY | quote }}
            {{- else }}
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opendesign.fullname" . }}
                  key: CODEX_API_KEY
                  optional: true
            {{- end }}
            {{- if .Values.agents.claude.ANTHROPIC_BASE_URL }}
            - name: ANTHROPIC_BASE_URL
              value: {{ .Values.agents.claude.ANTHROPIC_BASE_URL | quote }}
            {{- else if .Values.provider.endpoint }}
            - name: ANTHROPIC_BASE_URL
              value: {{ .Values.provider.endpoint | quote }}
            {{- end }}
            {{- if .Values.agents.claude.ANTHROPIC_API_KEY }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opendesign.fullname" . }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: 7456
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/.od
            - name: tmp
              mountPath: /tmp
          resources: {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.enable_auth_proxy }}
        - name: auth-proxy
          image: nginxinc/nginx-unprivileged:1.25-alpine-slim
          ports:
            - name: http-proxy
              containerPort: 8080
          env:
            - name: PROXY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opendesign.fullname" . }}
                  key: OD_API_TOKEN
                  optional: true
          volumeMounts:
            - name: proxy-tmp
              mountPath: /tmp
      {{- end }}
      initContainers:
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /app/.od/app-config.json ]; then
                printf '%%s
' '{' > /app/.od/app-config.json
                printf '%%s
' '  "agentCliEnv": {' >> /app/.od/app-config.json
                printf '%%s
' '    "codex": {' >> /app/.od/app-config.json
                printf '  "OPENAI_BASE_URL": "%s",
' "{{ .Values.provider.endpoint }}" >> /app/.od/app-config.json
                printf '%%s
' '      "CODEX_API_KEY": "seeded-by-helm"' >> /app/.od/app-config.json
                printf '%%s
' '    },' >> /app/.od/app-config.json
                printf '%%s
' '    "claude": {' >> /app/.od/app-config.json
                printf '  "ANTHROPIC_BASE_URL": "%s"
' "{{ .Values.provider.endpoint }}" >> /app/.od/app-config.json
                printf '%%s
' '    }' >> /app/.od/app-config.json
                printf '%%s
' '  }' >> /app/.od/app-config.json
                printf '%%s
' '}' >> /app/.od/app-config.json
                echo "Seeded agent config from Helm"
              else
                echo "app-config.json exists, skipping"
              fi
          volumeMounts:
            - name: data
              mountPath: /app/.od
      {- end }
