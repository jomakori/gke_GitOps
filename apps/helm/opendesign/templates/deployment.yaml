apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opendesign.fullname" . }}
  labels: {{- include "opendesign.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opendesign.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opendesign.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1001
      initContainers:
        - name: install-codex
          image: node:24-alpine
          command:
            - sh
            - -c
            - |
              npm install --prefix /opt/codex @openai/codex@0.145.0 2>&1 | tail -5
              ln -sf /opt/codex/node_modules/.bin/codex /usr/local/bin/codex
              chown -R 1001:1001 /opt/codex
              mkdir -p /home/open-design && chown 1001:1001 /home/open-design
              echo "Codex CLI installed"
          volumeMounts:
            - name: codex
              mountPath: /opt/codex
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              # Always ensure Codex config exists with app_server disabled
              mkdir -p /app/.od/codex
              chmod 775 /app/.od/codex
              chown 1001:1001 /app/.od/codex
               printf '' > /app/.od/codex/config.toml
               printf 'openai_base_url = "http://openagent-hermes-api.openagent.svc.cluster.local:8642/v1"\n' >> /app/.od/codex/config.toml
               printf 'model = "hermes-agent"\n' >> /app/.od/codex/config.toml
               echo "Seeded Codex config (Hermes API)"

              if [ ! -f /app/.od/app-config.json ]; then
                printf '{\n' > /app/.od/app-config.json
                printf '  "onboardingCompleted": true,\n' >> /app/.od/app-config.json
                printf '  "agentId": "codex",\n' >> /app/.od/app-config.json
                printf '  "agentCliEnv": {\n' >> /app/.od/app-config.json
                printf '    "codex": {\n' >> /app/.od/app-config.json
                printf '      "OPENAI_BASE_URL": "%s",\n' "{{ .Values.provider.endpoint }}" >> /app/.od/app-config.json
                printf '      "CODEX_API_KEY": "%s"\n' "$CODEX_API_KEY" >> /app/.od/app-config.json
                printf '    },\n' >> /app/.od/app-config.json
                printf '    "claude": {\n' >> /app/.od/app-config.json
                printf '      "ANTHROPIC_BASE_URL": "%s"\n' "{{ .Values.provider.endpoint }}" >> /app/.od/app-config.json
                printf '    }\n' >> /app/.od/app-config.json
                printf '  }\n' >> /app/.od/app-config.json
                printf '}\n' >> /app/.od/app-config.json
                echo "Seeded agent config from Helm"
              else
                echo "app-config.json exists, skipping"
              fi
          env:
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opendesign-secrets
                  key: LITELLM_MASTER_KEY
          volumeMounts:
            - name: data
              mountPath: /app/.od
      {{- if .Values.enable_auth_proxy }}
        - name: auth-proxy-init
          image: nginxinc/nginx-unprivileged:1.25-alpine-slim
          command: ["sh", "-c", "printf '%s\n' 'server { listen 8080; location / { proxy_pass http://127.0.0.1:7456; proxy_set_header Authorization "Bearer ${PROXY_API_TOKEN}"; } }' > /etc/nginx/conf.d/default.conf"]
          env:
            - name: PROXY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opendesign.fullname" . }}
                  key: OD_API_TOKEN
                  optional: true
      {{- end }}
      volumes:
        - name: codex
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "opendesign.fullname" . }}
        - name: tmp
          emptyDir: {}
        - name: default-skill
          configMap:
            name: opendesign-default-skill
        - name: design-skills
          configMap:
            name: opendesign-skills
      containers:
        - name: {{ include "opendesign.name" . }}
          image: {{ .Values.image.repository | default "ghcr.io/nexu-io/od" }}:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    sleep 10
                    for i in 1 2 3 4 5; do
                      wget -qO- --post-data='{}' --header='Content-Type: application/json' \
                        http://127.0.0.1:7456/api/library/ingest \
                        2>/dev/null && break
                      sleep 5
                    done &
          envFrom:
            - configMapRef:
                name: {{ include "opendesign.fullname" . }}
          env:
            - name: HOME
              value: /app/.od
            - name: CODEX_HOME
              value: /app/.od/codex
            - name: PATH
              value: "/opt/codex/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: OD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opendesign.fullname" . }}
                  key: OD_API_TOKEN
                  optional: true
            {{- if .Values.agents.codex.OPENAI_BASE_URL }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.agents.codex.OPENAI_BASE_URL | quote }}
            {{- else if .Values.provider.endpoint }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.provider.endpoint | quote }}
            {{- end }}
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opendesign-secrets
                  key: LITELLM_MASTER_KEY
                  optional: true
            {{- if .Values.agents.claude.ANTHROPIC_BASE_URL }}
            - name: ANTHROPIC_BASE_URL
              value: {{ .Values.agents.claude.ANTHROPIC_BASE_URL | quote }}
            {{- else if .Values.provider.endpoint }}
            - name: ANTHROPIC_BASE_URL
              value: {{ .Values.provider.endpoint | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 7456
              protocol: TCP
          volumeMounts:
            - name: codex
              mountPath: /opt/codex
            - name: data
              mountPath: /app/.od
            - name: tmp
              mountPath: /tmp
            - name: default-skill
              mountPath: /app/.od/skills/default
            - name: design-skills
              mountPath: /app/.od/skills/design-taste-frontend/SKILL.md
              subPath: design-taste-frontend.SKILL.md
            - name: design-skills
              mountPath: /app/.od/skills/reference-design-contract/SKILL.md
              subPath: reference-design-contract.SKILL.md
            - name: design-skills
              mountPath: /app/.od/skills/impeccable-design-polish/SKILL.md
              subPath: impeccable-design-polish.SKILL.md
            - name: design-skills
              mountPath: /app/.od/skills/artifacts-builder/SKILL.md
              subPath: artifacts-builder.SKILL.md
            - name: design-skills
              mountPath: /app/.od/skills/design-md/SKILL.md
              subPath: design-md.SKILL.md
            - name: tmp
              mountPath: /tmp
          resources: {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.enable_auth_proxy }}
        - name: auth-proxy
          image: nginxinc/nginx-unprivileged:1.25-alpine-slim
          ports:
            - name: http-proxy
              containerPort: 8080
          env:
            - name: PROXY_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opendesign.fullname" . }}
                  key: OD_API_TOKEN
                  optional: true
          volumeMounts:
            - name: proxy-tmp
              mountPath: /tmp
      {{- end }}
