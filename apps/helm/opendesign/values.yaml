# Single source of truth for the domain
domain: design.maklab.net

# AI provider backend (LiteLLM)
provider:
  endpoint: "http://192.168.1.64:4523/v1"  # direct Mac claude-pipe
  apiKeyRef: "openagent-secrets"
  apiKeyKey: "LITELLM_MASTER_KEY"

# App runtime config — domain is resolved from top-level
config:
  disableApiAuth: 1
  bindHost: "0.0.0.0"
  allowedOrigins: ""
  publicBaseUrl: ""
  apiToken: ""

# Code agent harnesses — empty = template fills from provider
agents:
  codex:
    OPENAI_BASE_URL: ""
    OPENAI_API_KEY: ""
  claude:
    ANTHROPIC_BASE_URL: ""
    ANTHROPIC_API_KEY: ""

# Auth proxy sidecar (disabled = CF Access handles auth)
enable_auth_proxy: false

# Storage
replicaCount: 1
storage:
  size: 10Gi
  class: local-path

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Service
service:
  type: ClusterIP
  port: 80

# Image
image:
  repository: ghcr.io/nexu-io/od
  tag: latest
  pullPolicy: IfNotPresent
