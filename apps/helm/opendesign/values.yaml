# Single source of truth for the domain
domain: design.maklab.net

# AI provider backend (LiteLLM)
provider:
  endpoint: "http://openagent-litellm.openagent.svc.cluster.local:4000/v1"
  apiKeyRef: "openagent-secrets"
  apiKeyKey: "LITELLM_MASTER_KEY"

# App runtime config — domain is resolved from top-level
config:
  disableApiAuth: 1
  bindHost: "127.0.0.1"
  allowedOrigins: ""
  publicBaseUrl: ""
  apiToken: ""

# Code agent harnesses — empty = template fills from provider
agents:
  codex:
    OPENAI_BASE_URL: ""
    OPENAI_API_KEY: ""
  claude:
    ANTHROPIC_BASE_URL: ""
    ANTHROPIC_API_KEY: ""

# Auth proxy sidecar (disabled = CF Access handles auth)
enable_auth_proxy: false

# Storage
replicaCount: 1
storage:
  size: 10Gi
  class: local-path

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Service
service:
  type: ClusterIP
  port: 80

# Image
image:
  repository: ghcr.io/nexu-io/od
  tag: latest
  pullPolicy: IfNotPresent
