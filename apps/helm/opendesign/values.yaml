# OpenDesign — values overrides
# authProxy.enabled=false requires upstream PR #6093

# authProxy:
#   enabled: false
# config:
#   bindHost: "0.0.0.0"

config:
  disableApiAuth: 1
  bindHost: "127.0.0.1"
  allowedOrigins: "https://design.maklab.net"
  publicBaseUrl: "https://design.maklab.net"
  apiToken: "dummy"

replicaCount: 1

persistence:
  enabled: true
  storageClass: "local-path"
  size: 10Gi

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi
