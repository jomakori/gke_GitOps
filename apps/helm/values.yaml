# ┌──────────────────────────────────────────────────────────────────┐
# │ Global Settings — shared across all apps                         │
# └──────────────────────────────────────────────────────────────────┘
clusterDomain: maklab.net
registry: 123456.dkr.ecr.us-east-2.amazonaws.com
storageClass: "local-path"

# ┌──────────────────────────────────────────────────────────────────┐
# │ App Specs — each app is a top-level key                          │
# │ Select which app renders via: --set appName=<key>                │
# │                                                                  │
# │ Conventions (can be overridden per app):                         │
# │   enable_staging : true        (staging ON unless explicitly off)│
# │   subdomain     : <appName>    (prod) / <appName>-staging        │
# │   HPA.minReplicas : service.replicas  (defaults to replicas)     │
# │   enable_db     : {...}        (spec-driven DB — see demoApi)    │
# └──────────────────────────────────────────────────────────────────┘

demoApi:
  enable_staging: true
  enable_istio: true
  enable_db:
    type: postgres
    deployment: cluster
    version: "17"
    storage: 10Gi
  enable_scaling:
    HPA:
      minReplicas: 2
      maxReplicas: 6
    db:
      minInstances: 2
      maxInstances: 5
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: 1.23
    production:
      tag: 1.43
  service:
    port: 3000
    resourceRequests:
      cpu: 256m
      memory: 256Mi
    storage:
      size: 1Gi

notesUi:
  enable_staging: true
  enable_istio: true
  enable_scaling:
    HPA:
      minReplicas: 1
      maxReplicas: 6
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: "pr-7"
    production:
      tag: "1.0.1"
  service:
    port: 8080
    resourceRequests:
      cpu: 100m
      memory: 256Mi
    storage:
      size: 1Gi

openkite:
  enable_staging: true
  enable_istio: true
  # Cloudflare Access gating for openkite.maklab.net and every pr<N>-openkite.maklab.net
  # preview is declared in services/helm/istio/values.yaml `privateHosts`, where the
  # istio Application (destination.namespace: istio-system) renders the DENY policy.
  # OKT-147: do not add an `enable_private` here — it has no effect in this chart
  # (the AuthorizationPolicy would render into istio-system from a non-istio
  # Application and ArgoCD would skip it).
  # ── Cluster access (OKT-159, supersedes OKT-130) ─────────────────────
  # The console reads the cluster with its own ServiceAccount, bound to a
  # read-only ClusterRole rendered below. The Doppler `TAILSCALE_KUBECONFIG`
  # was removed: it was never a scoped credential. The Tailscale operator's
  # API-server proxy runs in auth mode, ignores the file's `token: unused`
  # and impersonates the caller's tailnet identity, which from an in-cluster
  # pod resolves to a user bound to cluster-admin
  # (ClusterRoleBinding/tailnet-user-k8s-admin). Mounting it would have
  # granted the console cluster-admin. See OKT-159.
  # `list secrets` does return values rather than keys — that exposure is
  # accepted here and is strictly smaller than the cluster-admin it replaces.
  #
  # OKT-178 makes that identity explicit and complete:
  #  * the Deployment now sets `automountServiceAccountToken: true` for a
  #    clusterRead host, so "the kubeconfig mount is gone, the pod's own
  #    projected SA token is the identity" is stated in the manifest rather
  #    than inherited from the API-server default;
  #  * the ClusterRole grants `get` alongside `list`/`watch` on the watched
  #    kinds, because the console's bridge performs single-object reads
  #    (`get_resource`) as well as reflector lists — without it every
  #    detail/open read 403s.
  # Previews still render none of this: they run unreviewed PR code.
  clusterRead: true
  # GHCR, not the shared ECR registry.
  image:
    repository: ghcr.io/jomakori/openkite
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: v0.33.0
      subdomain: staging-openkite
    production:
      # Released image; the pin-bump workflow rewrites this on every release.
      tag: v0.52.0
  service:
    # Container port: the Service is 80 and routes here.
    port: 8080
    resourceRequests:
      cpu: 100m
      memory: 128Mi
    resourceLimits:
      memory: 512Mi
