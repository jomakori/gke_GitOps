# ┌──────────────────────────────────────────────────────────────────┐
# │ Global Settings — shared across all apps                         │
# └──────────────────────────────────────────────────────────────────┘
clusterDomain: maklab.net
registry: 123456.dkr.ecr.us-east-2.amazonaws.com
storageClass: "local-path"

# ┌──────────────────────────────────────────────────────────────────┐
# │ App Specs — each app is a top-level key                          │
# │ Select which app renders via: --set appName=<key>                │
# │                                                                  │
# │ Conventions (can be overridden per app):                         │
# │   enable_staging : true        (staging ON unless explicitly off)│
# │   subdomain     : <appName>    (prod) / <appName>-staging        │
# │   HPA.minReplicas : service.replicas  (defaults to replicas)     │
# │   enable_db     : {...}        (spec-driven DB — see demoApi)    │
# └──────────────────────────────────────────────────────────────────┘

demoApi:
  enable_staging: true
  enable_istio: true
  enable_db:
    type: postgres
    deployment: cluster
    version: "17"
    storage: 10Gi
  enable_scaling:
    HPA:
      minReplicas: 2
      maxReplicas: 6
    db:
      minInstances: 2
      maxInstances: 5
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: 1.23
    production:
      tag: 1.43
  service:
    port: 3000
    resourceRequests:
      cpu: 256m
      memory: 256Mi
    storage:
      size: 1Gi

notesUi:
  enable_staging: true
  enable_istio: true
  enable_scaling:
    HPA:
      minReplicas: 1
      maxReplicas: 6
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: "pr-7"
    production:
      tag: "1.0.1"
  service:
    port: 8080
    resourceRequests:
      cpu: 100m
      memory: 256Mi
    storage:
      size: 1Gi

openkite:
  enable_staging: true
  enable_istio: true
  # Cloudflare Access gating for openkite.maklab.net and every pr<N>-openkite.maklab.net
  # preview is declared in services/helm/istio/values.yaml `privateHosts`, where the
  # istio Application (destination.namespace: istio-system) renders the DENY policy.
  # OKT-147: do not add an `enable_private` here — it has no effect in this chart
  # (the AuthorizationPolicy would render into istio-system from a non-istio
  # Application and ArgoCD would skip it).
  # ── Cluster access (OKT-159; scope widened by DEV-36) ────────────────
  # The console acts on the cluster with its own ServiceAccount, and the scope
  # is per environment: production gets cluster-admin, staging keeps the
  # read-only role, and a preview gets no credential at all. OKT-159 removed the
  # Doppler `TAILSCALE_KUBECONFIG` — it was never a scoped credential: the
  # Tailscale operator's API-server proxy
  # runs in auth mode, ignores the file's `token: unused`, and impersonates the
  # caller's tailnet identity, which from an in-cluster pod resolves to a user
  # bound to cluster-admin (ClusterRoleBinding/tailnet-user-k8s-admin). The SA
  # replaces it with the same reach in production, because this is a
  # single-operator console and read-only cannot act on what it shows.
  # Cloudflare Access gates the hostname only — anything inside the cluster that
  # can reach the console inherits the grant, and so would a bug in it.
  clusterAdmin: true
  # GHCR, not the shared ECR registry.
  image:
    repository: ghcr.io/jomakori/openkite
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: v0.33.0
      subdomain: staging-openkite
    production:
      # Released image; the pin-bump workflow rewrites this on every release.
      tag: v0.43.4
  service:
    # Container port: the Service is 80 and routes here.
    port: 8080
    resourceRequests:
      cpu: 100m
      memory: 128Mi
    resourceLimits:
      memory: 512Mi
