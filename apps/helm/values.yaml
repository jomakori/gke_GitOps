# ┌──────────────────────────────────────────────────────────────────┐
# │ Global Settings — shared across all apps                         │
# └──────────────────────────────────────────────────────────────────┘
clusterDomain: maklab.net
registry: 123456.dkr.ecr.us-east-2.amazonaws.com
storageClass: "local-path"

# ┌──────────────────────────────────────────────────────────────────┐
# │ App Specs — each app is a top-level key                          │
# │ Select which app renders via: --set appName=<key>                │
# │                                                                  │
# │ Conventions (can be overridden per app):                         │
# │   enable_staging : true        (staging ON unless explicitly off)│
# │   subdomain     : <appName>    (prod) / <appName>-staging        │
# │   HPA.minReplicas : service.replicas  (defaults to replicas)     │
# │   enable_db     : {...}        (spec-driven DB — see demoApi)    │
# └──────────────────────────────────────────────────────────────────┘

demoApi:
  enable_staging: true
  enable_istio: true
  enable_db:
    type: postgres
    deployment: cluster
    version: "17"
    storage: 10Gi
  enable_scaling:
    HPA:
      minReplicas: 2
      maxReplicas: 6
    db:
      minInstances: 2
      maxInstances: 5
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: 1.23
    production:
      tag: 1.43
  service:
    port: 3000
    resourceRequests:
      cpu: 256m
      memory: 256Mi
    storage:
      size: 1Gi

notesUi:
  enable_staging: true
  enable_istio: true
  enable_scaling:
    HPA:
      minReplicas: 1
      maxReplicas: 6
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: "pr-7"
    production:
      tag: "1.0.1"
  service:
    port: 8080
    resourceRequests:
      cpu: 100m
      memory: 256Mi
    storage:
      size: 1Gi

openkite:
  # Prod only. Previews re-render this same spec with the environment's tag and
  # subdomain overridden per PR (see apps/argocd-appset/templates/preview.yml),
  # which is the whole point of one spec and two entry points.
  enable_staging: false
  enable_istio: true
  # Cloudflare Access: DENY anything without a valid Access JWT for this host.
  enable_private: true
  # Not the shared ECR registry: openkite publishes to GHCR (release.yml).
  image:
    repository: ghcr.io/jomakori/openkite
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    production:
      # The released image, not a floating tag: this is the value the pin-bump
      # workflow rewrites on every release, and it mirrors the git tag exactly.
      tag: v0.32.1
  service:
    # The container serves on 8080; the Service is port 80 and the VirtualService
    # routes to 80, so the number here is the container/target port.
    port: 8080
    resourceRequests:
      cpu: 100m
      memory: 128Mi
    resourceLimits:
      memory: 256Mi
