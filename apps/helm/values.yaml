# ┌──────────────────────────────────────────────────────────────────┐
# │ Global Settings — shared across all apps                         │
# └──────────────────────────────────────────────────────────────────┘
clusterDomain: maklab.net
registry: 123456.dkr.ecr.us-east-2.amazonaws.com
storageClass: "local-path"

# ┌──────────────────────────────────────────────────────────────────┐
# │ App Specs — each app is a top-level key                          │
# │ Select which app renders via: --set appName=<key>                │
# │                                                                  │
# │ Conventions (can be overridden per app):                         │
# │   enable_staging : true        (staging ON unless explicitly off)│
# │   subdomain     : <appName>    (prod) / <appName>-staging        │
# │   HPA.minReplicas : service.replicas  (defaults to replicas)     │
# │   enable_db     : {...}        (spec-driven DB — enable_db.type:    │
# │                    postgres → SGCluster; see templates/_helpers.tpl)│
# └──────────────────────────────────────────────────────────────────┘

openkite:
  enable_staging: true
  enable_istio: true
  # Cloudflare Access gating for openkite.maklab.net and every pr<N>-openkite.maklab.net
  # preview is declared in services/helm/istio/values.yaml `privateHosts`, where the
  # istio Application (destination.namespace: istio-system) renders the DENY policy.
  # OKT-147: do not add an `enable_private` here — it has no effect in this chart
  # (the AuthorizationPolicy would render into istio-system from a non-istio
  # Application and ArgoCD would skip it).
  # ── Cluster access (OKT-159; scope widened by DEV-36) ────────────────
  # The console acts on the cluster with its own ServiceAccount, and the scope
  # is per environment: production gets cluster-admin, staging keeps the
  # read-only role, and a preview gets no credential at all. OKT-159 removed the
  # Doppler `TAILSCALE_KUBECONFIG` — it was never a scoped credential: the
  # Tailscale operator's API-server proxy
  # runs in auth mode, ignores the file's `token: unused`, and impersonates the
  # caller's tailnet identity, which from an in-cluster pod resolves to a user
  # bound to cluster-admin (ClusterRoleBinding/tailnet-user-k8s-admin). The SA
  # replaces it with the same reach in production, because this is a
  # single-operator console and read-only cannot act on what it shows.
  # Cloudflare Access gates the hostname only — anything inside the cluster that
  # can reach the console inherits the grant, and so would a bug in it.
  clusterAdmin: true
  # GHCR, not the shared ECR registry.
  image:
    repository: ghcr.io/jomakori/openkite
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      # Single-label host: a third DNS label has no certificate under the wildcard.
      subdomain: staging-openkite
      tag: v0.1.0
    production:
      # Released image; the pin-bump workflow rewrites this on every release.
      tag: v0.1.0
  service:
    # Container port: the Service is 80 and routes here.
    port: 8080
    resourceRequests:
      cpu: 100m
      memory: 320Mi
    resourceLimits:
      memory: 640Mi

# Tickerlight console plus the trading-mcp engine it reads from, one pod so the
# journal at /data is a plain shared volume and the console reads it locally.
tickerlight:
  enable_staging: true
  enable_istio: true
  # Gated hosts: trade.maklab.net and staging-trade.maklab.net are declared in
  # services/helm/istio/values.yaml `privateHosts`.
  image:
    repository: ghcr.io/jomakori/tickerlight
  environments:
    staging:
      subdomain: staging-trade
      tag: v0.3.1
      # ── Engine MCP listener: published inside the cluster ──────────────
      # The engine container below binds 127.0.0.1:8090, so only the console
      # in the same pod can reach it. Staging binds the pod address instead,
      # adds a second Service port for it, and admits the `openagent`
      # namespace to that port and nothing else (templates/networkpolicy.yaml).
      # Production declares no `sidecar` block, so it keeps the loopback
      # address, the single console port, and no NetworkPolicy.
      sidecar:
        # Which service.extraContainers entry these settings apply to.
        container: engine
        # Service port published for that container.
        port: 8090
        portName: mcp
        # Namespaces admitted to `port`. Nothing else can reach it.
        fromNamespaces:
          - openagent
        # Env overrides for that container, by name. The shared list keeps the
        # loopback address; this environment replaces it.
        env:
          TRADING_MCP_HTTP_ADDR: "0.0.0.0:8090"
          # The engine refuses a non-loopback bind unless this is the literal
          # `true`, so it is quoted here and stringified by the chart.
          TRADING_MCP_HTTP_ALLOW_NON_LOOPBACK: "true"
        # Alert sink credentials. envFrom already carries every key from the
        # app's ExternalSecret; these two are named explicitly so the contract
        # is visible in the rendered pod, and `optional` keeps a Doppler config
        # without them from blocking startup. No values here, ever.
        secretEnv:
          - TRADING_ALERT_WEBHOOK_URL
          - TRADING_ALERT_WEBHOOK_SECRET
    production:
      subdomain: trade
      tag: v0.3.1
  service:
    port: 8080
    # The console reads the journal and the engine's policy, nothing else. It
    # takes no envFrom, so no Doppler value reaches this web-facing process by
    # bulk; the one key it needs is named below: caps_status is authenticated,
    # and the console calls it over the pod's own loopback.
    envFrom: false
    secretEnv:
      - TRADING_MCP_HTTP_TOKEN
    # Both images are distroless-style non-root (uid 65532). fsGroup makes the
    # claim group-writable so the engine can create the journal.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    resourceRequests:
      cpu: 50m
      memory: 128Mi
    resourceLimits:
      memory: 256Mi
    storage:
      size: 1Gi
      # Journal is written by the engine container and only read here.
      readOnly: true
    # Bind the pod IP, and read the journal the engine writes. The path is the
    # engine's constant; the flag is what turns sample mode off.
    # The judge scorer is the engine's mandatory gate, so it runs in this pod on
    # a loopback listener the engine reaches at 127.0.0.1:8091 and nothing else
    # can reach.
    args:
      - "-addr"
      - "0.0.0.0:8080"
      - "-journal"
      - "/data/journal.jsonl"
      - "-judge-enabled"
    extraContainers:
      # Journal producer. Paths are code constants; -data-dir only points at the
      # mount, and the two containers share the one volume.
      - name: engine
        image: ghcr.io/jomakori/trading-mcp:v0.3.6
        args:
          - "-data-dir"
          - "/data"
        envFromVars: true
        env:
          # Loopback default: the console reaches the engine in the same pod,
          # nothing outside it can. An environment that publishes this port
          # overrides the address through `environments.<env>.sidecar.env`.
          - name: TRADING_MCP_HTTP_ADDR
            value: "127.0.0.1:8090"
        ports:
          - name: mcp
            containerPort: 8090
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 384Mi
