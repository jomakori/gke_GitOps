# ┌──────────────────────────────────────────────────────────────────┐
# │ Global Settings — shared across all apps                         │
# └──────────────────────────────────────────────────────────────────┘
clusterDomain: maklab.net
registry: 123456.dkr.ecr.us-east-2.amazonaws.com
storageClass: "local-path"

# ┌──────────────────────────────────────────────────────────────────┐
# │ App Specs — each app is a top-level key                          │
# │ Select which app renders via: --set appName=<key>                │
# │                                                                  │
# │ Conventions (can be overridden per app):                         │
# │   enable_staging : true        (staging ON unless explicitly off)│
# │   subdomain     : <appName>    (prod) / <appName>-staging        │
# │   HPA.minReplicas : service.replicas  (defaults to replicas)     │
# │   enable_db     : {...}        (spec-driven DB — see demoApi)    │
# └──────────────────────────────────────────────────────────────────┘

demoApi:
  enable_staging: true
  enable_istio: true
  enable_db:
    type: postgres
    deployment: cluster
    version: "17"
    storage: 10Gi
  enable_scaling:
    HPA:
      minReplicas: 2
      maxReplicas: 6
    db:
      minInstances: 2
      maxInstances: 5
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: 1.23
    production:
      tag: 1.43
  service:
    port: 3000
    resourceRequests:
      cpu: 256m
      memory: 256Mi
    storage:
      size: 1Gi

notesUi:
  enable_staging: true
  enable_istio: true
  enable_scaling:
    HPA:
      minReplicas: 1
      maxReplicas: 6
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      tag: "pr-7"
    production:
      tag: "1.0.1"
  service:
    port: 8080
    resourceRequests:
      cpu: 100m
      memory: 256Mi
    storage:
      size: 1Gi

openkite:
  enable_staging: true
  enable_istio: true
  # Cloudflare Access gating for openkite.maklab.net and every pr<N>-openkite.maklab.net
  # preview is declared in services/helm/istio/values.yaml `privateHosts`, where the
  # istio Application (destination.namespace: istio-system) renders the DENY policy.
  # No `enable_private` here: it renders into istio-system from a non-istio
  # Application, which ArgoCD skips.
  # ── Cluster access ────────────────────────────────────────────────────
  # The console reads the cluster with its own ServiceAccount and a read-only
  # ClusterRole. `list secrets` returns values rather than keys — accepted.
  clusterRead: true
  # GHCR, not the shared ECR registry.
  image:
    repository: ghcr.io/jomakori/openkite
  istio:
    gateway: istio-system/maklab-gateway
    requestTimeout: 30s
    retryAttempts: 3
    retryTimeout: 5s
  environments:
    staging:
      # Inside the gated *.openkite.maklab.net wildcard (CF Access + istio privateHosts).
      subdomain: staging.openkite
      tag: v0.52.0
    production:
      # Released image; the pin-bump workflow rewrites this on every release.
      tag: v0.56.0
  service:
    # Container port: the Service is 80 and routes here.
    port: 8080
    resourceRequests:
      cpu: 100m
      memory: 128Mi
    resourceLimits:
      memory: 512Mi
