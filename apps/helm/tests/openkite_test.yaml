suite: openkite workload spec
templates:
  - templates/app.yaml
tests:
  - it: prod runs the released image from GHCR, pinned to the git tag
    documentSelector:
      path: kind
      value: Deployment
    set:
      appName: openkite
    asserts:
      - equal:
          path: metadata.namespace
          value: openkite-production
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jomakori/openkite:v0.32.1
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi

  - it: prod is routed at openkite.maklab.net through the cluster gateway
    documentSelector:
      path: kind
      value: VirtualService
    set:
      appName: openkite
    asserts:
      - equal:
          path: spec.hosts[0]
          value: openkite.maklab.net
      - equal:
          path: spec.gateways[0]
          value: istio-system/maklab-gateway
      - equal:
          path: spec.http[0].route[0].destination.host
          value: openkite-production.openkite-production.svc.cluster.local

  - it: prod is gated behind Cloudflare Access by an exact-host DENY policy
    documentSelector:
      path: kind
      value: AuthorizationPolicy
    set:
      appName: openkite
    asserts:
      - equal:
          path: metadata.name
          value: require-cf-access-openkite-maklab-net
      - equal:
          path: metadata.namespace
          value: istio-system
      - equal:
          path: spec.action
          value: DENY
      - equal:
          path: spec.rules[0].from[0].source.notRequestPrincipals[0]
          value: "*"
      - equal:
          path: spec.rules[0].to[0].operation.hosts[0]
          value: openkite.maklab.net

  - it: a preview render moves tag, host and namespace - nothing else
    documentSelector:
      path: kind
      value: Deployment
    set:
      appName: openkite
      openkite.environments.production.tag: pr-131
      openkite.environments.production.subdomain: pr131
      openkite.namespaceOverride: openkite-pr131
    asserts:
      - equal:
          path: metadata.namespace
          value: openkite-pr131
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/jomakori/openkite:pr-131

  - it: a preview hosts at pr<N>.maklab.net and gates that exact host
    documentSelector:
      path: kind
      value: AuthorizationPolicy
    set:
      appName: openkite
      openkite.environments.production.subdomain: pr131
      openkite.namespaceOverride: openkite-pr131
    asserts:
      - equal:
          path: metadata.name
          value: require-cf-access-pr131-maklab-net
      - equal:
          path: spec.rules[0].to[0].operation.hosts[0]
          value: pr131.maklab.net

  - it: a preview owns its namespace, so closing the PR prunes it
    documentSelector:
      path: kind
      value: Namespace
    set:
      appName: openkite
      openkite.namespaceOverride: openkite-pr131
      openkite.createNamespace: true
    asserts:
      - equal:
          path: metadata.name
          value: openkite-pr131
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: ambient

  - it: an app that is not private renders no Access policy and keeps the shared registry
    documentSelector:
      path: kind
      value: Deployment
    set:
      appName: demoApi
      demoApi.enable_staging: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 123456.dkr.ecr.us-east-2.amazonaws.com/demo-api:1.43
      - notMatchRegex:
          path: metadata.name
          pattern: ^require-cf-access-
