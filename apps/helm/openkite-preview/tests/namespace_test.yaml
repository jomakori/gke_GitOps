suite: test openkite-preview namespace
templates:
  - namespace.yaml
tests:
  - it: renders nothing by default, so a release in a namespace another Application owns never adopts it
    release:
      name: openkite-main
      namespace: openkite-preview
    asserts:
      - hasDocuments:
          count: 0

  - it: declares the release namespace for a per-PR preview, enrolled in the mesh
    release:
      name: openkite-preview-42
      namespace: openkite-preview-42
    set:
      namespace.create: true
      fullnameOverride: openkite-preview-42
    asserts:
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: openkite-preview-42
      - equal:
          path: metadata.labels["istio.io/dataplane-mode"]
          value: ambient
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: openkite

  - it: applies the namespace before the resources that need it
    release:
      name: openkite-preview-42
      namespace: openkite-preview-42
    set:
      namespace.create: true
      fullnameOverride: openkite-preview-42
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
