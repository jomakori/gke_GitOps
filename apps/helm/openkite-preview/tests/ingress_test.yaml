suite: test openkite-preview ingress
templates:
  - ingress.yaml
tests:
  - it: routes the per-PR host
    release:
      name: openkite-preview-42
      namespace: openkite-preview-42
    set:
      fullnameOverride: openkite-preview-42
      ingress.host: pr42-openkite.maklab.net
    asserts:
      - equal:
          path: spec.rules[0].host
          value: pr42-openkite.maklab.net

  - it: carries no TLS Secret, because the cluster gateway terminates TLS for the host
    # The *.maklab.net wildcard Secret lives in istio-system and a Secret cannot be
    # referenced across namespaces, so a per-PR Ingress has nothing to terminate TLS
    # with. Per-PR Ingresses are disabled for the same reason routing goes through
    # the gateway: a plain Ingress would serve the preview without the Access challenge.
    release:
      name: openkite-preview-42
      namespace: openkite-preview-42
    asserts:
      - isEmpty:
          path: spec.tls
