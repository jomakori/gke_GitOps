apiVersion: v1
kind: Service
metadata:
  name: {{ include "openkite-preview.fullname" . }}
  labels:
    {{- include "openkite-preview.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "openkite-preview.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
