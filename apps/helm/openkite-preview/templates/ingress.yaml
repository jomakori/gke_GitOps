{{- if .Values.ingress.enabled }}
# Standard Ingress with the 2-level wildcard TLS. NOTE: this cluster routes
# through Istio (see virtualservice.yaml); the Ingress is kept as the declared
# ingress artifact and works with any standard ingress controller.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openkite-preview.fullname" . }}
  labels:
    {{- include "openkite-preview.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "openkite-preview.fullname" . }}
                port:
                  name: http
{{- end }}
