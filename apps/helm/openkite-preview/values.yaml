# ── OpenKite PR preview workload ───────────────────────────────────────────
# The openkite-preview ApplicationSet injects per-PR values:
#   --set fullnameOverride=openkite-preview-<N>
#   --set image.repository=ghcr.io/jomakori/openkite
#   --set image.tag=pr-<N>
#   --set ingress.host=pr<N>-openkite.maklab.net
#   --set replicaCount=1

# Base name override (the ApplicationSet passes the numeric PR id).
nameOverride: ""
fullnameOverride: ""

# Deliver the namespace this release deploys into.
#
# `false` when the release lands in a namespace another Application already owns
# — the shared preview namespace. The ApplicationSet sets it `true` for every
# per-PR Application, so a preview owns its own namespace and closing the PR
# prunes the namespace together with the Deployment/Service/VirtualService and
# the preview's own AuthorizationPolicy.
namespace:
  create: false

replicaCount: 1

image:
  repository: ghcr.io/jomakori/openkite
  tag: latest
  # Always, not IfNotPresent: previews are tagged `pr-<N>` (mutable) and that tag
  # is re-pushed on every push to the PR. With IfNotPresent a node that already
  # pulled the tag keeps the STALE image, so a pushed fix never shows up in the
  # preview.
  pullPolicy: Always

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  # Injected per PR: pr<N>-openkite.maklab.net
  host: pr1-openkite.maklab.net
  className: ""
  path: /
  pathType: Prefix
  annotations: {}
  # Left empty on purpose. The preview host is served by the cluster gateway,
  # which terminates TLS with the `*.maklab.net` wildcard; a Secret cannot be
  # referenced across namespaces, and the per-PR Ingress is disabled anyway
  # (see the ApplicationSet's `ingress.enabled=false`) because a plain Ingress
  # reaches the pod without passing the Cloudflare Access challenge or the mesh
  # DENY policy — i.e. it would serve the preview unauthenticated.
  tls: []

# Istio routing (the cluster's actual ingress). The gateway is the cluster's own;
# it serves `*.maklab.net`, which matches every preview host.
istio:
  enabled: true
  gateway: istio-system/maklab-gateway
  # The Cloudflare Access DENY policy targets the gateway pods, and a policy binds
  # to the pods in its own namespace — so it is rendered into istio-system next to
  # the gateway it protects, not into the preview namespace.
  policyNamespace: istio-system
  gatewaySelector:
    istio: ingressgateway
  timeout: 30s
  retryAttempts: 3
  retryTimeout: 5s

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector:
  intent: apps

podAnnotations: {}
podLabels: {}
